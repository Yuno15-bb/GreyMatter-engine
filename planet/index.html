<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>🗺️ 3D/2D Knowledge Map — C Brain</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; background:#000; overflow:hidden;
    font-family:var(--disp); color:var(--ph-300); }
  #c{ display:block; width:100vw; height:100vh; cursor:grab; }
  #c:active{ cursor:grabbing; }

  #hud{ position:fixed; top:14px; left:16px; pointer-events:none; }
  #title{ font-size:13px; letter-spacing:1px; color:#e0d6c8; text-shadow:0 0 10px #000; }
  #counts{ font-size:11px; opacity:.75; margin-top:3px; }
  #fil{ font-size:11px; margin-top:6px; letter-spacing:.3px; }
  #fil .ici{ opacity:.55; }
  #fil .retour{ color:#5ad7e6; cursor:pointer; opacity:.9; }
  #fil .retour:hover{ opacity:1; text-decoration:underline; }
  #fil b{ color:#f3ede2; font-weight:500; }
  #viewtag{ font-size:11px; color:#5ad7e6; opacity:.85; margin-top:2px; }
  #modes{ display:flex; gap:6px; margin-top:7px; pointer-events:auto; }
  #modes button{ font-family:inherit; font-size:10px; letter-spacing:.5px; color:#cfc6ba;
    background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.14); border-radius:6px;
    padding:3px 8px; cursor:pointer; transition:all .15s; }
  #modes button:hover{ background:rgba(255,255,255,.1); }
  #modes button.on{ color:#07070b; background:#5ad7e6; border-color:#5ad7e6; font-weight:bold; }
  #grow{ font-size:11px; color:#f2c94c; opacity:0; transition:opacity .4s; margin-top:2px; }
  /* compteur d'ACTIVITÉ EN DIRECT : recalculé à l'image, il s'éteint tout seul quand la fenêtre passe */
  #livenow{ font-size:10.5px; color:#7fe9ff; opacity:.9; margin-top:6px; letter-spacing:.3px; }
  #livenow .off{ color:#7f8b93; }
  #session{ font-size:10.5px; color:#86c8b0; opacity:.85; margin-top:6px; letter-spacing:.3px; }
  #session b{ color:#cdeadd; font-weight:normal; }

  #legend{ position:fixed; bottom:14px; left:16px; font-size:10px; line-height:1.5; opacity:.9;
    max-height:62vh; overflow-y:auto; width:216px; padding-right:6px; }
  #legend .row{ display:flex; align-items:center; gap:6px; cursor:pointer; padding:1px 3px;
    border-radius:4px; }
  #legend .row:hover{ background:rgba(255,255,255,0.07); }
  #legend .nom{ flex:1 1 auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #legend .bar{ flex:0 0 42px; height:3px; background:rgba(255,255,255,0.09); border-radius:2px; overflow:hidden; }
  #legend .bar i{ display:block; height:100%; border-radius:2px; opacity:.75; }
  #legend .nb{ flex:0 0 26px; text-align:right; opacity:.6; font-variant-numeric:tabular-nums; }
  #legend .repli > summary{ cursor:pointer; list-style:none; opacity:.5; padding:3px 3px; }
  #legend .repli > summary::-webkit-details-marker{ display:none; }
  #legend .repli > summary::before{ content:"▸ "; }
  #legend .repli[open] > summary::before{ content:"▾ "; }
  #legend .repli > summary:hover{ opacity:.85; }
  #legend .repli em{ font-style:normal; opacity:.6; }
  #legend .mk{ opacity:.62; line-height:1.7; }
  #legend .dot{ width:9px; height:9px; border-radius:50%; box-shadow:0 0 6px currentColor; flex:none; }
  #legend .hd{ opacity:.5; letter-spacing:1px; text-transform:uppercase; font-size:9px; margin:5px 0 2px; }
  #legend .bdg{ width:11px; text-align:center; flex:none; font-size:11px; }

  #tip{ --accent:#888; position:fixed; right:18px; top:50%; width:300px; max-width:40vw; padding:15px 17px;
    background:linear-gradient(180deg, rgba(10,12,16,0.95), rgba(8,9,13,0.96));
    border:1px solid color-mix(in srgb, var(--accent) 38%, transparent);
    pointer-events:none; opacity:0; transition:opacity .16s ease, transform .16s ease;
    transform:translateY(-50%) translateX(12px);
    box-shadow:0 0 24px rgba(0,0,0,.6), inset 0 0 26px color-mix(in srgb, var(--accent) 8%, transparent);
    z-index:5; }
  #tip.show{ opacity:1; transform:translateY(-50%) translateX(0); }
  #tip::before, #tip::after, #tip .scan::before, #tip .scan::after{
    content:""; position:absolute; width:13px; height:13px; border:2px solid var(--accent); }
  #tip::before{ top:-1px; left:-1px; border-right:0; border-bottom:0; }
  #tip::after{ bottom:-1px; right:-1px; border-left:0; border-top:0; }
  #tip .scan::before{ top:-1px; right:-1px; border-left:0; border-bottom:0; }
  #tip .scan::after{ bottom:-1px; left:-1px; border-right:0; border-top:0; }
  #tip .scan{ position:absolute; inset:0; pointer-events:none; opacity:.6;
    background:repeating-linear-gradient(0deg, transparent 0 2px, rgba(255,255,255,0.022) 2px 3px); }
  #tip .src{ font-size:9px; letter-spacing:1.6px; text-transform:uppercase; color:var(--accent);
    display:flex; align-items:center; gap:7px; margin-bottom:10px; padding-bottom:9px;
    border-bottom:1px solid color-mix(in srgb, var(--accent) 24%, transparent); flex-wrap:wrap; }
  #tip .src .swatch{ width:7px; height:7px; transform:rotate(45deg);
    background:var(--accent); box-shadow:0 0 8px var(--accent); flex:none; }
  #tip .src .frontier{ color:#f3ede2; opacity:.7; letter-spacing:.5px; }
  #tip .n{ color:#f3ede2; font-weight:bold; font-size:13.5px; letter-spacing:1.4px;
    text-transform:uppercase; line-height:1.35;
    text-shadow:0 0 13px color-mix(in srgb, var(--accent) 55%, transparent); }
  #tip .mem{ margin-top:9px; font-size:9.5px; opacity:.72; line-height:1.5; letter-spacing:.3px; }
  #tip .mem b{ color:var(--accent); font-weight:normal; }
  #tip .ch{ display:none; margin-top:9px; font-size:9.5px; line-height:1.5; color:#e8b25a;
    border-left:2px solid #e0a13a; padding-left:8px; letter-spacing:.2px; }
  #tip .ch.show{ display:block; }
  #tip .cv{ display:none; margin-top:9px; font-size:9.5px; line-height:1.5; color:#f0d68a;
    border-left:2px solid #e8c860; padding-left:8px; letter-spacing:.2px; }
  #tip .cv.show{ display:block; }
  #tip .media{ display:none; margin-top:9px; font-size:9.5px; color:#5ad7e6; letter-spacing:.3px; }
  #tip .media.show{ display:block; }
  #tip .rs{ display:none; margin-top:9px; font-size:9.5px; color:#7fd4a0; letter-spacing:.3px;
    border-left:2px solid #7fd4a0; padding-left:8px; }
  #tip .rs.show{ display:block; }
  #tip .lnk{ margin-top:10px; display:flex; flex-wrap:wrap; gap:4px 5px; }
  #tip .lnk .hd{ width:100%; opacity:.42; font-size:8px; letter-spacing:1px; text-transform:uppercase; margin-bottom:1px; }
  #tip .lnk .c{ display:inline-flex; align-items:center; gap:4px; padding:1px 6px; font-size:8.5px;
    border-radius:9px; background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.08); letter-spacing:.2px; }
  #tip .lnk .c i{ width:6px; height:6px; border-radius:50%; background:var(--cc,#888); box-shadow:0 0 5px var(--cc,#888); flex:none; }
  #tip .lnk .c em{ font-style:normal; opacity:.5; font-size:7.5px; letter-spacing:.5px; }
  #tip .d{ opacity:.82; margin-top:11px; font-size:11.5px; line-height:1.55; }
  /* DEUX BLOCS ADRESSÉS. Chacun annonce à qui il parle : « pour toi » (humain, sans jargon)
     et « pour le modèle » (la fiche dense). Le premier est ouvert, le second replié — c'est
     l'ordre de lecture voulu, pas une hiérarchie de valeur. */
  #tip .bl{ margin-top:13px; border-left:2px solid var(--accent); padding-left:11px; }
  #tip .bl > header, #tip .bl > summary{ display:flex; align-items:baseline; gap:8px;
    font-size:8.5px; letter-spacing:1.4px; text-transform:uppercase; padding:1px 0 6px; }
  #tip .bl .qui{ color:var(--accent); opacity:.95; font-weight:600; }
  #tip .bl .quoi{ opacity:.38; letter-spacing:.6px; text-transform:none; font-size:9.5px; }
  #tip .bl .txt{ white-space:pre-wrap; }
  #tip .bl.clair .txt{ font-size:12.5px; line-height:1.72; opacity:.95; }
  #tip .bl.modele{ border-left-color:rgba(255,255,255,0.16); }
  #tip .bl.modele > summary{ cursor:pointer; list-style:none; }
  #tip .bl.modele > summary::-webkit-details-marker{ display:none; }
  #tip .bl.modele > summary .qui{ color:#cfd6e4; }
  #tip .bl.modele > summary::after{ content:"▸"; margin-left:auto; opacity:.4; }
  #tip .bl.modele[open] > summary::after{ content:"▾"; }
  #tip .bl.modele > summary:hover .qui{ color:#fff; }
  #tip .bl.modele .txt{ font-size:11px; line-height:1.72; opacity:.78; margin-top:4px; }
  #tip .f{ opacity:.55; margin-top:12px; font-size:9px; letter-spacing:.5px; word-break:break-all;
    padding-top:9px; border-top:1px solid rgba(255,255,255,0.07); color:var(--accent); }
  #tip .f::before{ content:"▸ "; opacity:.8; }
  #tip .x{ display:none; position:absolute; top:9px; right:11px; z-index:3;
    background:transparent; border:0; color:var(--accent); font-size:13px; cursor:pointer;
    font-family:inherit; line-height:1; padding:3px 5px; opacity:.75; }
  #tip .x:hover{ opacity:1; }
  #tip.expanded{ width:440px; max-width:48vw; pointer-events:auto; }
  #tip.expanded .x{ display:block; }
  #tip.expanded .body{ max-height:72vh; overflow-y:auto; padding-right:9px; }
  #tip.expanded .d{ font-size:12px; line-height:1.7; white-space:pre-wrap; opacity:.9; }
  #tip .body::-webkit-scrollbar{ width:7px; }
  #tip .body::-webkit-scrollbar-thumb{ background:color-mix(in srgb, var(--accent) 40%, transparent); border-radius:4px; }
  #tip .hint2{ display:none; }
  #tip.expanded .hint2{ display:block; margin-top:12px; font-size:8.5px; letter-spacing:.5px;
    text-transform:uppercase; opacity:.4; }

  #hint{ position:fixed; bottom:14px; right:16px; font-size:10px; opacity:.5; text-align:right; line-height:1.6; }

  /* ── PETIT ÉCRAN (téléphone, via `distant/`) ───────────────────────────────
     La planète est née sur un 27 pouces : ses panneaux sont posés dans les
     quatre coins d'un écran large. À 390 px de large, la légende des dix-huit
     régions et l'aide à la souris recouvrent le globe qu'elles commentent —
     et l'aide parle de molette et de survol, deux gestes qui n'existent pas
     sur un écran tactile.
     On ne redessine rien : sous 520 px on RETIRE ce qui ne sert pas là-bas et
     on resserre le reste. Aucune de ces règles ne peut atteindre le bureau. */
  @media (max-width: 520px) {
    #hint  { display:none; }
    #legend{ font-size:9px; line-height:1.5; max-height:32vh; opacity:.7;
             bottom:8px; left:10px; columns:2; column-gap:12px; }
    #hud   { top:8px; left:10px; }
    #title { font-size:11px; }
    #counts, #viewtag, #livenow, #session { font-size:9.5px; }
    #modes { flex-wrap:wrap; }
    /* la fiche survolée devient une feuille en bas, pas une colonne de droite */
    #tip   { right:8px; left:8px; width:auto; max-width:none; top:auto; bottom:8px;
             transform:none; font-size:12px; }
  }

  /* viewer 3D rejouable (Étage 4) */
  #viewer{ position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center, rgba(16,20,30,0.96), rgba(3,4,7,0.985)); }
  #viewer.show{ display:flex; }
  #viewer #vc{ width:min(70vw,720px); height:min(70vh,560px); cursor:grab; touch-action:none; }
  #viewer #vc:active{ cursor:grabbing; }
  #viewer .vcap{ position:absolute; bottom:7%; left:50%; transform:translateX(-50%); max-width:62vw;
    text-align:center; font-size:12px; color:#cfe0f0; letter-spacing:.3px; line-height:1.55; text-shadow:0 0 10px #000; }
  #viewer .vx{ position:absolute; top:20px; right:24px; background:transparent; border:1px solid #5ad7e6;
    color:#5ad7e6; font-size:11px; cursor:pointer; border-radius:7px; padding:5px 11px; font-family:inherit; letter-spacing:1px; }
  #viewer .vx:hover{ background:rgba(90,215,230,.12); }
  #viewer .vhint{ position:absolute; top:22px; left:24px; font-size:10px; opacity:.5; letter-spacing:.5px; color:#5ad7e6; }
</style>

:root{
  --ph-100:#FFC9B0; --ph-200:#FF6A2A; --ph-300:#FF4F0C; --ph-400:#E84503;
  --ph-500:#C23800; --ph-600:#9C2D00; --ph-700:#7A2200; --ph-800:#551700;
  --ph-900:#320D00; --ph-950:#150500; --void:#000;
  --disp:"Departure Mono",ui-monospace,Menlo,monospace;
  --glow:255,79,12;
}
body{ letter-spacing:.03em; }
#title{ -webkit-text-stroke:.4px currentColor; }   /* le contour ne sert qu'aux gros titres */
/* du texte de 10px sous un masque n'est pas lisible : on remonte à une taille d'instrument */
#counts,#fil,#viewtag,#grow,#livenow,#session{ font-size:11px; line-height:1.5; }
#legend{ font-size:11px; line-height:1.5; width:206px; }
#legend .hd{ font-size:9.5px; }
#modes button{ font-size:10px; padding:2px 7px; }
#tip{ font-size:11px; } #tip .mem,#tip .ch,#tip .cv,#tip .rs,#tip .media{ font-size:10.5px; }

/* ── panneaux resserrés ── */
#hud{ padding:6px 9px; } #hud #title{ font-size:10.5px; letter-spacing:.07em; }
#counts,#fil,#viewtag,#grow,#livenow,#session{ font-size:10px; line-height:1.45; }
#modes{ margin-top:5px; gap:4px; } #modes button{ font-size:9px; padding:1px 6px; }
#legend{ padding:6px 8px; max-height:54vh; font-size:10px; width:188px; }

/* ── l'aide en bas à droite : supprimée (demande l'auteur) ── */
#hint{ display:none !important; }

/* ── la fiche de survol ne doit JAMAIS dépasser l'écran ── */
#tip{ top:14px; transform:none; max-height:calc(100vh - 28px); overflow-y:auto;
  overscroll-behavior:contain; width:296px; }
#tip.show{ transform:none; }
#tip::-webkit-scrollbar{ width:6px; }
#tip::-webkit-scrollbar-thumb{ background:var(--ph-700); border-radius:3px; }

/* ── les connexions arrivent EN FIN de fiche, pas en plein milieu du survol ── */
#tip .body{ display:flex; flex-direction:column; }
#tip .src{order:0} #tip .n{order:1} #tip .mem{order:2}
#tip .ch{order:3} #tip .cv{order:4} #tip .rs{order:5} #tip .media{order:6}
#tip .d{order:7}
#tip .lnk{ order:8; margin-top:12px; padding-top:9px; border-top:2px dashed var(--ph-700); }
#tip .hint2{order:9} #tip .f{order:10}

/* ── le masque du tube : grille sombre PAR-DESSUS tout, statique ── */
#grille{ position:fixed; inset:0; pointer-events:none; z-index:2;
  background-image:
    repeating-linear-gradient(to right ,rgba(0,0,0,.34) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(to bottom,rgba(0,0,0,.34) 0 1px,transparent 1px 3px); }
@media (-webkit-min-device-pixel-ratio:2),(min-resolution:2dppx){
  /* Retina : le masque doit valoir 1 pixel PHYSIQUE, sinon c'est un grillage sur le texte */
  #grille{ background-image:
    repeating-linear-gradient(to right ,rgba(0,0,0,.30) 0 .5px,transparent .5px 1.5px),
    repeating-linear-gradient(to bottom,rgba(0,0,0,.30) 0 .5px,transparent .5px 1.5px); } }
#hud,#legend,#hint,#tip,#viewer{ z-index:10; }
#tip{ z-index:12; } #viewer{ z-index:20; }

/* ── panneaux au trait : 2px, jamais une surface ── */
/* ── PANNEAUX : plus d'aplat noir, une GRILLE FINE sur fond transparent ──
   Demande de l'auteur (2026-08-14) : « tous les panneaux à fond transparent » +
   « les fonds sont tous noirs, je voudrais plutôt une grille fine ».
   C'est aussi ce que fait la référence : l'intérieur des cadres de la console
   Destiny n'est pas noir, c'est un maillage fin qu'on voit à travers. */
/* ⚠️ PLUS DE CADRE AUTOUR DU TEXTE (l'auteur, 2026-08-14 : « ne doivent pas avoir de cadre »).
   Le cadre + la grille avaient été posés pour tous les panneaux ; sur les deux blocs de TEXTE
   ils enferment une lecture au lieu de la porter, et deux boîtes lumineuses tirent l'œil hors
   de la carte. Le cadre reste là où il désigne un INSTRUMENT — la capsule du globe, qui est
   une fenêtre et doit se lire comme telle. */
#hud, #legend, #hint{
  background:none; border:0; box-shadow:none; padding:0;
  text-shadow:0 0 3px #000, 0 0 8px rgba(0,0,0,.9); }
#hud{ top:16px; left:18px; }
#legend{ bottom:16px; left:18px; width:238px; }
#hint{ right:18px; bottom:16px; padding:7px 12px; }

/* ── LA PLANÈTE EN PETIT — capsule fixe, haut à droite ──
   Le SENS est passé au premier plan : c'est LUI qu'on lit en grand. Le globe de structure ne
   disparaît pas pour autant, il change de statut — d'écran principal il devient INSTRUMENT :
   il tourne, il répond au survol, mais il ne se manipule plus (ni glisser, ni molette).
   On y vise une famille, elle s'allume dans le nuage du sens. */
/* ⚠️ ELLE VIT DANS LA COLONNE DE GAUCHE, ENTRE LES DEUX PANNEAUX (l'auteur, 2026-08-14 :
   « déplace le globe entre les deux »). Le coin haut-droit obligeait la fiche de survol à
   descendre sous elle ; à gauche, la capsule occupe le seul vide que la page avait déjà, entre
   le HUD et la légende. `top` et `width` sont posés par `placerPod()` : l'espace entre les deux
   dépend de la hauteur de la fenêtre ET de la longueur de la légende, deux choses que le CSS ne
   sait pas mesurer l'une par rapport à l'autre. */
#pod{ position:fixed; top:0; left:18px; width:224px; z-index:4;
  background-color:transparent;
  background-image:
    repeating-linear-gradient(to right ,rgba(var(--glow),.11) 0 1px,transparent 1px 4px),
    repeating-linear-gradient(to bottom,rgba(var(--glow),.11) 0 1px,transparent 1px 4px);
  border:2px solid var(--ph-500); border-radius:9px; padding:5px 6px 4px;
  box-shadow:0 0 4px rgba(var(--glow),.4), 0 0 11px rgba(var(--glow),.13); }
#pod .hd{ font-family:var(--disp); font-size:9px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ph-400); padding:0 2px 2px; }
#pc{ display:block; width:208px; height:208px; cursor:grab; }
#pod .cap{ font-family:var(--disp); font-size:9.5px; line-height:1.35; color:var(--ph-200);
  min-height:13px; padding:2px 2px 0; letter-spacing:.03em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#pod .cap b{ color:var(--ph-100); font-weight:400; }
#pod .cap .off{ color:var(--ph-600); }
/* la fiche de survol récupère tout le côté droit : la capsule n'y est plus */

#title{ font-family:var(--disp); font-size:13px; letter-spacing:.09em; color:var(--ph-100);
  text-shadow:0 0 3px rgba(var(--glow),.6); }
#counts, #fil, #viewtag, #grow, #livenow, #session, #hint{
  color:var(--ph-300); text-shadow:0 0 2px rgba(var(--glow),.45); opacity:1; }
#counts{ font-size:11px; }
#fil b, #session b{ color:var(--ph-100); }
#fil .ici{ color:var(--ph-400); opacity:1; }
#fil .retour, #viewtag, #livenow, #session, #grow{ color:var(--ph-200); }
#livenow .off{ color:var(--ph-600); }
#hint b{ color:var(--ph-100); font-weight:400; }

/* ── boutons de mode : pilules MOTHER ── */
#modes button{ font-family:var(--disp); color:var(--ph-300); background:transparent;
  border:2px solid var(--ph-600); border-radius:999px; letter-spacing:.07em; padding:2px 9px;
  text-shadow:0 0 2px rgba(var(--glow),.5); }
#modes button:hover{ background:rgba(var(--glow),.10); border-color:var(--ph-400); color:var(--ph-100); }
#modes button.on{ color:#000; background:var(--ph-400); border-color:var(--ph-400);
  font-weight:400; -webkit-text-stroke:0; text-shadow:none;
  box-shadow:0 0 7px rgba(var(--glow),.6); }

/* ── légende : lignes de lecture « > libellé ....... valeur » ── */
#legend{ font-family:var(--disp); font-size:10.5px; }
#legend .hd{ color:var(--ph-400); opacity:1; letter-spacing:.1em; }
#legend .row:hover{ background:rgba(var(--glow),.12); }
#legend .nom{ color:var(--ph-200); }
#legend .nb{ color:var(--ph-100); opacity:1; font-variant-numeric:tabular-nums; }
#legend .bar{ background:var(--ph-900); height:4px; }
#legend .bar i{ opacity:1; box-shadow:0 0 5px rgba(var(--glow),.6); }
#legend .dot{ box-shadow:0 0 6px rgba(var(--glow),.7); }
#legend .mk{ color:var(--ph-300); opacity:1; }
#legend .repli > summary{ color:var(--ph-400); opacity:1; }

/* ── fiche au survol : panneau MOTHER, coins conservés ── */
#tip{ background-color:rgba(0,0,0,.55);
  background-image:
    repeating-linear-gradient(to right ,rgba(var(--glow),.11) 0 1px,transparent 1px 4px),
    repeating-linear-gradient(to bottom,rgba(var(--glow),.11) 0 1px,transparent 1px 4px);
  border:2px solid var(--ph-500); border-radius:9px;
  color:var(--ph-300); font-family:var(--disp);
  box-shadow:0 0 6px rgba(var(--glow),.45), 0 0 18px rgba(var(--glow),.16); }
#tip::before,#tip::after,#tip .scan::before,#tip .scan::after{ border-color:var(--ph-400); }
#tip .scan{ display:none; }                     /* la grille globale remplace ce faux scan */
#tip .src{ color:var(--ph-400); border-bottom:2px solid var(--ph-700); }
#tip .src .swatch{ box-shadow:0 0 8px rgba(var(--glow),.8); }
#tip .src .frontier{ color:var(--ph-200); opacity:1; }
#tip .n{ color:var(--ph-100); font-weight:400; text-shadow:0 0 3px rgba(var(--glow),.6); }
#tip .mem{ color:var(--ph-300); opacity:1; }
#tip .mem b{ color:var(--ph-100); }
#tip .ch{ color:var(--ph-200); border-left:2px solid var(--ph-400); }
#tip .cv{ color:var(--ph-200); border-left:2px solid var(--ph-500); }
#tip .rs{ color:var(--ph-200); border-left:2px solid var(--ph-600); }
#tip .media{ color:var(--ph-300); }

/* ══ MISE EN PLACE PROGRESSIVE (2026-08-14, demande de l'auteur) ══════════════
   Relevé image par image sur `video-1-31d62c.mp4` : rien n'apparaît pour faire
   joli. Les panneaux arrivent UN PAR UN dans l'ordre de lecture, parce qu'ils
   viennent d'être calculés ; le rapport s'écrit ligne à ligne ; une ligne de
   balayage passe UNE fois pendant le scan puis disparaît.
   Donc : coupe franche (pas de fondu souple — une machine n'a pas d'inertie),
   et l'écran final est strictement identique avec ou sans mouvement. */
@media (prefers-reduced-motion: no-preference){
  /* `steps(1)` n'atteint jamais sa valeur finale : deux keyframes explicites. */
  @keyframes mArrive{ 0%,99%{opacity:0} 100%{opacity:1} }
  #c        { animation:mArrive 40ms linear .05s both; }
  #hud      { animation:mArrive 40ms linear .28s both; }
  #hud #title    { animation:mArrive 40ms linear .40s both; }
  #hud #counts   { animation:mArrive 40ms linear .52s both; }
  #hud #viewtag  { animation:mArrive 40ms linear .60s both; }
  #hud #fil      { animation:mArrive 40ms linear .68s both; }
  #hud #modes    { animation:mArrive 40ms linear .80s both; }
  #hud #livenow, #hud #session, #hud #grow { animation:mArrive 40ms linear .92s both; }
  #legend   { animation:mArrive 40ms linear 1.06s both; }

     de haut en bas au début de chaque rechargement »). Elle passait une fois au chargement —
     sauf que la page se recharge toute seule dès que le graphe change : ce qui devait être un
     effet de démarrage rare devenait un clignotement régulier. Les panneaux, eux, arrivent

}

const CENTER_REGION = 'principles';              // les leçons transverses = capitale au centre (2D)
// palette désaturée/assourdie (data-poésie premium, pas néon)
const FIXED_COLOR = { 'principles':0xd9bd63, 'meta':0x57b6c4, 'life':0x5cbf92, 'agents':0xa183d4, 'projects':0x9298a2 };
const HOT = new THREE.Color(0xFFBCA2);

const POINT_TEX = (function(){ const s=64, cv=document.createElement('canvas'); cv.width=cv.height=s;
  const x=cv.getContext('2d'), g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);

// glyphe ▷ (Étage 4 : marqueur d'un nœud REJOUABLE = porte une capture 3D)
const PLAY_TEX = (function(){ const s=64, cv=document.createElement('canvas'); cv.width=cv.height=s;
  const x=cv.getContext('2d'); x.fillStyle='rgba(255,255,255,1)';
  x.beginPath(); x.moveTo(s*0.36,s*0.26); x.lineTo(s*0.36,s*0.74); x.lineTo(s*0.76,s*0.5); x.closePath(); x.fill();

// badges (petites icônes à côté du point) : ⚠ avis du challenger · ✦ conviction · ↻ à reprendre. Blanc → teinté par le Sprite.
function glyphTex(ch, font){ const s=64, cv=document.createElement('canvas'); cv.width=cv.height=s;
  const x=cv.getContext('2d'); x.fillStyle='#fff'; x.font=(font||'bold 44px')+' sans-serif';
  x.textAlign='center'; x.textBaseline='middle'; x.fillText(ch, s/2, s/2+3); return new THREE.CanvasTexture(cv); }
const WARN_TEX=glyphTex('!','bold 50px'), CONV_TEX=glyphTex('✦','42px'), RESUME_TEX=glyphTex('↻','bold 46px');
const REGLE_TEX=glyphTex('§','bold 44px');   // règle transverse : ses arcs ne sont dessinés qu'au survol

// ---------- scène ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
// PERF (leçon GPU overheating) : on plafonne le pixelRatio — le bloom coûte ∝ pixels ; la pleine
// Retina ×2 + post-process ferait chauffer. 1.5 garde la netteté, divise ~la charge fragment.
const DPR = Math.min(devicePixelRatio, 1.5);
renderer.setPixelRatio(DPR);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 2000);
camera.position.set(0, 6, 44);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 16; controls.maxDistance = 120; controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;
// 52 laissait l'anneau des régions (rayon 13) occuper le tiers central : beaucoup de vide et
// des amas minuscules. La carte à plat doit remplir le cadre — c'est une carte, pas une vignette.
// 52 → 34 (la carte remplissait le tiers central) → 42 : à 34 les familles du bord touchaient
// les panneaux et l'anneau débordait. l'auteur : « dézoom un peu ».
const CAM2D = new THREE.Vector3(0, 0, 42), ORIGIN = new THREE.Vector3(0,0,0);
// Cadrage du globe des familles : il se recadre en revenant du SENS, sinon il s'affiche à la
// distance où le nuage sémantique avait été laissé — même défaut que le « on ne voit rien ».
const CAM3D = new THREE.Vector3(0, 5, 34);

// ---------- post-process : bloom cinématique (glow doux sur les points) ----------
// strength modéré + threshold > 0 → seuls les corps lumineux (nœuds, filaments) rayonnent ;
// le fond sombre, le cœur et les liens gris discrets restent nets (pas de voile laiteux).
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
// doux : strength bas + threshold HAUT → seuls les cœurs les plus lumineux scintillent (pas de blobs pâles)
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.12, 0.32, 0.72);
composer.addPass(bloom);
composer.addPass(new OutputPass());

function resize(){ const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false); composer.setSize(w,h); bloom.setSize(w,h);
  camera.aspect=w/h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

// ---------- fond ----------
(function starfield(){
  const N=1800, pos=new Float32Array(N*3);
  for(let i=0;i<N;i++){ const r=400+Math.random()*600, u=Math.random(), v=Math.random(), th=2*Math.PI*u, ph=Math.acos(2*v-1);
    pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=r*Math.sin(ph)*Math.sin(th); pos[i*3+2]=r*Math.cos(ph); }
  const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color:0x5B1A00, size:1.1, sizeAttenuation:false, transparent:true, opacity:.7 })));
})();
const coreMat = new THREE.MeshBasicMaterial({ color:0x160600, transparent:true, opacity:0.14 });
// LE GLOBE DEVIENT TRANSPARENT (l'auteur, 2026-08-14 : « posé autour d'un globe transparent »).
// Le corps sombre et opaque faisait « planète » et écrasait tout ; l'enlever complètement a
// donné des amas qui flottaient sans rien pour les tenir ensemble — on ne voyait plus qu'ils
// étaient posés sur une même sphère. Il reste donc, mais en verre :
//  · une coque vue de l'INTÉRIEUR (BackSide) : elle donne le volume sans jamais passer devant
//    un amas de la face avant. Peinte à l'endroit, elle voilerait tout ce qu'on regarde.
//  · un maillage de méridiens et parallèles, très faible : c'est lui qui fait lire la SPHÈRE.
//    Sans lignes, une teinte uniforme ne dit pas si l'on voit une boule ou un disque.
const core = new THREE.Mesh(new THREE.SphereGeometry(R*0.985, 48, 48), coreMat);
const verre = new THREE.Mesh(new THREE.SphereGeometry(R*0.99, 48, 48),
  new THREE.MeshBasicMaterial({ color:0x350F00, transparent:true, opacity:0.13,
                                side:THREE.BackSide, depthWrite:false }));
scene.add(verre);
// ⚠️ PAS `WireframeGeometry` : sur une sphère elle rend TOUTES les arêtes des triangles,
// diagonales comprises — un filet de pêche, pas un globe. Mesuré à l'œil sur capture.
// On trace donc les vraies lignes d'un globe : des méridiens et des parallèles, peu nombreux.
const grille = (function(){
  const pts=[], MER=12, PAR=5, FIN=64;
  for(let m=0;m<MER;m++){ const lon=2*Math.PI*m/MER;
    for(let i=0;i<FIN;i++){ for(const t of [i/FIN, (i+1)/FIN]){ const lat=Math.PI*(t-0.5);
      pts.push(new THREE.Vector3(Math.cos(lat)*Math.cos(lon), Math.sin(lat), Math.cos(lat)*Math.sin(lon)).multiplyScalar(R*0.995)); } } }
  for(let k=1;k<=PAR;k++){ const lat=Math.PI*(k/(PAR+1)-0.5), cy=Math.sin(lat)*R*0.995, cr=Math.cos(lat)*R*0.995;
    for(let i=0;i<FIN;i++){ for(const t of [i/FIN, (i+1)/FIN]){ const a2=2*Math.PI*t;
      pts.push(new THREE.Vector3(Math.cos(a2)*cr, cy, Math.sin(a2)*cr)); } } }
  const g=new THREE.BufferGeometry().setFromPoints(pts);
  return new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color:0x872600,
    transparent:true, opacity:0.07, depthWrite:false }));
})();
scene.add(grille);
// (atmosphère supprimée — pas de halo bleuté autour du globe, sur demande)

function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0)/4294967296; }

// ---------- régions (continents) ----------
const regionOf = n => n.primary_project || DOM_REGION[n.domain] || n.domain;
let REGION_DIR={}, REGION_2D={}, REGION_COLOR={}, REGION_LIST=[], REGION_COUNT={}, REGION_AFF={}, REGION_NODES={};
function layoutRegions(data){
  REGION_DIR={}; REGION_2D={}; REGION_COLOR={}; REGION_COUNT={}; REGION_AFF={}; REGION_NODES={};
  const projects = data.projects || [];
  const present=[], seen=new Set(), nreg={};
  for(const n of data.nodes){ const r=regionOf(n); REGION_COUNT[r]=(REGION_COUNT[r]||0)+1; nreg[n.id]=r;
    (REGION_NODES[r]=REGION_NODES[r]||[]).push(n.id);
    if(!seen.has(r)){ seen.add(r); present.push(r); } }
  // affinité inter-régions = nb de liens qui croisent deux continents
  const aff={}, deg={}; for(const r of present) deg[r]=0;
  for(const l of data.links){ const ra=nreg[l.source], rb=nreg[l.target]; if(!ra||!rb||ra===rb) continue;
    const k=ra<rb?ra+'|'+rb:rb+'|'+ra; aff[k]=(aff[k]||0)+1; deg[ra]++; deg[rb]++; }
  const affOf=(a,b)=> aff[a<b?a+'|'+b:b+'|'+a]||0;
  REGION_AFF=aff;                                  // réutilisé par la vue d'ensemble (liens agrégés)
  // ordre glouton : on enchaîne les continents les plus reliés → voisins sur la spirale
  const order=[], used=new Set();
  let cur=present.slice().sort((a,b)=>deg[b]-deg[a])[0]; order.push(cur); used.add(cur);
  while(order.length<present.length){
    let best=null, bs=-1;
    for(const r of present){ if(used.has(r)) continue; const s=affOf(cur,r);
      if(s>bs || (s===bs && best && deg[r]>deg[best])){ bs=s; best=r; } }
    if(best===null) best=present.find(r=>!used.has(r));
    order.push(best); used.add(best); cur=best;
  }
  // ⚠️ L'ordre glouton ci-dessus commence par la région la PLUS RELIÉE, et la spirale de
  // Fibonacci commence au pôle nord. Comme les grosses régions sont aussi les plus reliées,
  // les cinq plus gros amas atterrissaient côte à côte en haut du globe et la moitié basse ne
  // portait que des points isolés. Mesuré sur capture, deux fois de suite.
  // On répartit donc les régions par TAILLE le long de la spirale, en suite de van der Corput :
  // le plus gros au premier emplacement, le deuxième à mi-chemin, le troisième au quart, etc.
  // Deux gros ne peuvent plus être voisins. On perd l'adjacence par affinité — elle n'était de
  // toute façon lisible nulle part, alors que l'entassement, lui, se voyait.
  // ⚠️ LE PLUS GROS NE DOIT PAS TOMBER AU PÔLE. La suite de van der Corput qui remplaçait
  // l'ordre glouton donnait v=0 à la plus grosse région, donc l'emplacement i=0 de la spirale,
  // qui est EXACTEMENT le pôle nord. Comme `principes` porte 170 fiches sur 357, la carte
  // penchait au nord : 93 % du contenu au-dessus de 30° N, mesuré sur les amas pondérés par
  // leur effectif (`planete-cdp.mjs repartition`). Le problème n'était pas que deux gros se
  // touchent — c'était réglé — mais que le plus gros soit au point le plus mal placé du globe.
  // ⚠️ ET PAS DAVANTAGE TOUTES À L'ÉQUATEUR. Premier correctif : emplacements triés par
  // |latitude| croissante, les plus grosses au centre. Mesuré aussitôt : 97 % de l'encre entre
  // ±30°, densité 0,1 — les cinq plus grosses régions font 90 % du contenu, les serrer autour
  // de l'équateur ne fait que déplacer l'entassement au lieu de le défaire.
  // Ce qu'il faut, c'est DISPERSER les grosses : la suite de van der Corput démarrée à k=1 donne
  // ½, ¼, ¾, ⅛, ⅝… — la plus grosse à l'équateur, la deuxième à mi-chemin du nord, la troisième
  // à mi-chemin du sud, et ainsi de suite. Aucune ne tombe sur un pôle (c'est vdc(0)=0 qui y
  // menait), et deux grosses ne sont jamais voisines. Les pôles reviennent aux régions à une
  // fiche, où le vide ne coûte rien.
  // suite de van der Corput (base 2) : 0, ½, ¼, ¾, ⅛… — démarrée à k=1, elle donne ½, ¼, ¾…
  const vdc = k => { let d=0, b2=0.5; while(k>0){ d += (k&1)*b2; k>>=1; b2/=2; } return d; };
  const nreg2 = present.length;
  const parTaille = present.slice()
    .sort((x,y)=>(REGION_COUNT[y]-REGION_COUNT[x]) || (x<y?-1:1)); // gros → petits, départage stable
  const placeDe = {}, pris = new Array(nreg2).fill(false);
  parTaille.forEach((r,k)=>{
    let j = Math.min(nreg2-1, Math.floor(vdc(k+1)*nreg2));
    // emplacement déjà pris → le plus proche encore libre, de proche en proche
    for(let d=1; pris[j] && d<=nreg2; d++){
      if(j-d>=0 && !pris[j-d]) { j=j-d; break; }
      if(j+d<nreg2 && !pris[j+d]) { j=j+d; break; }
    }
    pris[j]=true; placeDe[r]=j;
  });
  // ⚠️ LA LATITUDE NE SUFFIT PAS : IL FAUT AUSSI ÉCARTER LES LONGITUDES. Avec la longitude de la
  // spirale (angle d'or × indice), les cinq plus grosses régions ont atterri aux longitudes 210°,
  // 262°, 275°, 294° et 327° — un tiers du globe pour 90 % du contenu. Vu sur capture : la face
  // avant ne montrait plus que des régions à UNE fiche, et tout ce qui pèse était derrière.
  // Ce n'était pas un hasard d'angle : choisir les latitudes par van der Corput sélectionne des
  // indices voisins de puissances de 2, dont l'angle d'or fait des longitudes corrélées.
  // On donne donc à chaque région sa propre longitude, par van der Corput en base 3 sur le RANG
  // DE TAILLE : 0°, 120°, 240°, 40°, 160°… Les cinq plus grosses sont écartées par construction,
  // quel que soit l'emplacement en latitude qu'elles ont reçu.
  const vdc3 = k => { let d=0, b3=1/3; while(k>0){ d += (k%3)*b3; k=Math.floor(k/3); b3/=3; } return d; };
  const lonDe = {};
  parTaille.forEach((r,k)=>{ lonDe[r] = 2*Math.PI*vdc3(k); });
  REGION_LIST = present.slice().sort((x,y)=>placeDe[x]-placeDe[y]); // remis dans l'ordre de la spirale
  // ⚠️ C'est REGION_LIST qui pilote la spirale, pas `order`. Premier essai : j'avais recalculé
  // REGION_LIST au-dessus sans toucher à cette boucle, qui continuait de lire `order` — les
  // positions n'avaient donc pas bougé d'un pixel, et la mesure l'a dit tout de suite (les cinq
  // plus gros toujours entre 27° et 72° nord). Une variable renommée à moitié ne change rien.
  const n=REGION_LIST.length;
  REGION_LIST.forEach((r,i)=>{ const y = n>1 ? 1-2*i/(n-1) : 0, rad=Math.sqrt(Math.max(0,1-y*y));
    // `(i+0.5)/n` s'arrête à ±72° : le haut et le bas du globe restaient nus. `i/(n-1)`
    // place la première région exactement au pôle nord et la dernière au pôle sud, donc
    // les amas couvrent la sphère entière au lieu d'une bande.
    const lo = lonDe[r] ?? (Math.PI*(3-Math.sqrt(5))*i);   // repli : longitude en angle d'or
    REGION_DIR[r]=new THREE.Vector3(Math.cos(lo)*rad, y, Math.sin(lo)*rad).normalize(); });
  // 2D : capitale (principes) au centre, le reste sur un anneau (même ordre d'affinité)
  const ring=REGION_LIST.filter(r=>r!==CENTER_REGION);
  ring.forEach((r,i)=>{ const a=2*Math.PI*i/Math.max(1,ring.length); REGION_2D[r]={x:Math.cos(a),y:Math.sin(a)}; });
  REGION_2D[CENTER_REGION]={x:0,y:0};
  // ── DES COULEURS QUI SE DISTINGUENT VRAIMENT ──
  // La teinte d'un projet était `indice/nombre`, sans regarder les 5 couleurs fixes des régions
  // transverses. Résultat mesuré sur capture : `claude-brain` tombait dans le même doré que
  // `principes`, et leurs deux amas voisins se lisaient comme un seul. Une séparation nette
  // (ce que l'auteur demande) passe autant par la couleur que par la distance.
  // On écarte donc chaque teinte de projet des teintes déjà prises — fixes ET précédentes.
  // ── MOTHER : UNE SEULE TEINTE (17°, mesurée sur la console Destiny) ──
  // La couleur ne dit plus « quelle région » — 13 régions sur 20 portaient ≤2 fiches, soit
  // 13 teintes pour 4 % du contenu. C'est la LUMINANCE qui parle, et elle dit le POIDS :
  // la région la plus peuplée est la plus allumée. La région se lit par sa grappe + son étiquette.
  // ── MOTHER, corrigé après essai réel ──
  // Une teinte unique rendait le mode « sens » illisible : là, la POSITION dit la proximité
  // sémantique, donc elle ne dit plus la région — la couleur était le seul signal restant.
  // La luminance ne remplace pas la teinte pour une variable nominale à 20 niveaux.
  // Solution : un ÉCART DE TEINTE À L'INTÉRIEUR DE LA BANDE PHOSPHORE (2° → 42°, du rouge
  // à l'ambre). Ça reste une seule famille — aucun cyan, aucun vert — mais les 6 grandes
  // régions se séparent. Les 14 petites (≤2 fiches) restent sur la teinte de référence, 17°,
  // et s'éteignent : 13 couleurs pour 4 % du contenu, c'était le défaut mesuré.
  const rang=[...REGION_LIST].sort((a2,b2)=>(REGION_COUNT[b2]||0)-(REGION_COUNT[a2]||0));
  const GRANDES=6;
  rang.forEach((r,i)=>{
    if(i<GRANDES){
      // bande resserrée 9°→29° et DÉSATURÉE : à saturation 1 le jaune et le rose viraient au
      // fluo — un phosphore n'est jamais saturé comme une LED. On sépare quand même les 6.
      const t = GRANDES>1 ? i/(GRANDES-1) : 0;
      REGION_COLOR[r]=new THREE.Color().setHSL((9+20*t)/360, 0.78, 0.44 - 0.04*t);
    } else {
      const t = (i-GRANDES)/Math.max(1,rang.length-GRANDES-1);
      REGION_COLOR[r]=new THREE.Color().setHSL(17/360, 0.80, 0.29 - 0.10*t);
    } });
}
const colorOf = n => REGION_COLOR[regionOf(n)] || new THREE.Color(0xffffff);
const spreadOf = r => 0.12 + 0.05*Math.sqrt(REGION_COUNT[r]||1);   // continent plus grand si plus peuplé

// ---------- placement 3D (continent) & 2D (carte) ----------
function anchor3(n){
  const m=n.membership||{};
  if(n.primary_project){ const v=new THREE.Vector3(); let tot=0;
    for(const c in m){ if(REGION_DIR[c]){ v.addScaledVector(REGION_DIR[c], m[c]); tot+=m[c]; } }
    if(tot>0) return v.normalize(); }
  return (REGION_DIR[regionOf(n)]||UP).clone();
}
function anchor2(n){
  const m=n.membership||{};
  if(n.primary_project){ let x=0,y=0,tot=0;
    for(const c in m){ if(REGION_2D[c]){ x+=REGION_2D[c].x*m[c]; y+=REGION_2D[c].y*m[c]; tot+=m[c]; } }
    if(tot>0) return {x:x/tot,y:y/tot}; }
  const b=REGION_2D[regionOf(n)]||{x:0,y:0}; return {x:b.x,y:b.y};
}
// placement INTELLIGENT : tournesol par continent, rangé par échelle (cœur=vision → bord=détail)
let posById={};
function layoutNodes(data){
  posById={};
  const groups={};
  for(const n of data.nodes){ const r=regionOf(n); (groups[r]=groups[r]||[]).push(n); }
  for(const r in groups){
    const arr=groups[r].sort((a,b)=>(a.scale-b.scale)||(hash(a.id)-hash(b.id)));
    const m=arr.length, sp=spreadOf(r), base=(REGION_DIR[r]||UP).clone();
    const t1=new THREE.Vector3().crossVectors(base, Math.abs(base.y)<0.9?UP:RIGHT).normalize();
    const t2=new THREE.Vector3().crossVectors(base, t1).normalize();
    const c2=REGION_2D[r]||{x:0,y:0};
    arr.forEach((n,i)=>{
      const f=(i+0.5)/m, ang=i*2.39996323;                 // angle d'or → packing régulier
      const rr=sp*Math.sqrt(f);                             // centre-out : i=0 (scale faible) au cœur
      const dir=base.clone().multiplyScalar(Math.cos(rr))
        .add(t1.clone().multiplyScalar(Math.sin(rr)*Math.cos(ang)))
        .add(t2.clone().multiplyScalar(Math.sin(rr)*Math.sin(ang))).normalize();
      const RR=(0.6+7*sp)*Math.sqrt(f);
      posById[n.id]={ p3:dir.multiplyScalar(R), p2:new THREE.Vector3(c2.x*S2+Math.cos(ang)*RR, c2.y*S2+Math.sin(ang)*RR, 0) };
    });
  }
  // frontières : posées SUR la frontière entre leurs deux villes (mélange des ancres)
  for(const n of data.nodes){ if(n.frontier){
    const d3=anchor3(n), b2=anchor2(n);
    posById[n.id]={ p3:d3.multiplyScalar(R*1.004), p2:new THREE.Vector3(b2.x*S2, b2.y*S2, 0) }; }}
}

// ---------- état du graphe ----------
let group=new THREE.Group(); scene.add(group);
let nodeObjs=[], linkObjs=[], coactObjs=[], regionObjs=[], regionLinks=[];
let prevIds=new Set();
// fenêtre de l'ACTIVITÉ EN DIRECT, en secondes (valeur réelle reçue dans graph.json ; 10 min par défaut).
let LIVE_WINDOW_S=600;
const liveEl=document.getElementById('livenow');
let _liveShown=-1;                       // n'écrit dans le DOM que quand le compte CHANGE (pas 60×/s)
const tip=document.getElementById('tip');
const SEG=14;

function clearGroup(){ group.removeFromParent(); group.traverse(o=>{ o.geometry?.dispose?.(); o.material?.dispose?.(); }); group=new THREE.Group(); scene.add(group); nodeObjs=[]; linkObjs=[]; coactObjs=[]; regionObjs=[]; regionLinks=[]; }

// Étiquette lisible : les 20 bulles de la vue d'ensemble portent leur NOM. C'est la différence
// entre « une carte » et « un joli nuage » — 354 points ne peuvent pas être étiquetés, 20 si.
const LABEL_W = 4.6, LABEL_H = 0.62;

// ── DÉCOLLAGE DES ÉTIQUETTES EN ESPACE ÉCRAN ────────────────────────────────────────────
// LE DÉFAUT (2026-08-16, rapporté par Maissane Lagsir sur un tronc de 5 familles) :
// les amas sont écartés en 3D (boucle « ÉCARTEMENT CALCULÉ » plus bas), jamais à l'écran.
// Deux familles très éloignées EN PROFONDEUR mais alignées sur l'axe de la caméra
// impriment donc leurs noms l'un sur l'autre — `agents 8` et `principles 3` se sont
// soudés en une tache illisible au centre de la vue.
//
// ⚠️ ET C'EST PIRE SUR UN PETIT TRONC, c'est-à-dire chez tout nouvel utilisateur : le rayon
// d'un amas vaut `SENS_TAILLE * cbrt(n)`, donc à 8 et 3 fiches les amas sont minuscules, le
// nuage se tasse, et le recouvrement devient quasi certain. La mise en page était calibrée
// sur un tronc de 177 fiches dans une seule famille — le contraire du premier jour.
//
// ON ESTOMPE, ON NE DÉPLACE PAS. Pousser les noms le long de Y les décrocherait de leur amas :
// on gagnerait la lisibilité du texte en perdant ce qu'il désigne. Le plus proche de la caméra
// garde sa pleine opacité, ceux qu'il couvre s'effacent — et tourner la vue les rend, ce qui
// est déjà le geste que les utilisateurs trouvent tout seuls.
// On réutilise `toScreen()` (défini plus bas) plutôt que d'ouvrir une seconde projection :
// deux écritures du même calcul divergent toujours, et la divergence ne se voit pas.
const _posEtiq = new THREE.Vector3(), _bordEtiq = new THREE.Vector3(), _droiteEtiq = new THREE.Vector3();
function decollerEtiquettes(){
  // Axe horizontal de la caméra = 1re colonne de sa matrice monde. Recalculé ici plutôt que
  // repris de `magnet()` : magnet() tourne APRÈS cette passe, sa valeur aurait une image de retard.
  _droiteEtiq.setFromMatrixColumn(camera.matrixWorld, 0);
  const vus = [];
  for(const b of regionObjs){
    const lab = b.userData.lab;
    if(!lab.visible || lab.material.opacity <= 0.02) continue;
    lab.getWorldPosition(_posEtiq);
    const centre = toScreen(_posEtiq);
    if(!centre) continue;                          // derrière la caméra : rien à arbitrer
    // Demi-largeur RÉELLE à l'écran : on projette un second point décalé de LABEL_W/2 le long
    // de l'axe horizontal de la caméra. Un ratio fixe en pixels serait faux dès qu'on zoome.
    _bordEtiq.copy(_posEtiq).addScaledVector(_droiteEtiq, LABEL_W * 0.5);
    const bord = toScreen(_bordEtiq);
    const dx = bord ? Math.abs(bord.x - centre.x) || 6 : 6;
    vus.push({ lab, x:centre.x, y:centre.y, dx, dy: dx * (LABEL_H / LABEL_W),
               prof: _posEtiq.distanceTo(camera.position) });
  }
  vus.sort((a, b) => a.prof - b.prof);            // le plus proche décide, les autres cèdent
  const gardes = [];
  for(const e of vus){
    let couvert = false;
    for(const g of gardes){
      // 0,9 horizontalement (les noms tolèrent de se frôler sur les côtés), mais 1,6
      // VERTICALEMENT. Mesuré sur le cas rapporté : six étiquettes empilées dans 15 px, et
      // `principles` à 12 px du nom de devant restait à pleine opacité — juste hors d'un seuil
      // symétrique. Une étiquette est très plate (0,62 pour 4,6 de large) : sa demi-hauteur
      // vaut 13 % de sa demi-largeur, donc un seuil vertical calculé au même facteur ne
      // rattrape presque aucun empilement, qui est pourtant LA forme que prend le défaut.
      if(Math.abs(e.x - g.x) < (e.dx + g.dx) * 0.9 &&
         Math.abs(e.y - g.y) < (e.dy + g.dy) * 1.6){ couvert = true; break; }
    }
    // 0,12 et non 0 : un nom qui disparaît complètement fait croire à une famille absente.
    // Assez faible pour ne plus brouiller le nom de devant, assez présent pour dire « il y a
    // quelque chose ici, tourne ».
    if(couvert) e.lab.material.opacity *= 0.12;
    else gardes.push(e);
  }
}
function texteTex(txt){
  const dpr=2, w=320, h=44, cv=document.createElement('canvas');
  cv.width=w*dpr; cv.height=h*dpr;
  const x=cv.getContext('2d'); x.scale(dpr,dpr);
  x.font='21px "Departure Mono", ui-monospace, Menlo, monospace';
  x.textAlign='center'; x.textBaseline='middle';
  x.shadowColor='rgba(0,0,0,0.95)'; x.shadowBlur=7;            // lisible même par-dessus une bulle claire
  x.fillStyle='rgba(255,188,162,0.97)'; x.fillText(txt, w/2, h/2, w-10);
  const t=new THREE.CanvasTexture(cv); t.anisotropy=4; return t;
}

// ════════ LE NUAGE DU SENS, RASSEMBLÉ PAR FAMILLE ════════
// Demande de l'auteur (2026-08-14) : « on réattaque la structure de l'amas par famille ».
// État de départ : la position d'une fiche venait à 100 % de son vecteur sémantique, donc les
// 60 fiches d'un même projet étaient éparpillées dans tout le nuage. On voyait un confetti et il
// fallait viser une famille dans la capsule pour savoir où elle était.
//
// Le compromis retenu — et c'en est un, il faut le nommer :
//   · À L'INTÉRIEUR d'une famille, la disposition reste EXACTEMENT celle du sens. Ce qui se
//     ressemble reste voisin ; on ne perd rien de ce que les embeddings ont trouvé.
//   · ENTRE les familles, on écarte : chaque amas part du centre de gravité sémantique de sa
//     famille (deux familles qui parlent de la même chose restent donc voisines), puis on
//     repousse celles qui se chevauchent jusqu'à ce qu'elles se détachent.
// Ce qu'on PERD : la distance exacte entre deux fiches de familles différentes n'est plus
// lisible au pixel près — elle est déformée par l'écartement. Ce qu'on GAGNE : on voit enfin
// où est une famille sans avoir à la désigner.
let SENS_FAMILLES = true;
// ⚠️ RACINE CUBIQUE, PAS RACINE CARRÉE. En racine carrée, `principes` (177 fiches) faisait
// 13 unités de rayon contre 1 pour une famille d'une fiche : un amas couvrait le tiers du nuage
// et les dix-neuf autres devenaient des miettes autour. En racine CUBIQUE, la densité est la
// même partout — le VOLUME d'un amas dit son effectif, ce qui est justement ce qu'on veut lire —
// et l'écart tombe de 13× à 5,6×. Les vingt amas redeviennent comparables.
const SENS_TAILLE = 2.0;      // rayon d'un amas = ce facteur × racine cubique du nombre de fiches
const SENS_MARGE  = 3.2;      // le vide qu'on garde entre deux amas — c'est lui qui les fait LIRE comme des îles
const SENS_RAYON  = SEM*1.35; // le nuage entier tient dans ce rayon, quelle que soit l'échelle
function positionSens(nd){
  const e2 = nd.embed2;
  if(!e2) return null;
  return (e2.length>=3) ? new THREE.Vector3(e2[0]*SEM, e2[1]*SEM, e2[2]*SEM)
                        : new THREE.Vector3(e2[0]*SEM, e2[1]*SEM, 0);
}
function layoutSens(data){
  const brut={}, sortie={};
  for(const nd of data.nodes){ const p=positionSens(nd); if(p) brut[nd.id]=p; }
  // 1. centre de gravité et étendue de chaque famille, dans l'espace du sens
  const fam={};
  for(const nd of data.nodes){
    if(!brut[nd.id]) continue;
    (fam[regionOf(nd)] = fam[regionOf(nd)] || { ids:[], c:new THREE.Vector3() }).ids.push(nd.id);
  }
  for(const r in fam){ const f=fam[r];
    for(const id of f.ids) f.c.add(brut[id]);
    f.c.multiplyScalar(1/f.ids.length);
    f.etendue = Math.max(0.6, f.ids.reduce((m,id)=>Math.max(m, brut[id].distanceTo(f.c)), 0));
    // ⚠️ LA TAILLE D'UN AMAS DIT SON EFFECTIF, PAS SON ÉTALEMENT SÉMANTIQUE. Premier essai :
    // on gardait l'étendue brute, simplement resserrée — `principes` (177 fiches, très étalées)
    // occupait alors la moitié du nuage et repoussait les 19 autres familles en traînée d'un
    // seul côté. Vu en capture : une grosse tache et une comète. En racine du nombre, un amas
    // de 4 fiches reste petit, un amas de 177 reste grand, et le rapport se lit à l'œil.
    f.R = SENS_TAILLE*Math.cbrt(f.ids.length);
  }
  const liste=Object.values(fam);
  // 2. ÉCARTEMENT CALCULÉ, PAS FIXÉ. Mesuré : les centres de gravité des 20 familles tiennent
  // dans ±5 unités (dispersion par axe 3,9 / 4,6 / 4,6) alors qu'un amas monte à 13 de rayon.
  // Avec un facteur en dur (×1,3), tout se chevauchait au départ et la séparation devait pousser
  // sur de longues distances : elle fabriquait une CHAÎNE, vue en capture — une grosse tache et
  // une comète. On part donc d'une configuration déjà à peu près libre : on déduit le rayon
  // qu'il faut pour loger tous les amas, et on y rapporte la dispersion réelle des centres.
  const volume = liste.reduce((s,f)=>s + f.R*f.R*f.R, 0);
  const rayonNecessaire = Math.cbrt(volume/0.30);            // 0.30 = target packing ratio (leaves air)
  const dispersion = Math.sqrt(liste.reduce((s,f)=>s + f.c.lengthSq(), 0)/liste.length);
  const ecart = dispersion>1e-3 ? (rayonNecessaire*0.62)/dispersion : 1;
  for(const f of liste) f.a = f.c.clone().multiplyScalar(ecart);   // le sens décide OÙ, on écarte
  // 3. on sépare ce qui se chevauche encore — chacun ne bouge que du minimum nécessaire,
  //    donc la géographie sémantique d'ensemble tient : deux familles proches le restent.
  for(let it=0; it<120; it++){
    let bouge=false;
    for(let i=0;i<liste.length;i++) for(let j=i+1;j<liste.length;j++){
      const A=liste[i], B=liste[j];
      const d=A.a.distanceTo(B.a), min=A.R+B.R+SENS_MARGE;
      if(d<min && d>1e-4){
        const k=(min-d)/2/d; bouge=true;
        const dx=(A.a.x-B.a.x)*k, dy=(A.a.y-B.a.y)*k, dz=(A.a.z-B.a.z)*k;
        A.a.x+=dx; A.a.y+=dy; A.a.z+=dz; B.a.x-=dx; B.a.y-=dy; B.a.z-=dz;
      }
    }
    if(!bouge) break;
  }
  // 4. recentrer et remettre à l'échelle : la séparation pousse toujours dans le même sens et
  //    finit par déporter le nuage entier hors du cadre (vu en capture, il partait à droite).
  const centre=new THREE.Vector3();
  for(const f of liste) centre.addScaledVector(f.a, f.ids.length);
  centre.multiplyScalar(1/data.nodes.length);
  let loin=0;
  for(const f of liste) loin = Math.max(loin, f.a.distanceTo(centre) + f.R);
  const echelle = loin>0 ? SENS_RAYON/loin : 1;
  // 5. chaque fiche garde sa place RELATIVE dans sa famille : même voisinage sémantique,
  //    seulement rapporté au rayon de l'amas.
  for(const r in fam){ const f=fam[r];
    const k = (f.R/f.etendue)*echelle;
    const ancre = f.a.clone().sub(centre).multiplyScalar(echelle);
    for(const id of f.ids)
      sortie[id] = brut[id].clone().sub(f.c).multiplyScalar(k).add(ancre);
  }
  // les ancres servent aussi aux ÉTIQUETTES : dans le nuage du sens, tout est de la même
  // teinte phosphore — sans le nom de la famille au-dessus de son amas, le regroupement est
  // réel (mesuré) mais invisible à l'œil.
  const ancres = {};
  for(const r in fam) ancres[r] = { pos: fam[r].a.clone().sub(centre).multiplyScalar(echelle),
                                    rayon: fam[r].R*echelle };
  return { brut, sens:sortie, ancres, familles:liste.length };
}

function build(data){
  if(data.live_window_min) LIVE_WINDOW_S = data.live_window_min*60;   // fenêtre décidée côté hooks, pas en dur ici
  _liveShown=-1;                                                     // force le rafraîchissement du compteur
  clearGroup();
  layoutRegions(data); layoutNodes(data);
  const SENS = layoutSens(data);
  const meshById={};
  for(const nd of data.nodes){
    const pp=posById[nd.id]||{p3:new THREE.Vector3(0,R,0), p2:new THREE.Vector3()};
    const p3=pp.p3, p2=pp.p2, col=colorOf(nd);
    // position SÉMANTIQUE (Étage 1) : projetée par le SENS (embeddings), indépendante du rangement.
    // fallback sur la position structurelle si une fiche n'a pas encore de vecteur.
    // Le SENS est en volume depuis le 2026-08-14 : `embed2` rend trois coordonnées, plus deux.
    // À plat, 357 fiches et 1386 liens se recouvraient et redonnaient la pelote qu'on venait
    // d'éliminer ailleurs ; en volume les groupes se séparent et on tourne autour.
    // Repli : une fiche sans vecteur (ou un cache 2D d'avant) garde sa place structurelle.
    // `p2sBrut` = le sens pur (sans regroupement) : gardé pour pouvoir MESURER ce que le
    // regroupement change, et pour y revenir d'un réglage si le compromis ne tient pas.
    const p2sBrut = SENS.brut[nd.id] || p2.clone();
    const p2s = (SENS_FAMILLES ? (SENS.sens[nd.id] || p2sBrut) : p2sBrut).clone();
    const m=new THREE.Mesh(new THREE.SphereGeometry(nd.frontier?0.16:0.125, 12, 12),
      new THREE.MeshBasicMaterial({ color:col }));
    const start=p3.clone(); m.position.copy(start);
    const isNew = prevIds.size && !prevIds.has(nd.id);
    // `col` est gardée telle quelle : la teinte du point est modulée à l'image quand une famille
    // est visée depuis la capsule, et sans la couleur d'origine on ne saurait pas y revenir.
    m.userData={ data:nd, isNew, p3, p2, p2s, p2sBrut, col:col.clone(), base:start.clone(), hatching:isNew, _pull:0, links:[] };
    m.scale.setScalar(isNew?0.01:1);
    // ⛔ PLUS DE HALO AUTOUR DE CHAQUE POINT (l'auteur, 2026-08-14 : « supprime le halo autour de
    // chaque point »). C'était une deuxième sphère translucide par fiche — 366 objets de plus,
    // et surtout un flou qui empâtait le nuage : deux points voisins se touchaient par leurs
    // halos avant de se toucher eux-mêmes.
    // CHALEUR (Étage 2) : le signal n'est pas perdu, il change de support. Au lieu d'un halo qui
    // respire, c'est le point LUI-MÊME qui s'éclaircit par vagues ∝ usage récent (animé dans
    // tick()). Même information, aucun objet supplémentaire, et le grain reste net.
    m.userData.heat=nd.heat||0; m.userData.pulse=hash(nd.id)*6.283;
    // ANNEAU = ACTIVITÉ EN DIRECT : fiche LUE à l'instant (fenêtre glissante de LIVE_WINDOW min).
    // ≠ « vue une fois dans la session » — cette ancienne définition allumait ~1/3 de la planète.
    // `active_ts` permet à tick() d'ÉTEINDRE l'anneau tout seul à l'expiration, sans recharger le graphe.
    if(nd.active_ts){
      const ring=new THREE.Sprite(new THREE.SpriteMaterial({ map:RING_TEX, color:0xFF4F0C,
        transparent:true, opacity:0.6, depthTest:false, depthWrite:false }));
      ring.scale.setScalar(0.95); m.add(ring);
      m.userData.activeRing=ring; m.userData.activeTs=nd.active_ts;
    }
    // BADGES (petites icônes À CÔTÉ du point, empilées à droite) : ⚠ avis du challenger · ✦ conviction · ↻ à reprendre
    const badges=[];
    if(nd.challenge)  badges.push([WARN_TEX,   0xFF4F0C]);
    if(nd.conviction) badges.push([CONV_TEX,   0xFFBCA2]);
    if(nd.resume)     badges.push([RESUME_TEX, 0xFF9870]);
    // § = règle transverse. Elle est citée par un cinquième du tronc : ses arcs ne sont plus
    // dessinés en permanence (ils reviennent au survol), et ce glyphe dit pourquoi ce point
    // n'a pas de fils alors qu'il est le plus relié de la carte.
    if(nd.regle)      badges.push([REGLE_TEX,  0xDE3F00]);
    badges.forEach(([tex,col],i)=>{
      const b=new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, color:col,
        transparent:true, opacity:0.95, depthTest:false, depthWrite:false }));
      b.scale.setScalar(0.34); b.position.set(0.3, 0.34 - i*0.27, 0); m.add(b);
    });
    // nœud REJOUABLE (Étage 4) : glyphe ▷ cyan au-dessus → double-clic ouvre la capture 3D
    if(nd.media){
      const pl=new THREE.Sprite(new THREE.SpriteMaterial({ map:PLAY_TEX, color:0xFF6F36,
        transparent:true, opacity:0.9, depthTest:false, depthWrite:false }));
      pl.scale.setScalar(0.42); pl.position.set(0,0.34,0); m.add(pl); m.userData.playMark=pl;
    }
    group.add(m); nodeObjs.push(m); meshById[nd.id]=m;
  }
  // liens : 1 matériau par lien (surlignage individuel) + géométrie pré-allouée
  let idx=0;
  for(const l of data.links){
    const a=meshById[l.source], b=meshById[l.target]; if(!a||!b) continue;
    const arr=new Float32Array((SEG+1)*3);
    const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(arr,3));
    // depthTest:false → l'arc n'est jamais TRANCHÉ par le corps de la planète (atténué via `facing`, pas coupé)
    const mat=new THREE.LineBasicMaterial({ color:LINK_GREY.clone(), transparent:true, opacity:0.16, depthTest:false, depthWrite:false });
    const ligne=new THREE.Line(g, mat); group.add(ligne);
    const L={ a, b, attr:g.getAttribute('position'), mat, ligne, hot:false, idx:idx++, regle:!!l.regle };
    linkObjs.push(L); a.userData.links.push(L); b.userData.links.push(L);
  }
  // ⛔ LES POINTS QUI COURAIENT LE LONG DES LIENS SONT SUPPRIMÉS (l'auteur, 2026-08-14 :
  // « les datas passant d'une fiche à une autre sont des transferts d'info temps réel ?
  // si oui garder, si non enlever »). La réponse est NON : ils partaient sur TOUS les liens,
  // en continu, à une vitesse tirée d'un hachage du nom des deux fiches. Ils ne montraient
  // aucun échange réel — c'était une animation de fond qui avait l'air d'une mesure.
  // Un décor qui imite un instrument est pire qu'un décor : on finit par le croire.
  // (Le vrai, « un faisceau ne part que sur un lien réellement co-activé », était déféré
  //  depuis juin — cf. carte-vivante-4-etages. Il reste à faire, il n'est pas ici.)

  // liens d'USAGE (co-activation, Étage 2) — golden, invisibles jusqu'au mode ⚡ usage
  const cmax=(data.coact && data.coact[0] && data.coact[0][2]) || 1;
  for(const e of (data.coact||[])){
    const a=meshById[e[0]], b=meshById[e[1]]; if(!a||!b) continue;
    const arr=new Float32Array((SEG+1)*3);
    const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(arr,3));
    const mat=new THREE.LineBasicMaterial({ color:0xFF6F36, transparent:true, opacity:0, depthTest:false, depthWrite:false });
    const ligne=new THREE.Line(g, mat); group.add(ligne);
    coactObjs.push({ a, b, attr:g.getAttribute('position'), mat, ligne, w:e[2]/cmax });
  }

  // ════════ NIVEAU 1 — LA VUE D'ENSEMBLE (une bulle par région) ════════
  // Mesuré le 2026-08-14 : 354 points et 1374 liens dessinés en même temps, dont 83 % entassés
  // sur le quart nord du globe. Aucune répartition ne sauve ça tant qu'une seule région pèse
  // 59 % du tronc : une région = une calotte, et une calotte de 59 % dépasse l'hémisphère.
  // La réponse n'est donc pas de mieux placer 354 points, c'est de ne pas les dessiner tous.
  // On ouvre sur ~20 bulles nommées ; on entre dans une région pour voir ses fiches.
  const totalN = data.nodes.length || 1; totalNoeuds = totalN;
  // ── SÉPARATION GARANTIE, PAS ESPÉRÉE (l'auteur : « séparation bien définie, pas mélangé ») ──
  // Le rayon d'un amas ne peut pas dépendre que de son effectif : deux grosses régions voisines
  // finiraient par se toucher, et deux amas qui se mêlent ne sont plus deux régions. On calcule
  // donc, pour chaque région, la distance à sa VOISINE LA PLUS PROCHE, et on plafonne le rayon
  // à 38 % de cette distance — deux amas voisins occupent au plus 76 % de l'espace qui les
  // sépare, il reste toujours du vide entre eux. La contrainte est vérifiable : cf.
  // `window.__planete.separation()`.
  const voisine = {};
  for(const a of REGION_LIST){
    const da = REGION_DIR[a]||UP; let m = Infinity;
    for(const b2 of REGION_LIST){ if(b2===a) continue;
      const db = REGION_DIR[b2]||UP;
      m = Math.min(m, da.distanceTo(db)*R); }
    voisine[a] = isFinite(m) ? m : 4*R;
  }
  for(const r of REGION_LIST){
    const n = REGION_COUNT[r]||0, col = REGION_COLOR[r] || new THREE.Color(0xffffff);
    // rayon ∝ √effectif : l'aire lue devient proportionnelle au nombre de fiches, donc la
    // taille se lit comme un poids — puis plafonnée par la place réellement disponible.
    const voulu = 0.42 + 1.5*Math.sqrt(n/totalN);
    const rad = Math.min(voulu, 0.38*voisine[r]/1.8);   // /1.8 : l'amas s'étale à rad*1.8
    const dir = (REGION_DIR[r]||UP).clone();
    // UN AMAS DE POINTS, PAS UNE BILLE (choix de l'auteur, 2026-08-14, sur capture : « cet effet
    // de pointillé de couleurs rassemblé qui flotte dans le vide, on garde »). Une bille pleine
    // dit « objet » ; un amas dit « un tas de fiches », ce qui est la vérité — et il laisse
    // voir la densité : 170 points groupés se lisent autrement que 2.
    const blob = new THREE.Object3D();
    blob.position.copy(dir).multiplyScalar(R);
    const grains = Math.min(n, 90);                 // beyond that, the cluster saturates and stops informing
    const pos = new Float32Array(grains*3);
    for(let i=0;i<grains;i++){
      // distribution en boule, tirée d'une graine STABLE (le nom + l'indice) : l'amas d'une
      // région est le même d'une session à l'autre, sinon la carte ne se mémorise pas.
      const u=hash(r+':'+i), v=hash(i+':'+r), w=hash(r+i+'z');
      const th=2*Math.PI*u, ph=Math.acos(2*v-1), rr=rad*1.8*Math.cbrt(w);
      pos[i*3]  = rr*Math.sin(ph)*Math.cos(th);
      pos[i*3+1]= rr*Math.sin(ph)*Math.sin(th);
      pos[i*3+2]= rr*Math.cos(ph);
    }
    const gg=new THREE.BufferGeometry(); gg.setAttribute('position', new THREE.BufferAttribute(pos,3));
    const amas=new THREE.Points(gg, new THREE.PointsMaterial({ color:col, map:POINT_TEX, size:0.40,
      transparent:true, opacity:0.95, depthWrite:false, sizeAttenuation:true }));
    blob.add(amas);
    // ⛔ PLUS DE ROND DE SÉLECTION (l'auteur, capture du 2026-08-14 : « le rond de sélection doit
    // disparaître »). Un disque translucide de la taille de l'amas ne montre pas ce qu'on vise :
    // il le CACHE. Le survol se dit maintenant par l'amas lui-même — ses points grossissent et
    // s'éclaircissent — donc par la chose qu'on regarde, pas par un cache posé dessus.
    const lab = new THREE.Sprite(new THREE.SpriteMaterial({ map:texteTex(`${r}  ${n}`),
      transparent:true, depthTest:false, depthWrite:false, opacity:0.9 }));
    lab.scale.set(LABEL_W, LABEL_H, 1);
    lab.position.set(0, rad*1.8 + LABEL_H*0.45, 0);  // juste au-dessus de l'amas, pas en l'air
    blob.add(lab);
    const c2 = REGION_2D[r] || {x:0,y:0};
    const anc = SENS.ancres[r];
    blob.userData = { region:r, n, rad, dir, colBase:col.clone(),
                      pos3: dir.clone().multiplyScalar(R),
                      pos2: new THREE.Vector3(c2.x*S2, c2.y*S2, 0),
                      posSens: anc ? anc.pos.clone() : new THREE.Vector3(),
                      radSens: anc ? anc.rayon : rad,
                      lab, blobMat:amas.material, labMat:lab.material };
    group.add(blob); regionObjs.push(blob);
  }
  // liens AGRÉGÉS région→région : un arc par paire, épaisseur d'opacité ∝ nombre de liens réels.
  // Le calcul d'affinité existait déjà (il servait à ordonner les continents) ; il n'était juste
  // jamais montré. 1374 traits deviennent ~40.
  {
    const paires = Object.entries(REGION_AFF).filter(([,v])=>v>0);
    const vmax = paires.reduce((m,[,v])=>Math.max(m,v), 1);
    for(const [k,v] of paires){
      const [ra,rb]=k.split('|'); const A=REGION_DIR[ra], B=REGION_DIR[rb]; if(!A||!B) continue;
      const arr=new Float32Array((SEG+1)*3);
      const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(arr,3));
      const mat=new THREE.LineBasicMaterial({ color:LINK_GREY.clone(), transparent:true,
        opacity:0, depthTest:false, depthWrite:false });
      const ligne=new THREE.Line(g, mat); group.add(ligne);
      regionLinks.push({ a:A.clone().multiplyScalar(R), b:B.clone().multiplyScalar(R),
                         attr:g.getAttribute('position'), mat, ligne, poids:v/vmax, ra, rb });
    }
  }

  prevIds=new Set(data.nodes.map(n=>n.id));
  document.getElementById('counts').innerHTML =
    `${data.counts.nodes} notes · ${data.counts.links} links · ${REGION_LIST.length} regions · ${data.counts.frontier} border${data.counts.frontier>1?'s':''}`
    + (data.counts.challenged ? ` · <span style="color:#e0a13a">⚠ ${data.counts.challenged} challenged</span>` : '')
    // Qualifications the exporter could not read. ONE line, never a list: `brain doctor`
    // already names each note and each type, and a second detailed report here would be
    // a second source of truth. The wording says what is actually lost — the links are
    // still on the map, only their type is gone — so this never reads as missing notes.
    + (data.counts.unknown_relations ? ` · <span style="color:#e0a13a">⚠ ${data.counts.unknown_relations} relation type${data.counts.unknown_relations>1?'s':''} were not recognized; links remain visible but untyped. Run brain doctor for details.</span>` : '');
  // reprise (Étage 2) : régions où la dernière session a travaillé — orientation au démarrage
  const act=data.nodes.filter(n=>n.active), sEl=document.getElementById('session');
  if(act.length){
    const rc={}; for(const n of act){ const r=regionOf(n); rc[r]=(rc[r]||0)+1; }
    const top=Object.entries(rc).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([r])=>`<b>${r}</b>`);
    sEl.innerHTML=`◉ live in: ${top.join(' · ')}`;
  } else sEl.textContent='';
  buildLegend(data);
  buildPod();                        // la capsule se refait avec le graphe : sinon elle montre l'avant-dernier tronc
  majFil();                          // le fil d'Ariane était figé sur le texte écrit en dur dans le HTML
  // ⚠️ LA RÉGION OUVERTE DOIT ÊTRE REPOSÉE APRÈS CHAQUE RECONSTRUCTION.
  // `build()` recrée tous les meshes ; les nouveaux n'ont pas de `p3f`, donc `easeMagnet()` les
  // ramène à `p3` — la calotte de leur continent. Comme on est toujours au niveau 2, les 170
  // fiches de `principes` s'écrasaient d'un coup sur une calotte de 44° : le globe redevenait un
  // DÔME bombé, vide en dessous (l'auteur, capture du 2026-08-14 : « ça fait ça au bout d'un
  // moment »). « Au bout d'un moment » = au premier passage du hook qui régénère graph.json,
  // que la boucle de rafraîchissement voit dans les 3 secondes.
  if(focusRegion){
    if(REGION_NODES[focusRegion]) poserFiches(focusRegion);
    else sortirRegion();          // la région a disparu du graphe : on ressort proprement
  }
}

function buildLegend(data){
  const projects=data.projects||[];
  const isProj=r=>projects.includes(r);
  const order=REGION_LIST.slice().sort((a,b)=>(REGION_COUNT[b]||0)-(REGION_COUNT[a]||0));
  const row=r=>{ const c='#'+REGION_COLOR[r].getHexString();
    return `<div class="row"><span class="dot" style="color:${c};background:${c}"></span>${r} (${REGION_COUNT[r]||0})</div>`; };
  const villes=order.filter(isProj).map(row).join('');
  const autres=order.filter(r=>!isProj(r)).map(row).join('');
  // ── LE SOMMAIRE ── refondu le 2026-08-14 (l'auteur : « il faut refondre le sommaire »).
  // Avant : 20 lignes de régions + 5 de marqueurs, en colonne, sur toute la hauteur — et
  // « socle (1) » écrit aussi gros que « principes (170) ». Un sommaire doit hiérarchiser,
  // pas énumérer. Trois changements :
  //  · une BARRE de longueur proportionnelle : le poids se voit avant de se lire ;
  //  · les régions à 1 ou 2 fiches sont repliées sur une seule ligne (elles étaient 13 pour
  //    14 fiches, soit 65 % des lignes pour 4 % du contenu) ;
  //  · les marqueurs passent sur une ligne compacte au lieu de cinq.
  const maxN = Math.max(...REGION_LIST.map(r=>REGION_COUNT[r]||0), 1);
  const ligne = r => { const c='#'+(REGION_COLOR[r]||new THREE.Color(0xffffff)).getHexString();
    const n = REGION_COUNT[r]||0;
    return `<div class="row" data-region="${r}"><span class="dot" style="color:${c};background:${c}"></span>`
         + `<span class="nom">${r}</span><span class="bar"><i style="width:${Math.round(100*n/maxN)}%;background:${c}"></i></span>`
         + `<span class="nb">${n}</span></div>`; };
  const grosses = REGION_LIST.filter(r=>(REGION_COUNT[r]||0)>2)
                             .sort((a,b)=>(REGION_COUNT[b]||0)-(REGION_COUNT[a]||0));
  const petites = REGION_LIST.filter(r=>(REGION_COUNT[r]||0)<=2)
                             .sort((a,b)=>(REGION_COUNT[b]||0)-(REGION_COUNT[a]||0));
  const nPetites = petites.reduce((t,r)=>t+(REGION_COUNT[r]||0),0);
  const mk = [];
  if(data.counts.frontier)    mk.push(`<b style="color:#fff">◍</b> ${data.counts.frontier} borders`);
  if(data.counts.challenged)  mk.push(`<b style="color:#e0a13a">⚠</b> ${data.counts.challenged} challenged`);
  if(data.counts.convictions) mk.push(`<b style="color:#f5e2a0">✦</b> ${data.counts.convictions} convictions`);
  if(data.counts.resume)      mk.push(`<b style="color:#7fd4a0">↻</b> ${data.counts.resume} to resume`);
  if(data.counts.media)       mk.push(`<b style="color:#5ad7e6">▷</b> ${data.counts.media} replayable`);
  if(data.counts.regles)      mk.push(`<b style="color:#b9c6ff">§</b> ${data.counts.regles} cross-cutting rules`);
  document.getElementById('legend').innerHTML =
    `<div class="hd">regions — click to enter</div>` + grosses.map(ligne).join('') +
    (petites.length
      ? `<details class="repli"><summary>+ ${petites.length} regions with 1 to 2 notes `
        + `<em>(${nPetites} in total)</em></summary>${petites.map(ligne).join('')}</details>`
      : '') +
    `<div class="hd">markers</div><div class="mk">${mk.join(' · ')}</div>` +
    `<div class="mk" style="margin-top:5px"><b style="color:#7fe9ff">◯</b> ring = read less than ${Math.round(LIVE_WINDOW_S/60)} min ago</div>`;
  // le sommaire devient une COMMANDE : cliquer une region y entre, comme cliquer son amas.
  document.querySelectorAll('#legend .row').forEach(el=>{
    el.addEventListener('click', ()=> entrerRegion(el.dataset.region));
    el.addEventListener('mouseenter', ()=> { hoveredRegion = el.dataset.region; podViser(el.dataset.region); });
    el.addEventListener('mouseleave', ()=> { if(hoveredRegion===el.dataset.region) hoveredRegion=null;
                                             if(podHover===el.dataset.region) podViser(null); });
  });
}

// ---------- bascule de vue ----------
// view : 0 = planète 3D ↔ 1 = carte 2D plate.  sem : 0 = 2D STRUCTURE (membership) ↔ 1 = 2D SENS (embeddings).
// usage : overlay des liens d'USAGE (co-activation, Étage 2), indépendant de la vue.
// ⚠️ LE SENS EST LA VUE PRINCIPALE (l'auteur, 2026-08-14 : « sens devient le main »).
// La carte s'ouvre donc sur le nuage sémantique, pas sur le globe. Motif : le globe dit le
// RANGEMENT (quel dossier), que la légende dit déjà en texte ; le sens dit ce qui se ressemble,
// ce qu'aucun autre affichage ne donne. Le globe reste, en petit, dans la capsule de coin.
// ⚠️ L'USAGE EST ALLUMÉ EN PERMANENCE (l'auteur, 2026-08-14 : « usage toujours actif, supprime
// la pastille »). Les liens d'usage — les fiches réellement manipulées ensemble — ne sont pas
// une option décorative à côté des liens déclarés : c'est ce que le tronc fait vraiment. Un
// interrupteur pour ça, c'est un réglage de plus à penser pour une information qu'on veut
// toujours. La pilule ⚡ et la touche U disparaissent avec lui.
let view=1, viewTarget=1, sem=1, semTarget=1, usage=1, usageTarget=1;
// CE QUE LA CARTE SAIT D'ELLE-MÊME, relu à chaque graph.json. `sem` dit la vue DEMANDÉE ;
// ceci dit ce que la donnée permet réellement d'en faire. Les deux étaient confondues : la vue
// demandée suffisait à afficher « proximity = meaning, every note » sur un nuage où pas une
// fiche n'avait de vecteur (mesuré à l'écran le 2026-09-19, 0 sur 10 dans le paquet livré).
let semCap = { state:'absent', covered:0, total:0, detail:'' };
addEventListener('keydown', e=>{
  if(e.key==='v'||e.key==='V'){ viewTarget = viewTarget>0.5?0:1; if(viewTarget<0.5) semTarget=0; }  // retour planète = structure
  if(e.key==='s'||e.key==='S'){ semTarget = semTarget>0.5?0:1; if(semTarget>0.5) viewTarget=1; }      // le sens n'a de sens qu'à plat
  if('vVsS'.includes(e.key)) majFil();
});
// boutons cliquables (sans dépendre du focus clavier)
function setMode(m){
  // ⚠️ « STRUCTURE » EST LE GLOBE, PAS LA CARTE À PLAT (l'auteur, 2026-08-14 : « dans structure
  // les régions ne sont plus en 3D »). Depuis que la pilule 3D a disparu, il ne reste que deux
  // lectures, et chacune doit être la meilleure de son genre : le SENS est le nuage sémantique,
  // la STRUCTURE est le globe des familles qu'on tourne. La carte à plat reste accessible à la
  // touche V — elle sert à comparer deux rangements côte à côte, pas à être la vue par défaut.
  // ⚠️ STRUCTURE = LA CARTE À PLAT · UNE FAMILLE OUVERTE = EN VOLUME (l'auteur, 2026-08-14 :
  // « quand on touche sur structure, ça doit être en 2D posé ; mais quand on clique sur une
  // famille, la famille elle est en 3D »). Les deux niveaux ne montrent pas la même chose et
  // n'ont pas besoin de la même dimension : la vue d'ensemble est un PLAN — vingt familles
  // qu'on embrasse d'un coup, sans face cachée ; une famille ouverte est un AMAS — on tourne
  // autour pour voir ses fiches, dont la moitié serait derrière sur un plan.
  if(m==='3d'){ viewTarget=0; semTarget=0; }
  else if(m==='struct'){ viewTarget = focusRegion ? 0 : 1; semTarget=0; }
  else if(m==='sens'){ viewTarget=1; semTarget=1; }
  majFil();                                                    // le fil dit ce que la vue permet
}
document.querySelectorAll('#modes button').forEach(b=>
  b.addEventListener('click', ()=> setMode(b.dataset.mode)));

// ════════ LES DEUX NIVEAUX ════════
// `focus` = 0 vue d'ensemble (bulles) · 1 dans une région (ses fiches). La transition est
// continue pour qu'on VOIE d'où sortent les points : un saut sec ferait perdre le fil.
let focusRegion=null, focus=0, focusTarget=0, regionVue=null, hoveredRegion=null;
// recopié à chaque image pour que updateLinks() et magnet() lisent le même niveau que tick()
let niveau2Global=0, totalNoeuds=1;
let _coupurePic=0;                    // pic de matière visible disparue en une seule image
const filEl=document.getElementById('fil');

function majFil(){
  if(focusRegion){
    filEl.innerHTML = `<span class="retour">← overview</span>  ·  <b>${focusRegion}</b> `
      + `<span class="ici">— ${REGION_COUNT[focusRegion]||0} notes · Esc to exit</span>`;
    filEl.querySelector('.retour').onclick = sortirRegion;
  } else if(semTarget>0.5){
    // Une famille épinglée assombrit le reste du nuage : si rien ne le DIT, l'écran a l'air
    // cassé (l'auteur, 2026-08-14 : « pourquoi aussi sombre »). L'état s'affiche, et sa sortie aussi.
    if(podPin){
      filEl.innerHTML = `<span class="retour">✕ release</span>  ·  <b>${podPin}</b> `
        + `<span class="ici">— ${REGION_COUNT[podPin]||0} notes lit up in the meaning map · Esc</span>`;
      filEl.querySelector('.retour').onclick = ()=>{ podPin=null; majPodCap(); majFil(); };
      return;
    }
    // en mode SENS il n'y a plus de bulle à cliquer : les 366 fiches sont là, rangées par
    // ressemblance. Dire « clic sur une région pour entrer » y serait un mode d'emploi faux.
    filEl.innerHTML = `<span class="ici">meaning map — every note next to what it resembles · the globe (left) targets a family</span>`;
  } else {
    filEl.innerHTML = `<span class="ici">overview — click a region to enter</span>`;
  }
}

// Placement DANS une région : les fiches reprennent tout le globe au lieu de tenir sur la
// calotte de leur continent. C'est ce qui règle la densité — plus 354 points sur un quart de
// sphère, mais N points sur la sphère entière, quel que soit N.
function poserFiches(r){
  const ids = REGION_NODES[r]||[];
  const m = ids.length, ga = Math.PI*(3-Math.sqrt(5));
  const rang = new Map(ids.map((id,i)=>[id,i]));
  for(const mesh of nodeObjs){
    const nd = mesh.userData.data;
    const i = rang.get(nd.id);
    if(i===undefined){ mesh.userData.p3f=null; mesh.userData.p2f=null; continue; }
    const y = 1-2*(i+0.5)/m, rad = Math.sqrt(Math.max(0,1-y*y)), a = ga*i;
    // ⚠️ SUR LA SPHÈRE EXACTE, ça faisait une GRILLE posée sur un globe — mécanique, et plus du
    // tout « l'amas » qu'on venait d'ouvrir (l'auteur : « quand on clique l'amas n'est plus pris en
    // compte »). On garde la régularité du tournesol pour l'espacement, mais chaque fiche respire
    // sur son rayon : le résultat est un nuage épais qu'on tourne, pas un quadrillage.
    // Le décalage vient d'un hachage de l'identifiant : stable d'une session à l'autre.
    // ⚠️ UN AMAS, PAS UNE COQUILLE (l'auteur, capture du 2026-08-14 : « pour chaque famille je veux
    // un amas, plus de sphère »). Faire varier le rayon de 0,70 à 1,02 ne suffisait pas : ça
    // reste une sphère creuse un peu épaisse, et à l'écran on voyait le vide au centre.
    // ⚠️ ON REVIENT À LA SPHÈRE, ET C'EST UN CHOIX, PAS UN OUBLI.
    // Parcours : coquille fine → « je veux un amas, plus de sphère » → boule pleine (biais vers
    // le centre, mesurée, vérifiée) → « j'aimais bien la sphère en fait » (2026-08-14).
    // La boule pleine est plus juste sur le papier — densité, cœur, profondeur — et moins bonne
    // à l'usage : dans une boule, les fiches du centre sont cachées derrière celles du bord, on
    // ne peut ni les survoler ni les compter. Sur une sphère, TOUTES sont sur le pourtour, donc
    // toutes atteignables, et la rotation en montre une autre moitié à chaque tour.
    // Le souffle (0,70 → 1,02 R) garde l'épaisseur qui empêche l'effet quadrillage, sans creuser.
    const souffle = 0.70 + 0.32*hash(nd.id+'r');
    mesh.userData.p3f = new THREE.Vector3(Math.cos(a)*rad, y, Math.sin(a)*rad).multiplyScalar(R*souffle);
    // 2D : tournesol sur tout le disque, même logique
    const rr = S2*Math.sqrt((i+0.5)/m), aa = i*2.39996323;
    mesh.userData.p2f = new THREE.Vector3(Math.cos(aa)*rr, Math.sin(aa)*rr, 0);
  }
}

function entrerRegion(r){
  if(!r || !REGION_COUNT[r]) return;
  focusRegion=r; focusTarget=1; poserFiches(r); majFil();
  if(semTarget<0.5) viewTarget=0;              // entrer dans une famille = passer en volume
  hovered=null; pinned=null; tip.classList.remove('show','expanded');
}
function sortirRegion(){
  focusRegion=null; focusTarget=0; majFil();
  if(semTarget<0.5) viewTarget=1;              // ressortir = reposer la carte à plat
  hovered=null; pinned=null; tip.classList.remove('show','expanded');
}
addEventListener('keydown', e=>{
  if(e.key!=='Escape' || pinned) return;
  if(podPin){ podPin=null; majPodCap(); majFil(); return; }   // on relâche d'abord la famille visée
  if(focusRegion) sortirRegion();
});
function syncModeButtons(){
  const active = view<0.5 ? 'struct' : (sem>0.5 ? 'sens' : 'struct');
  document.querySelectorAll('#modes button').forEach(b=>{
    b.classList.toggle('on', b.dataset.mode===active);
  });
}

// ════════ LA PLANÈTE EN PETIT — la capsule de coin ════════
// Demande de l'auteur (2026-08-14) : « déplacer et réduire la planète dans une petite fenêtre,
// mais toujours rotation et réponse de proximité, statique dans la capsule ».
// Trois décisions qui en découlent :
//  · SCÈNE SÉPARÉE, pas un second rendu de la grande. Les points de la grande carte sont
//    interpolés à chaque image vers leurs positions du SENS ; les redessiner en globe
//    exigerait de tout replacer deux fois par image. Ici : ~20 amas figés, aucun post-process.
