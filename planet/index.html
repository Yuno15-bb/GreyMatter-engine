<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>🗺️ 3D/2D Knowledge Map — C Brain</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; background:#000; overflow:hidden;
    font-family:var(--disp); color:var(--ph-300); }
  #c{ display:block; width:100vw; height:100vh; cursor:grab; }
  #c:active{ cursor:grabbing; }

  #hud{ position:fixed; top:14px; left:16px; pointer-events:none; }
  #title{ font-size:13px; letter-spacing:1px; color:#e0d6c8; text-shadow:0 0 10px #000; }
  #counts{ font-size:11px; opacity:.75; margin-top:3px; }
  #fil{ font-size:11px; margin-top:6px; letter-spacing:.3px; }
  #fil .ici{ opacity:.55; }
  #fil .retour{ color:#5ad7e6; cursor:pointer; opacity:.9; }
  #fil .retour:hover{ opacity:1; text-decoration:underline; }
  #fil b{ color:#f3ede2; font-weight:500; }
  #viewtag{ font-size:11px; color:#5ad7e6; opacity:.85; margin-top:2px; }
  #modes{ display:flex; gap:6px; margin-top:7px; pointer-events:auto; }
  #modes button{ font-family:inherit; font-size:10px; letter-spacing:.5px; color:#cfc6ba;
    background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.14); border-radius:6px;
    padding:3px 8px; cursor:pointer; transition:all .15s; }
  #modes button:hover{ background:rgba(255,255,255,.1); }
  #modes button.on{ color:#07070b; background:#5ad7e6; border-color:#5ad7e6; font-weight:bold; }
  #grow{ font-size:11px; color:#f2c94c; opacity:0; transition:opacity .4s; margin-top:2px; }

  #livenow{ font-size:10.5px; color:#7fe9ff; opacity:.9; margin-top:6px; letter-spacing:.3px; }
  #livenow .off{ color:#7f8b93; }
  #session{ font-size:10.5px; color:#86c8b0; opacity:.85; margin-top:6px; letter-spacing:.3px; }
  #session b{ color:#cdeadd; font-weight:normal; }

  #legend{ position:fixed; bottom:14px; left:16px; font-size:10px; line-height:1.5; opacity:.9;
    max-height:62vh; overflow-y:auto; width:216px; padding-right:6px; }
  #legend .row{ display:flex; align-items:center; gap:6px; cursor:pointer; padding:1px 3px;
    border-radius:4px; }
  #legend .row:hover{ background:rgba(255,255,255,0.07); }
  #legend .nom{ flex:1 1 auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #legend .bar{ flex:0 0 42px; height:3px; background:rgba(255,255,255,0.09); border-radius:2px; overflow:hidden; }
  #legend .bar i{ display:block; height:100%; border-radius:2px; opacity:.75; }
  #legend .nb{ flex:0 0 26px; text-align:right; opacity:.6; font-variant-numeric:tabular-nums; }
  #legend .repli > summary{ cursor:pointer; list-style:none; opacity:.5; padding:3px 3px; }
  #legend .repli > summary::-webkit-details-marker{ display:none; }
  #legend .repli > summary::before{ content:"▸ "; }
  #legend .repli[open] > summary::before{ content:"▾ "; }
  #legend .repli > summary:hover{ opacity:.85; }
  #legend .repli em{ font-style:normal; opacity:.6; }
  #legend .mk{ opacity:.62; line-height:1.7; }
  #legend .dot{ width:9px; height:9px; border-radius:50%; box-shadow:0 0 6px currentColor; flex:none; }
  #legend .hd{ opacity:.5; letter-spacing:1px; text-transform:uppercase; font-size:9px; margin:5px 0 2px; }
  #legend .bdg{ width:11px; text-align:center; flex:none; font-size:11px; }

  #tip{ --accent:#888; position:fixed; right:18px; top:50%; width:300px; max-width:40vw; padding:15px 17px;
    background:linear-gradient(180deg, rgba(10,12,16,0.95), rgba(8,9,13,0.96));
    border:1px solid color-mix(in srgb, var(--accent) 38%, transparent);
    pointer-events:none; opacity:0; transition:opacity .16s ease, transform .16s ease;
    transform:translateY(-50%) translateX(12px);
    box-shadow:0 0 24px rgba(0,0,0,.6), inset 0 0 26px color-mix(in srgb, var(--accent) 8%, transparent);
    z-index:5; }
  #tip.show{ opacity:1; transform:translateY(-50%) translateX(0); }
  #tip::before, #tip::after, #tip .scan::before, #tip .scan::after{
    content:""; position:absolute; width:13px; height:13px; border:2px solid var(--accent); }
  #tip::before{ top:-1px; left:-1px; border-right:0; border-bottom:0; }
  #tip::after{ bottom:-1px; right:-1px; border-left:0; border-top:0; }
  #tip .scan::before{ top:-1px; right:-1px; border-left:0; border-bottom:0; }
  #tip .scan::after{ bottom:-1px; left:-1px; border-right:0; border-top:0; }
  #tip .scan{ position:absolute; inset:0; pointer-events:none; opacity:.6;
    background:repeating-linear-gradient(0deg, transparent 0 2px, rgba(255,255,255,0.022) 2px 3px); }
  #tip .src{ font-size:9px; letter-spacing:1.6px; text-transform:uppercase; color:var(--accent);
    display:flex; align-items:center; gap:7px; margin-bottom:10px; padding-bottom:9px;
    border-bottom:1px solid color-mix(in srgb, var(--accent) 24%, transparent); flex-wrap:wrap; }
  #tip .src .swatch{ width:7px; height:7px; transform:rotate(45deg);
    background:var(--accent); box-shadow:0 0 8px var(--accent); flex:none; }
  #tip .src .frontier{ color:#f3ede2; opacity:.7; letter-spacing:.5px; }
  #tip .n{ color:#f3ede2; font-weight:bold; font-size:13.5px; letter-spacing:1.4px;
    text-transform:uppercase; line-height:1.35;
    text-shadow:0 0 13px color-mix(in srgb, var(--accent) 55%, transparent); }
  #tip .mem{ margin-top:9px; font-size:9.5px; opacity:.72; line-height:1.5; letter-spacing:.3px; }
  #tip .mem b{ color:var(--accent); font-weight:normal; }
  #tip .ch{ display:none; margin-top:9px; font-size:9.5px; line-height:1.5; color:#e8b25a;
    border-left:2px solid #e0a13a; padding-left:8px; letter-spacing:.2px; }
  #tip .ch.show{ display:block; }
  #tip .cv{ display:none; margin-top:9px; font-size:9.5px; line-height:1.5; color:#f0d68a;
    border-left:2px solid #e8c860; padding-left:8px; letter-spacing:.2px; }
  #tip .cv.show{ display:block; }
  #tip .media{ display:none; margin-top:9px; font-size:9.5px; color:#5ad7e6; letter-spacing:.3px; }
  #tip .media.show{ display:block; }
  #tip .rs{ display:none; margin-top:9px; font-size:9.5px; color:#7fd4a0; letter-spacing:.3px;
    border-left:2px solid #7fd4a0; padding-left:8px; }
  #tip .rs.show{ display:block; }
  #tip .lnk{ margin-top:10px; display:flex; flex-wrap:wrap; gap:4px 5px; }
  #tip .lnk .hd{ width:100%; opacity:.42; font-size:8px; letter-spacing:1px; text-transform:uppercase; margin-bottom:1px; }
  #tip .lnk .c{ display:inline-flex; align-items:center; gap:4px; padding:1px 6px; font-size:8.5px;
    border-radius:9px; background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.08); letter-spacing:.2px; }
  #tip .lnk .c i{ width:6px; height:6px; border-radius:50%; background:var(--cc,#888); box-shadow:0 0 5px var(--cc,#888); flex:none; }
  #tip .lnk .c em{ font-style:normal; opacity:.5; font-size:7.5px; letter-spacing:.5px; }
  #tip .d{ opacity:.82; margin-top:11px; font-size:11.5px; line-height:1.55; }

  #tip .bl{ margin-top:13px; border-left:2px solid var(--accent); padding-left:11px; }
  #tip .bl > header, #tip .bl > summary{ display:flex; align-items:baseline; gap:8px;
    font-size:8.5px; letter-spacing:1.4px; text-transform:uppercase; padding:1px 0 6px; }
  #tip .bl .qui{ color:var(--accent); opacity:.95; font-weight:600; }
  #tip .bl .quoi{ opacity:.38; letter-spacing:.6px; text-transform:none; font-size:9.5px; }
  #tip .bl .txt{ white-space:pre-wrap; }
  #tip .bl.clair .txt{ font-size:12.5px; line-height:1.72; opacity:.95; }
  #tip .bl.modele{ border-left-color:rgba(255,255,255,0.16); }
  #tip .bl.modele > summary{ cursor:pointer; list-style:none; }
  #tip .bl.modele > summary::-webkit-details-marker{ display:none; }
  #tip .bl.modele > summary .qui{ color:#cfd6e4; }
  #tip .bl.modele > summary::after{ content:"▸"; margin-left:auto; opacity:.4; }
  #tip .bl.modele[open] > summary::after{ content:"▾"; }
  #tip .bl.modele > summary:hover .qui{ color:#fff; }
  #tip .bl.modele .txt{ font-size:11px; line-height:1.72; opacity:.78; margin-top:4px; }
  #tip .f{ opacity:.55; margin-top:12px; font-size:9px; letter-spacing:.5px; word-break:break-all;
    padding-top:9px; border-top:1px solid rgba(255,255,255,0.07); color:var(--accent); }
  #tip .f::before{ content:"▸ "; opacity:.8; }
  #tip .x{ display:none; position:absolute; top:9px; right:11px; z-index:3;
    background:transparent; border:0; color:var(--accent); font-size:13px; cursor:pointer;
    font-family:inherit; line-height:1; padding:3px 5px; opacity:.75; }
  #tip .x:hover{ opacity:1; }
  #tip.expanded{ width:440px; max-width:48vw; pointer-events:auto; }
  #tip.expanded .x{ display:block; }
  #tip.expanded .body{ max-height:72vh; overflow-y:auto; padding-right:9px; }
  #tip.expanded .d{ font-size:12px; line-height:1.7; white-space:pre-wrap; opacity:.9; }
  #tip .body::-webkit-scrollbar{ width:7px; }
  #tip .body::-webkit-scrollbar-thumb{ background:color-mix(in srgb, var(--accent) 40%, transparent); border-radius:4px; }
  #tip .hint2{ display:none; }
  #tip.expanded .hint2{ display:block; margin-top:12px; font-size:8.5px; letter-spacing:.5px;
    text-transform:uppercase; opacity:.4; }

  #hint{ position:fixed; bottom:14px; right:16px; font-size:10px; opacity:.5; text-align:right; line-height:1.6; }


  @media (max-width: 520px) {
    #hint  { display:none; }
    #legend{ font-size:9px; line-height:1.5; max-height:32vh; opacity:.7;
             bottom:8px; left:10px; columns:2; column-gap:12px; }
    #hud   { top:8px; left:10px; }
    #title { font-size:11px; }
    #counts, #viewtag, #livenow, #session { font-size:9.5px; }
    #modes { flex-wrap:wrap; }

    #tip   { right:8px; left:8px; width:auto; max-width:none; top:auto; bottom:8px;
             transform:none; font-size:12px; }
  }


  #viewer{ position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center, rgba(16,20,30,0.96), rgba(3,4,7,0.985)); }
  #viewer.show{ display:flex; }
  #viewer #vc{ width:min(70vw,720px); height:min(70vh,560px); cursor:grab; touch-action:none; }
  #viewer #vc:active{ cursor:grabbing; }
  #viewer .vcap{ position:absolute; bottom:7%; left:50%; transform:translateX(-50%); max-width:62vw;
    text-align:center; font-size:12px; color:#cfe0f0; letter-spacing:.3px; line-height:1.55; text-shadow:0 0 10px #000; }
  #viewer .vx{ position:absolute; top:20px; right:24px; background:transparent; border:1px solid #5ad7e6;
    color:#5ad7e6; font-size:11px; cursor:pointer; border-radius:7px; padding:5px 11px; font-family:inherit; letter-spacing:1px; }
  #viewer .vx:hover{ background:rgba(90,215,230,.12); }
  #viewer .vhint{ position:absolute; top:22px; left:24px; font-size:10px; opacity:.5; letter-spacing:.5px; color:#5ad7e6; }
</style>

:root{
  --ph-100:#FFC9B0; --ph-200:#FF6A2A; --ph-300:#FF4F0C; --ph-400:#E84503;
  --ph-500:#C23800; --ph-600:#9C2D00; --ph-700:#7A2200; --ph-800:#551700;
  --ph-900:#320D00; --ph-950:#150500; --void:#000;
  --disp:"Departure Mono",ui-monospace,Menlo,monospace;
  --glow:255,79,12;
}
body{ letter-spacing:.03em; }
#title{ -webkit-text-stroke:.4px currentColor; }

#counts,#fil,#viewtag,#grow,#livenow,#session{ font-size:11px; line-height:1.5; }
#legend{ font-size:11px; line-height:1.5; width:206px; }
#legend .hd{ font-size:9.5px; }
#modes button{ font-size:10px; padding:2px 7px; }
#tip{ font-size:11px; } #tip .mem,#tip .ch,#tip .cv,#tip .rs,#tip .media{ font-size:10.5px; }

#hud{ padding:6px 9px; } #hud #title{ font-size:10.5px; letter-spacing:.07em; }
#counts,#fil,#viewtag,#grow,#livenow,#session{ font-size:10px; line-height:1.45; }
#modes{ margin-top:5px; gap:4px; } #modes button{ font-size:9px; padding:1px 6px; }
#legend{ padding:6px 8px; max-height:54vh; font-size:10px; width:188px; }

#hint{ display:none !important; }

#tip{ top:14px; transform:none; max-height:calc(100vh - 28px); overflow-y:auto;
  overscroll-behavior:contain; width:296px; }
#tip.show{ transform:none; }
#tip::-webkit-scrollbar{ width:6px; }
#tip::-webkit-scrollbar-thumb{ background:var(--ph-700); border-radius:3px; }

#tip .body{ display:flex; flex-direction:column; }
#tip .src{order:0} #tip .n{order:1} #tip .mem{order:2}
#tip .ch{order:3} #tip .cv{order:4} #tip .rs{order:5} #tip .media{order:6}
#tip .d{order:7}
#tip .lnk{ order:8; margin-top:12px; padding-top:9px; border-top:2px dashed var(--ph-700); }
#tip .hint2{order:9} #tip .f{order:10}

#grille{ position:fixed; inset:0; pointer-events:none; z-index:2;
  background-image:
    repeating-linear-gradient(to right ,rgba(0,0,0,.34) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(to bottom,rgba(0,0,0,.34) 0 1px,transparent 1px 3px); }
@media (-webkit-min-device-pixel-ratio:2),(min-resolution:2dppx){

  #grille{ background-image:
    repeating-linear-gradient(to right ,rgba(0,0,0,.30) 0 .5px,transparent .5px 1.5px),
    repeating-linear-gradient(to bottom,rgba(0,0,0,.30) 0 .5px,transparent .5px 1.5px); } }
#hud,#legend,#hint,#tip,#viewer{ z-index:10; }
#tip{ z-index:12; } #viewer{ z-index:20; }

#hud, #legend, #hint{
  background:none; border:0; box-shadow:none; padding:0;
  text-shadow:0 0 3px #000, 0 0 8px rgba(0,0,0,.9); }
#hud{ top:16px; left:18px; }
#legend{ bottom:16px; left:18px; width:238px; }
#hint{ right:18px; bottom:16px; padding:7px 12px; }

#pod{ position:fixed; top:0; left:18px; width:224px; z-index:4;
  background-color:transparent;
  background-image:
    repeating-linear-gradient(to right ,rgba(var(--glow),.11) 0 1px,transparent 1px 4px),
    repeating-linear-gradient(to bottom,rgba(var(--glow),.11) 0 1px,transparent 1px 4px);
  border:2px solid var(--ph-500); border-radius:9px; padding:5px 6px 4px;
  box-shadow:0 0 4px rgba(var(--glow),.4), 0 0 11px rgba(var(--glow),.13); }
#pod .hd{ font-family:var(--disp); font-size:9px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ph-400); padding:0 2px 2px; }
#pc{ display:block; width:208px; height:208px; cursor:grab; }
#pod .cap{ font-family:var(--disp); font-size:9.5px; line-height:1.35; color:var(--ph-200);
  min-height:13px; padding:2px 2px 0; letter-spacing:.03em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#pod .cap b{ color:var(--ph-100); font-weight:400; }
#pod .cap .off{ color:var(--ph-600); }

#title{ font-family:var(--disp); font-size:13px; letter-spacing:.09em; color:var(--ph-100);
  text-shadow:0 0 3px rgba(var(--glow),.6); }
#counts, #fil, #viewtag, #grow, #livenow, #session, #hint{
  color:var(--ph-300); text-shadow:0 0 2px rgba(var(--glow),.45); opacity:1; }
#counts{ font-size:11px; }
#fil b, #session b{ color:var(--ph-100); }
#fil .ici{ color:var(--ph-400); opacity:1; }
#fil .retour, #viewtag, #livenow, #session, #grow{ color:var(--ph-200); }
#livenow .off{ color:var(--ph-600); }
#hint b{ color:var(--ph-100); font-weight:400; }

#modes button{ font-family:var(--disp); color:var(--ph-300); background:transparent;
  border:2px solid var(--ph-600); border-radius:999px; letter-spacing:.07em; padding:2px 9px;
  text-shadow:0 0 2px rgba(var(--glow),.5); }
#modes button:hover{ background:rgba(var(--glow),.10); border-color:var(--ph-400); color:var(--ph-100); }
#modes button.on{ color:#000; background:var(--ph-400); border-color:var(--ph-400);
  font-weight:400; -webkit-text-stroke:0; text-shadow:none;
  box-shadow:0 0 7px rgba(var(--glow),.6); }

#legend{ font-family:var(--disp); font-size:10.5px; }
#legend .hd{ color:var(--ph-400); opacity:1; letter-spacing:.1em; }
#legend .row:hover{ background:rgba(var(--glow),.12); }
#legend .nom{ color:var(--ph-200); }
#legend .nb{ color:var(--ph-100); opacity:1; font-variant-numeric:tabular-nums; }
#legend .bar{ background:var(--ph-900); height:4px; }
#legend .bar i{ opacity:1; box-shadow:0 0 5px rgba(var(--glow),.6); }
#legend .dot{ box-shadow:0 0 6px rgba(var(--glow),.7); }
#legend .mk{ color:var(--ph-300); opacity:1; }
#legend .repli > summary{ color:var(--ph-400); opacity:1; }

#tip{ background-color:rgba(0,0,0,.55);
  background-image:
    repeating-linear-gradient(to right ,rgba(var(--glow),.11) 0 1px,transparent 1px 4px),
    repeating-linear-gradient(to bottom,rgba(var(--glow),.11) 0 1px,transparent 1px 4px);
  border:2px solid var(--ph-500); border-radius:9px;
  color:var(--ph-300); font-family:var(--disp);
  box-shadow:0 0 6px rgba(var(--glow),.45), 0 0 18px rgba(var(--glow),.16); }
#tip::before,#tip::after,#tip .scan::before,#tip .scan::after{ border-color:var(--ph-400); }
#tip .scan{ display:none; }
#tip .src{ color:var(--ph-400); border-bottom:2px solid var(--ph-700); }
#tip .src .swatch{ box-shadow:0 0 8px rgba(var(--glow),.8); }
#tip .src .frontier{ color:var(--ph-200); opacity:1; }
#tip .n{ color:var(--ph-100); font-weight:400; text-shadow:0 0 3px rgba(var(--glow),.6); }
#tip .mem{ color:var(--ph-300); opacity:1; }
#tip .mem b{ color:var(--ph-100); }
#tip .ch{ color:var(--ph-200); border-left:2px solid var(--ph-400); }
#tip .cv{ color:var(--ph-200); border-left:2px solid var(--ph-500); }
#tip .rs{ color:var(--ph-200); border-left:2px solid var(--ph-600); }
#tip .media{ color:var(--ph-300); }
#tip .lnk .hd{ color:var(--ph-500); opacity:1; }
#tip .lnk .c{ background:transparent; border:1px solid var(--ph-700); color:var(--ph-300); }
#tip .hint2{ color:var(--ph-600); }

#viewer{ background:rgba(0,0,0,.92); }
#viewer .vcap, #viewer .vhint{ color:var(--ph-300); font-family:var(--disp); }
#viewer .vx, #tip .x{ font-family:var(--disp); color:var(--ph-200);
  background:transparent; border:2px solid var(--ph-600); border-radius:999px; }
#viewer .vx:hover, #tip .x:hover{ color:#000; background:var(--ph-400); border-color:var(--ph-400);
  -webkit-text-stroke:0; }

button:focus-visible{ outline:2px solid var(--ph-100); outline-offset:2px; }

@media (prefers-reduced-motion: no-preference){

  @keyframes mArrive{ 0%,99%{opacity:0} 100%{opacity:1} }
  #c        { animation:mArrive 40ms linear .05s both; }
  #hud      { animation:mArrive 40ms linear .28s both; }
  #hud #title    { animation:mArrive 40ms linear .40s both; }
  #hud #counts   { animation:mArrive 40ms linear .52s both; }
  #hud #viewtag  { animation:mArrive 40ms linear .60s both; }
  #hud #fil      { animation:mArrive 40ms linear .68s both; }
  #hud #modes    { animation:mArrive 40ms linear .80s both; }
  #hud #livenow, #hud #session, #hud #grow { animation:mArrive 40ms linear .92s both; }
  #legend   { animation:mArrive 40ms linear 1.06s both; }


}
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="title">[ TRUNK MAP — MEANING ]</div>
    <div id="counts">…</div>
    <div id="viewtag"></div>

    <div id="fil"><span class="ici">overview — click a region to enter</span></div>
    <div id="modes">
      <button data-mode="sens">✦ meaning</button>
      <button data-mode="struct">▦ structure</button>
    </div>
    <div id="grow"></div>
    <div id="livenow"></div>
    <div id="session"></div>
  </div>
  <div id="legend"></div>

  <div id="pod">
    <div class="hd">[ globe — the families ]</div>
    <canvas id="pc"></canvas>
    <div class="cap"></div>
  </div>
  <div id="tip">
    <i class="scan"></i>
    <button class="x" type="button" title="close (Esc)">✕</button>
    <div class="body">
      <div class="src"><span class="swatch"></span><span class="lbl"></span></div>
      <div class="n"></div>
      <div class="mem"></div>
      <div class="ch"></div>
      <div class="cv"></div>
      <div class="rs"></div>
      <div class="media"></div>

let REGION_DIR={}, REGION_2D={}, REGION_COLOR={}, REGION_LIST=[], REGION_COUNT={}, REGION_AFF={}, REGION_NODES={};
function layoutRegions(data){
  REGION_DIR={}; REGION_2D={}; REGION_COLOR={}; REGION_COUNT={}; REGION_AFF={}; REGION_NODES={};

  for(const l of data.links){ const ra=nreg[l.source], rb=nreg[l.target]; if(!ra||!rb||ra===rb) continue;
    const k=ra<rb?ra+'|'+rb:rb+'|'+ra; aff[k]=(aff[k]||0)+1; deg[ra]++; deg[rb]++; }

    for(let d=1; pris[j] && d<=nreg2; d++){

    } });
}

let SENS_FAMILLES = true;
const SENS_TAILLE = 2.0;
const SENS_MARGE  = 3.2;
const SENS_RAYON  = SEM*1.35;
function positionSens(nd){
  const e2 = nd.embed2;
  if(!e2) return null;
  return (e2.length>=3) ? new THREE.Vector3(e2[0]*SEM, e2[1]*SEM, e2[2]*SEM)
                        : new THREE.Vector3(e2[0]*SEM, e2[1]*SEM, 0);
}
function layoutSens(data){
  const brut={}, sortie={};
  for(const nd of data.nodes){ const p=positionSens(nd); if(p) brut[nd.id]=p; }
  const fam={};
  for(const nd of data.nodes){
    if(!brut[nd.id]) continue;
    (fam[regionOf(nd)] = fam[regionOf(nd)] || { ids:[], c:new THREE.Vector3() }).ids.push(nd.id);
  }
  for(const r in fam){ const f=fam[r];
    for(const id of f.ids) f.c.add(brut[id]);
    f.c.multiplyScalar(1/f.ids.length);
    f.etendue = Math.max(0.6, f.ids.reduce((m,id)=>Math.max(m, brut[id].distanceTo(f.c)), 0));
    f.R = SENS_TAILLE*Math.cbrt(f.ids.length);
  }
  const liste=Object.values(fam);
  const volume = liste.reduce((s,f)=>s + f.R*f.R*f.R, 0);
  const rayonNecessaire = Math.cbrt(volume/0.30);
  const dispersion = Math.sqrt(liste.reduce((s,f)=>s + f.c.lengthSq(), 0)/liste.length);
  const ecart = dispersion>1e-3 ? (rayonNecessaire*0.62)/dispersion : 1;
  for(const f of liste) f.a = f.c.clone().multiplyScalar(ecart);
  for(let it=0; it<120; it++){
    let bouge=false;
    for(let i=0;i<liste.length;i++) for(let j=i+1;j<liste.length;j++){
      const A=liste[i], B=liste[j];
      const d=A.a.distanceTo(B.a), min=A.R+B.R+SENS_MARGE;
      if(d<min && d>1e-4){
        const k=(min-d)/2/d; bouge=true;
        const dx=(A.a.x-B.a.x)*k, dy=(A.a.y-B.a.y)*k, dz=(A.a.z-B.a.z)*k;
        A.a.x+=dx; A.a.y+=dy; A.a.z+=dz; B.a.x-=dx; B.a.y-=dy; B.a.z-=dz;
      }
    }
    if(!bouge) break;
  }
  const centre=new THREE.Vector3();
  for(const f of liste) centre.addScaledVector(f.a, f.ids.length);
  centre.multiplyScalar(1/data.nodes.length);
  let loin=0;
  for(const f of liste) loin = Math.max(loin, f.a.distanceTo(centre) + f.R);
  const echelle = loin>0 ? SENS_RAYON/loin : 1;
  for(const r in fam){ const f=fam[r];
    const k = (f.R/f.etendue)*echelle;
    const ancre = f.a.clone().sub(centre).multiplyScalar(echelle);
    for(const id of f.ids)
      sortie[id] = brut[id].clone().sub(f.c).multiplyScalar(k).add(ancre);
  }
  const ancres = {};
  for(const r in fam) ancres[r] = { pos: fam[r].a.clone().sub(centre).multiplyScalar(echelle),
                                    rayon: fam[r].R*echelle };
  return { brut, sens:sortie, ancres, familles:liste.length };
}

    const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(arr,3));
    const mat=new THREE.LineBasicMaterial({ color:LINK_GREY.clone(), transparent:true, opacity:0.16, depthTest:false, depthWrite:false });
    const ligne=new THREE.Line(g, mat); group.add(ligne);
    const L={ a, b, attr:g.getAttribute('position'), mat, ligne, hot:false, idx:idx++, regle:!!l.regle };
    linkObjs.push(L); a.userData.links.push(L); b.userData.links.push(L);
  }

  const cmax=(data.coact && data.coact[0] && data.coact[0][2]) || 1;
  for(const e of (data.coact||[])){
    const a=meshById[e[0]], b=meshById[e[1]]; if(!a||!b) continue;
    const arr=new Float32Array((SEG+1)*3);
    const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(arr,3));
    const mat=new THREE.LineBasicMaterial({ color:0xFF6F36, transparent:true, opacity:0, depthTest:false, depthWrite:false });
    const ligne=new THREE.Line(g, mat); group.add(ligne);
    coactObjs.push({ a, b, attr:g.getAttribute('position'), mat, ligne, w:e[2]/cmax });
  }

  const totalN = data.nodes.length || 1; totalNoeuds = totalN;
  const voisine = {};
  for(const a of REGION_LIST){
    const da = REGION_DIR[a]||UP; let m = Infinity;
    for(const b2 of REGION_LIST){ if(b2===a) continue;
      const db = REGION_DIR[b2]||UP;
      m = Math.min(m, da.distanceTo(db)*R); }
    voisine[a] = isFinite(m) ? m : 4*R;
  }
  for(const r of REGION_LIST){
    const n = REGION_COUNT[r]||0, col = REGION_COLOR[r] || new THREE.Color(0xffffff);
    const voulu = 0.42 + 1.5*Math.sqrt(n/totalN);
    const rad = Math.min(voulu, 0.38*voisine[r]/1.8);
    const dir = (REGION_DIR[r]||UP).clone();
    const blob = new THREE.Object3D();
    blob.position.copy(dir).multiplyScalar(R);
    const grains = Math.min(n, 90);
    const pos = new Float32Array(grains*3);
    for(let i=0;i<grains;i++){
      const u=hash(r+':'+i), v=hash(i+':'+r), w=hash(r+i+'z');
      const th=2*Math.PI*u, ph=Math.acos(2*v-1), rr=rad*1.8*Math.cbrt(w);
      pos[i*3]  = rr*Math.sin(ph)*Math.cos(th);
      pos[i*3+1]= rr*Math.sin(ph)*Math.sin(th);
      pos[i*3+2]= rr*Math.cos(ph);
    }
    const gg=new THREE.BufferGeometry(); gg.setAttribute('position', new THREE.BufferAttribute(pos,3));
    const amas=new THREE.Points(gg, new THREE.PointsMaterial({ color:col, map:POINT_TEX, size:0.40,
      transparent:true, opacity:0.95, depthWrite:false, sizeAttenuation:true }));
    blob.add(amas);
    const lab = new THREE.Sprite(new THREE.SpriteMaterial({ map:texteTex(`${r}  ${n}`),
      transparent:true, depthTest:false, depthWrite:false, opacity:0.9 }));
    lab.renderOrder = 6;
    lab.scale.set(LABEL_W, LABEL_H, 1);
    lab.position.set(0, rad*1.8 + LABEL_H*0.45, 0);
    blob.add(lab);
    const c2 = REGION_2D[r] || {x:0,y:0};
    const anc = SENS.ancres[r];
    blob.userData = { region:r, n, rad, dir, colBase:col.clone(),
                      pos3: dir.clone().multiplyScalar(R),
                      pos2: new THREE.Vector3(c2.x*S2, c2.y*S2, 0),
                      posSens: anc ? anc.pos.clone() : new THREE.Vector3(),
                      radSens: anc ? anc.rayon : rad,
                      lab, blobMat:amas.material, labMat:lab.material };
    group.add(blob); regionObjs.push(blob);
  }
  {
    const paires = Object.entries(REGION_AFF).filter(([,v])=>v>0);
    const vmax = paires.reduce((m,[,v])=>Math.max(m,v), 1);
    for(const [k,v] of paires){
      const [ra,rb]=k.split('|'); const A=REGION_DIR[ra], B=REGION_DIR[rb]; if(!A||!B) continue;
      const arr=new Float32Array((SEG+1)*3);
      const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(arr,3));
      const mat=new THREE.LineBasicMaterial({ color:LINK_GREY.clone(), transparent:true,
        opacity:0, depthTest:false, depthWrite:false });
      const ligne=new THREE.Line(g, mat); group.add(ligne);
      regionLinks.push({ a:A.clone().multiplyScalar(R), b:B.clone().multiplyScalar(R),
                         attr:g.getAttribute('position'), mat, ligne, poids:v/vmax, ra, rb });
    }
  }

  prevIds=new Set(data.nodes.map(n=>n.id));
  document.getElementById('counts').innerHTML =
    `${data.counts.nodes} notes · ${data.counts.links} links · ${REGION_LIST.length} regions · ${data.counts.frontier} border${data.counts.frontier>1?'s':''}`
    + (data.counts.challenged ? ` · <span style="color:#e0a13a">⚠ ${data.counts.challenged} challenged</span>` : '')
    + (data.counts.unknown_relations ? ` · <span style="color:#e0a13a">⚠ ${data.counts.unknown_relations} relation type${data.counts.unknown_relations>1?'s':''} were not recognized; links remain visible but untyped. Run brain doctor for details.</span>` : '');
  const act=data.nodes.filter(n=>n.active), sEl=document.getElementById('session');
  if(act.length){
    const rc={}; for(const n of act){ const r=regionOf(n); rc[r]=(rc[r]||0)+1; }
    const top=Object.entries(rc).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([r])=>`<b>${r}</b>`);
    sEl.innerHTML=`◉ live in: ${top.join(' · ')}`;
  } else sEl.textContent='';
  buildLegend(data);
  buildPod();
  majFil();
  if(focusRegion){
    if(REGION_NODES[focusRegion]) poserFiches(focusRegion);
    else sortirRegion();
  }
}

function buildLegend(data){
  const projects=data.projects||[];
  const isProj=r=>projects.includes(r);
  const order=REGION_LIST.slice().sort((a,b)=>(REGION_COUNT[b]||0)-(REGION_COUNT[a]||0));
  const row=r=>{ const c='#'+REGION_COLOR[r].getHexString();
    return `<div class="row"><span class="dot" style="color:${c};background:${c}"></span>${r} (${REGION_COUNT[r]||0})</div>`; };
  const villes=order.filter(isProj).map(row).join('');
  const autres=order.filter(r=>!isProj(r)).map(row).join('');
  const maxN = Math.max(...REGION_LIST.map(r=>REGION_COUNT[r]||0), 1);
  const ligne = r => { const c='#'+(REGION_COLOR[r]||new THREE.Color(0xffffff)).getHexString();
    const n = REGION_COUNT[r]||0;
    return `<div class="row" data-region="${r}"><span class="dot" style="color:${c};background:${c}"></span>`
         + `<span class="nom">${r}</span><span class="bar"><i style="width:${Math.round(100*n/maxN)}%;background:${c}"></i></span>`
         + `<span class="nb">${n}</span></div>`; };
  const grosses = REGION_LIST.filter(r=>(REGION_COUNT[r]||0)>2)
                             .sort((a,b)=>(REGION_COUNT[b]||0)-(REGION_COUNT[a]||0));
  const petites = REGION_LIST.filter(r=>(REGION_COUNT[r]||0)<=2)
                             .sort((a,b)=>(REGION_COUNT[b]||0)-(REGION_COUNT[a]||0));
  const nPetites = petites.reduce((t,r)=>t+(REGION_COUNT[r]||0),0);
  const mk = [];
  if(data.counts.frontier)    mk.push(`<b style="color:#fff">◍</b> ${data.counts.frontier} borders`);
  if(data.counts.challenged)  mk.push(`<b style="color:#e0a13a">⚠</b> ${data.counts.challenged} challenged`);
  if(data.counts.convictions) mk.push(`<b style="color:#f5e2a0">✦</b> ${data.counts.convictions} convictions`);
  if(data.counts.resume)      mk.push(`<b style="color:#7fd4a0">↻</b> ${data.counts.resume} to resume`);
  if(data.counts.media)       mk.push(`<b style="color:#5ad7e6">▷</b> ${data.counts.media} replayable`);
  if(data.counts.regles)      mk.push(`<b style="color:#b9c6ff">§</b> ${data.counts.regles} cross-cutting rules`);
  document.getElementById('legend').innerHTML =
    `<div class="hd">regions — click to enter</div>` + grosses.map(ligne).join('') +
    (petites.length
      ? `<details class="repli"><summary>+ ${petites.length} regions with 1 to 2 notes `
        + `<em>(${nPetites} in total)</em></summary>${petites.map(ligne).join('')}</details>`
      : '') +
    `<div class="hd">markers</div><div class="mk">${mk.join(' · ')}</div>` +
    `<div class="mk" style="margin-top:5px"><b style="color:#7fe9ff">◯</b> ring = read less than ${Math.round(LIVE_WINDOW_S/60)} min ago</div>`;
  document.querySelectorAll('#legend .row').forEach(el=>{
    el.addEventListener('click', ()=> entrerRegion(el.dataset.region));
    el.addEventListener('mouseenter', ()=> { hoveredRegion = el.dataset.region; podViser(el.dataset.region); });
    el.addEventListener('mouseleave', ()=> { if(hoveredRegion===el.dataset.region) hoveredRegion=null;
                                             if(podHover===el.dataset.region) podViser(null); });
  });
}

function poserFiches(r){
  const ids = REGION_NODES[r]||[];
  const m = ids.length, ga = Math.PI*(3-Math.sqrt(5));
  const rang = new Map(ids.map((id,i)=>[id,i]));
  for(const mesh of nodeObjs){
    const nd = mesh.userData.data;
    const i = rang.get(nd.id);
    if(i===undefined){ mesh.userData.p3f=null; mesh.userData.p2f=null; continue; }
    const y = 1-2*(i+0.5)/m, rad = Math.sqrt(Math.max(0,1-y*y)), a = ga*i;
    const souffle = 0.70 + 0.32*hash(nd.id+'r');
    mesh.userData.p3f = new THREE.Vector3(Math.cos(a)*rad, y, Math.sin(a)*rad).multiplyScalar(R*souffle);
    const rr = S2*Math.sqrt((i+0.5)/m), aa = i*2.39996323;
    mesh.userData.p2f = new THREE.Vector3(Math.cos(aa)*rr, Math.sin(aa)*rr, 0);
  }
}

function placerPod(){
  const legEl = document.getElementById('legend');

  legEl.style.maxHeight = '';

    l = legEl.getBoundingClientRect();
  }
  const libre = Math.max(0, l.top - h.bottom - MARGE*2);
  const cote = Math.round(Math.max(MINI, Math.min(224, Math.min(libre - CHROME, innerWidth*0.19))));
  podEl.style.width  = cote + 'px';

  podEl.style.top = Math.round(h.bottom + MARGE + Math.max(0, (libre - haut)/2)) + 'px';

let podVit = 1;
function podTick(dt){
  podVit += ((podPtr.in ? 0 : 1) - podVit) * Math.min(1, dt*6);
  podGroup.rotation.y += dt*0.16*podVit;
  _podDir.copy(podCam.position).normalize();
  let best=null, bd=30;
  if(podPtr.in){
    const w=podCv.clientWidth||208, h=podCv.clientHeight||208;
    for(const p of podBlobs){
      p.getWorldPosition(_pw);
      if(_pw.clone().normalize().dot(_podDir) < 0.02) continue;
      _pw.project(podCam);
      const sx=(_pw.x*0.5+0.5)*w, sy=(-_pw.y*0.5+0.5)*h;
      const d=Math.hypot(sx-podPtr.x, sy-podPtr.y);
      if(d<bd){ bd=d; best=p; }
    }
  }
  const bn = best ? best.userData.region : null;
  if(bn!==podHover){ podViser(bn); if(!podDrag) podCv.style.cursor = bn ? 'pointer' : 'grab'; }
  const vise = podPin || podHover;
  for(const p of podBlobs){
    const on = p.userData.region===vise;
    const bat = (p.userData.region===podPin) ? 0.5+0.5*Math.sin(performance.now()/420) : 0;
    p.material.size    = THREE.MathUtils.lerp(p.material.size, on?1.42:1.15, 0.22);
    p.material.opacity = THREE.MathUtils.lerp(p.material.opacity, vise ? (on?1:0.5) : 1, 0.22);
    p.material.color.copy(p.userData.col).lerp(HOT, on ? 0.82+0.18*bat : 0);
  }
  podR.render(podScene, podCam);
}

function magnet(){
  camera.matrixWorld.extractBasis(camRight, camUp, new THREE.Vector3());
  const camDir=camera.position.clone().normalize();

  if(niveau2Global<0.5){
    hovered=null; applyHot(null); tip.classList.remove('show');
    let br=null, bd=MAGNET_RADIUS*1.6;
    for(const b of regionObjs){
      if(view<0.5 && b.userData.dir.dot(camDir)<0.05) continue;
      const s=toScreen(b.position); if(!s) continue;
      const d=Math.hypot(s.x-pointerPx.x, s.y-pointerPx.y);
      if(pointerIn && d<bd){ bd=d; br=b.userData.region; }
    }
    if(br!==hoveredRegion){
      hoveredRegion=br;
      document.body.style.cursor = br ? 'pointer' : '';
    }
    return;
  }
  hoveredRegion=null; document.body.style.cursor='';

  let best=null, bestD=MAGNET_RADIUS;
  for(const m of nodeObjs){
    m.userData._pull=0;
    if(m.userData.hatching || !m.visible) continue;
    if(view<0.5 && m.position.clone().normalize().dot(camDir)<0.12) continue;
    const s=toScreen(m.userData.base); if(!s) continue;
    const d=Math.hypot(s.x-pointerPx.x, s.y-pointerPx.y);
    m.userData._screen=s;
    if(pointerIn && d<bestD){ bestD=d; best=m; }
  }
  if(best) best.userData._pull=MAGNET_PULL*(1-bestD/MAGNET_RADIUS);
  if(best!==hovered){ hovered=best; if(!pinned){ if(best) showPanel(best,false); else tip.classList.remove('show'); } }
  applyHot(pinned||best);
}

const _off=new THREE.Vector3(), _tgt=new THREE.Vector3(), _p2=new THREE.Vector3();
const _p3f=new THREE.Vector3(), _p2f=new THREE.Vector3();
function easeMagnet(m){
  const k = m.userData.p3f ? niveau2Global : 0;
  _p3f.copy(m.userData.p3).lerp(m.userData.p3f||m.userData.p3, k);
  _p2f.copy(m.userData.p2).lerp(m.userData.p2f||m.userData.p2, k);
  _p2.copy(_p2f).lerp(m.userData.p2s, sem);
  _tgt.copy(_p3f).lerp(_p2, view);
  m.userData.base.copy(_tgt);
  const pull=m.userData._pull||0;
  if(pull>0){
    const s=m.userData._screen, dist=camera.position.distanceTo(m.position);
    const wpp=(2*Math.tan(THREE.MathUtils.degToRad(camera.fov)/2)*dist)/innerHeight;
    const dx=(pointerPx.x-s.x)*wpp, dy=(pointerPx.y-s.y)*wpp;
    _off.set(0,0,0).addScaledVector(camRight, dx*pull).addScaledVector(camUp, -dy*pull);

const _cd=new THREE.Vector3(), _mid=new THREE.Vector3(), _camDir=new THREE.Vector3();

function arcEntre(a, b, attr, flat){
  const arr=attr.array;
  const an=a.length()||1, bn=b.length()||1;
  const dot=THREE.MathUtils.clamp((a.x*b.x+a.y*b.y+a.z*b.z)/(an*bn), -1, 1);
  const lift=R*(1.12 + 0.6*(1-dot)/2);
  const mdx=a.x+b.x, mdy=a.y+b.y, mdz=a.z+b.z, ml=Math.hypot(mdx,mdy,mdz)||1;
  const ox=mdx/ml*lift, oy=mdy/ml*lift, oz=mdz/ml*lift;
  const cx=ox*(1-flat)+(mdx/2)*flat, cy=oy*(1-flat)+(mdy/2)*flat, cz=oz*(1-flat)+(mdz/2)*flat;
  for(let i=0;i<=SEG;i++){ const t=i/SEG, it=1-t, w=it*it, w2=2*it*t, w3=t*t;
    arr[i*3]=w*a.x+w2*cx+w3*b.x; arr[i*3+1]=w*a.y+w2*cy+w3*b.y; arr[i*3+2]=w*a.z+w2*cz+w3*b.z; }
  attr.needsUpdate=true;
  return _mid.set(cx,cy,cz);
}

let OCCLUSION = true;
function versNous(a, mid, b){
  if(!OCCLUSION) return 1;
  const aplat = view*(1-sem);
  _cd.copy(camera.position).normalize();
  const R0 = THREE.MathUtils.lerp(R, SEM, sem);
  const f = p => THREE.MathUtils.clamp((p.x*_cd.x+p.y*_cd.y+p.z*_cd.z)/R0, -1, 1);
  const coquille = THREE.MathUtils.smoothstep(Math.min(f(a), f(mid), f(b)), -0.15, 0.35);
  const volume   = THREE.MathUtils.smoothstep((f(a)+f(b)+2*f(mid))/4, -0.45, 0.20);
  return THREE.MathUtils.lerp(THREE.MathUtils.lerp(coquille, volume, sem), 1, aplat);
}

function updateLinks(time){
  _cd.copy(camera.position).normalize();
  const flat=view;
  for(const L of linkObjs){
    const vu = L.a.visible && L.b.visible;
    if(!vu){ L.mat.opacity=0; continue; }
    const a=L.a.position, b=L.b.position;
    const mid=arcEntre(a, b, L.attr, flat);
    const facing = versNous(a, mid, b);
    if(L.hot){ L.mat.opacity=0.92*facing; L.mat.color.copy(colorOf(L.a.userData.data)).lerp(HOT,0.45); }
    else if(L.regle){ L.mat.opacity=0; }
    else { L.mat.opacity=0.30*facing*niveau2Global*(1-0.80*sem);
           L.mat.color.copy(LINK_GREY); }
    L.ligne.visible = L.mat.opacity > 0.012;
  }
  for(const C of coactObjs){
    if(!(C.a.visible && C.b.visible) || usage<=0.001){ C.mat.opacity=0; C.ligne.visible=false; continue; }
    const a=C.a.position, b=C.b.position;
    const mid=arcEntre(a, b, C.attr, flat);
    C.mat.opacity = usage*(0.22 + 0.75*C.w)*versNous(a, mid, b)*niveau2Global;
    C.ligne.visible = C.mat.opacity > 0.012;
  }
}

async function poll(){

let _last=0, _lastF=0;
function tick(now){
  requestAnimationFrame(tick);
  if(document.hidden) return;
  if(vOpen) return;
  if(now - _last < 16) return;
  _last = now;
  const time=now/1000;
  const nowSec=Date.now()/1000; let liveCount=0;
  const dtF = Math.min(0.1, (now-_lastF)/1000 || 0.016); _lastF = now;
  const kV = 1-Math.exp(-dtF*7);
  view += (viewTarget-view)*kV; if(Math.abs(viewTarget-view)<0.001) view=viewTarget;
  sem  += (semTarget-sem)*kV;   if(Math.abs(semTarget-sem)<0.001)   sem=semTarget;
  usage += (usageTarget-usage)*kV; if(Math.abs(usageTarget-usage)<0.001) usage=usageTarget;
  focus += (focusTarget-focus)*kV;
  if(Math.abs(focusTarget-focus)<0.004) focus=focusTarget;
  if(focusRegion) regionVue=focusRegion; else if(focus<0.01) regionVue=null;
  const toutMontrer = sem>0.01;
  const niveau2 = Math.max(focus, sem);
  niveau2Global = niveau2;
  const morphing = Math.abs(viewTarget-view)>0.001;
  const enVolume = view<0.5 || sem>0.5;
  controls.autoRotate  = enVolume;
  controls.enableRotate = enVolume;
  controls.minDistance = view>0.5 ? 5 : 16;
  const morphSens = Math.abs(semTarget-sem)>0.001;
  if(viewTarget>0.5 && semTarget<0.5 && (morphing || morphSens)){
    camera.position.lerp(CAM2D, 0.06); controls.target.lerp(ORIGIN, 0.08); }
  else if(viewTarget<0.5 && (morphing || morphSens)){
    const d = camera.position.length(), cible = CAM3D.length();
    if(Math.abs(d-cible) > 0.5) camera.position.multiplyScalar(1 + (cible/d - 1)*0.08);
    controls.target.lerp(ORIGIN, 0.08); }
  controls.update();
  coreMat.opacity=0.55*(1-view); core.visible=false;
  const verreK = (1-view)*(1-niveau2Global);
  verre.material.opacity=0.13*verreK; verre.visible=verreK>0.01;
  grille.material.opacity=0.10*verreK; grille.visible=verreK>0.01;
  _camDir.copy(camera.position).normalize();
  for(const b of regionObjs){
    const dedans = b.userData.region===regionVue;
    const devant = THREE.MathUtils.lerp(
      THREE.MathUtils.smoothstep(b.userData.dir.dot(_camDir), -0.28, 0.02), 1, view);
    b.position.copy(b.userData.pos3).lerp(b.userData.pos2, view).lerp(b.userData.posSens, sem);
    const k = (1-niveau2)*devant;
    b.visible = k>0.01 || sem>0.01;
    b.userData.blobMat.visible = k>0.01;
    const s = dedans ? THREE.MathUtils.lerp(1, 2.2, niveau2) : 1;
    b.scale.setScalar(THREE.MathUtils.lerp(b.scale.x, s, 0.2));
    const vise = b.userData.region===hoveredRegion || b.userData.region===(podPin||podHover);
    b.userData.blobMat.opacity = (vise?1:0.9)*k;
    b.userData.blobMat.size = THREE.MathUtils.lerp(b.userData.blobMat.size, vise?0.62:0.42, 0.25);
    b.userData.blobMat.color.copy(b.userData.colBase).lerp(HOT, vise?0.35:0);
    const poids = 0.34 + 0.61*Math.sqrt(b.userData.n/Math.max(1,totalNoeuds));
    const kLab = Math.max(k, sem*devant);
    b.userData.labMat.opacity = (b.userData.region===(hoveredRegion||podPin||podHover) ? 1 : Math.min(0.95, poids))*kLab;
    b.userData.lab.position.y = THREE.MathUtils.lerp(b.userData.rad*1.8,
                                  Math.min(b.userData.radSens*0.85, 4.5), sem) + LABEL_H*0.45;
    b.userData.lab.visible = kLab > 0.01;
  }
  decollerEtiquettes();
  for(const L of regionLinks){
    const k=1-niveau2;
    if(k<=0.01){ L.mat.opacity=0; if(L.ligne) L.ligne.visible=false; continue; }
    const mid=arcEntre(L.a, L.b, L.attr, view);
    L.mat.opacity = k*(0.03 + 0.15*L.poids)*versNous(L.a, mid, L.b);
    if(L.ligne) L.ligne.visible = L.mat.opacity > 0.012;
  }
  magnet();
  const viseFamille = podPin || podHover;
  for(const m of nodeObjs){
    const dansLaVue = toutMontrer || (regionVue && regionOf(m.userData.data)===regionVue);
    if(!dansLaVue || niveau2<=0.01){
      const sc = THREE.MathUtils.lerp(m.scale.x, 0, kV);
      m.scale.setScalar(Math.max(sc, 0.0001));
      m.visible = sc > 0.02;
      continue;
    }
    m.visible = true;
    if(m.userData.hatching){ m.scale.multiplyScalar(1.08); if(m.scale.x>=1){ m.scale.setScalar(1); m.userData.hatching=false; } continue; }
    easeMagnet(m);
    m.material.color.copy(m.userData.col);
    const ht=m.userData.heat||0;
    if(ht>0.25){
      const b=0.5+0.5*Math.sin(time*(1.1+1.2*ht)+m.userData.pulse);
      m.material.color.lerp(HOT, (0.10+0.30*ht)*b*b*b);
    }
    let fam = 1;
    if(viseFamille){
      const dedans = regionOf(m.userData.data)===viseFamille;
      fam = dedans ? 1.9 : 1;
      if(dedans) m.material.color.lerp(HOT, 0.55); else m.material.color.multiplyScalar(0.45);
    }
    const ts=((m===hovered)?MAGNET_SCALE:1)*niveau2*fam;
    m.scale.setScalar(THREE.MathUtils.lerp(m.scale.x, ts, 1-Math.exp(-dtF*16)));
    if(m.userData.activeRing){
      const alive = (nowSec - m.userData.activeTs) <= LIVE_WINDOW_S;
      m.userData.activeRing.visible = alive;
      if(alive){ liveCount++; m.userData.activeRing.material.opacity = 0.35 + 0.4*(0.5+0.5*Math.sin(time*2.4)); }
    }
    if(m.userData.playMark) m.userData.playMark.material.opacity = 0.55 + 0.35*(0.5+0.5*Math.sin(time*2.2));
  }
  {
    let disparu = 0;
    for(const m of nodeObjs){
      const ech = m.userData._ech || 0;
      if(m.userData._vu && !m.visible && ech > 0.15) disparu += ech;
      m.userData._vu = m.visible; m.userData._ech = m.scale.x;
    }
    if(disparu > _coupurePic) _coupurePic = disparu;
  }
  if(liveCount!==_liveShown){
    _liveShown=liveCount;
    liveEl.innerHTML = liveCount
      ? `◉ ${liveCount} live point${liveCount>1?'s':''} <span style="opacity:.6">— read in the last ${Math.round(LIVE_WINDOW_S/60)} min</span>`
      : `<span class="off">◉ 0 live points — nothing read for ${Math.round(LIVE_WINDOW_S/60)} min</span>`;
    if(!liveCount){ const s=document.getElementById('session'); if(s) s.textContent=''; }
  }
  updateLinks(time);
  const _sensTag = etiquetteSens(semCap);
  const _t = view<0.5 ? (focusRegion ? `[ REGION — ${focusRegion.toUpperCase()} ]` : '[ TRUNK PLANET ]')
                      : (sem>0.5 ? _sensTag.titre : '[ TRUNK MAP — STRUCTURE ]');
  if(titleEl && titleEl.textContent !== _t) titleEl.textContent = _t;
  vtag.textContent = view<0.5 ? etiquette3d(semCap, focusRegion)
    : (sem>0.5 ? _sensTag.bandeau
               : `▦ STRUCTURE — the ${REGION_LIST.length} ${REGION_LIST.length > 1 ? 'families' : 'family'}, laid flat · click a family = in volume`);
  syncModeButtons();
  composer.render();
  podTick(dtF);
}
tick(0);
</script>
  <div id="grille"></div>
</body>
