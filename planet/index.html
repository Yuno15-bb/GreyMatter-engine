//  · STATIQUE = pas d'OrbitControls. Elle tourne toute seule et ne se manipule pas — sinon
//    c'est un deuxième pilotage à côté du premier, et on ne sait plus lequel on tient.
//  · PROXIMITÉ = viser une famille. Le globe dit le rangement, le grand écran dit le sens :
//    la capsule sert à demander « et cette famille-là, elle est où dans le sens ? ».
const podCv  = document.getElementById('pc');
const podCap = document.querySelector('#pod .cap');
const podR   = new THREE.WebGLRenderer({ canvas:podCv, antialias:true, alpha:true });
podR.setPixelRatio(Math.min(devicePixelRatio, 1.5));
podR.setSize(208, 208, false);
const podScene = new THREE.Scene();
const podCam   = new THREE.PerspectiveCamera(46, 1, 0.1, 200);
podCam.position.set(0, 4.5, 30); podCam.lookAt(0,0,0);
let podGroup = new THREE.Group(); podScene.add(podGroup);
let podBlobs = [];
let podHover = null, podPin = null;                 // famille visée (survol) · famille épinglée (clic)
const podPtr = { x:-1e4, y:-1e4, in:false };
const _pw = new THREE.Vector3(), _podDir = new THREE.Vector3();

function buildPod(){
  podGroup.removeFromParent();
  podGroup.traverse(o=>{ o.geometry?.dispose?.(); o.material?.dispose?.(); });
  podGroup = new THREE.Group(); podScene.add(podGroup); podBlobs=[];
  // le globe de verre en fil de fer : sans lui, les amas flottent sans surface commune et on
  // ne voit plus que c'est UNE sphère qu'on tourne.
  // ⚠️ maille LÂCHE et discrète : à 208 px, une sphère de 22×14 segments à 11 % ne se lit pas
  // comme un repère mais comme une surface pleine, et les amas s'y noient (vérifié en capture).
  podGroup.add(new THREE.Mesh(new THREE.SphereGeometry(R*0.99, 12, 8),
    new THREE.MeshBasicMaterial({ color:0x7A2200, wireframe:true, transparent:true,
      opacity:0.30, depthWrite:false })));
  // un amas par région, repris tel quel de la grande carte (même graine, donc même forme :
  // la mémoire visuelle d'une famille doit survivre au changement d'échelle).
  for(const b of regionObjs){
    const src = b.children[0];                      // children[0] = l'amas de points, [1] = l'étiquette
    if(!src || !src.geometry) continue;
    const pts = new THREE.Points(src.geometry.clone(), new THREE.PointsMaterial({
      color:b.userData.colBase.clone(), map:POINT_TEX, size:1.15, transparent:true,
      opacity:1, depthWrite:false, sizeAttenuation:true }));
    pts.position.copy(b.userData.pos3);
    pts.userData = { region:b.userData.region, col:b.userData.colBase.clone() };
    podGroup.add(pts); podBlobs.push(pts);
  }
  // une famille épinglée qui a disparu du graphe laisserait tout le nuage éteint sans rien allumer
  if(podPin && !REGION_COUNT[podPin]) podPin=null;
  if(podHover && !REGION_COUNT[podHover]) podHover=null;
  majPodCap();
  placerPod();                       // the legend was just rewritten: free space changed
}

// La capsule tient dans l'espace RÉELLEMENT libre entre le HUD et la légende. Mesuré à chaque
// reconstruction et à chaque redimensionnement : la légende change de hauteur quand une région
// apparaît, et une fenêtre courte ne laisse pas la même place qu'un 27 pouces.
const podEl = document.getElementById('pod');
const MINI = 132;                             // en dessous, le globe n'est plus lisible
function placerPod(){
  const legEl = document.getElementById('legend');
  const h = document.getElementById('hud').getBoundingClientRect();
  const MARGE = 22, CHROME = 40;              // CHROME = titre + légende + bordures de la capsule
  // ⚠️ SUR UNE FENÊTRE COURTE, C'EST LA LÉGENDE QUI CÈDE, PAS LE GLOBE. Première version :
  // en dessous de 150 px d'espace libre la capsule disparaissait — mesuré, elle s'effaçait dès
  // 640 px de hauteur. Or la légende, elle, sait défiler (`overflow-y:auto`) : on lui reprend
  // la place qu'il faut plutôt que de supprimer une des deux vues.
  legEl.style.maxHeight = '';
  let l = legEl.getBoundingClientRect();
  const requis = MINI + CHROME + MARGE*2;
  if(l.top - h.bottom < requis){
    legEl.style.maxHeight = Math.max(90, innerHeight - 16 - h.bottom - requis) + 'px';
    l = legEl.getBoundingClientRect();
  }
  const libre = Math.max(0, l.top - h.bottom - MARGE*2);
  const cote = Math.round(Math.max(MINI, Math.min(224, Math.min(libre - CHROME, innerWidth*0.19))));
  podEl.style.width  = cote + 'px';
  podCv.style.width  = (cote-16) + 'px';
  podCv.style.height = (cote-16) + 'px';
  podR.setSize(cote-16, cote-16, false);
  podCam.aspect = 1; podCam.updateProjectionMatrix();
  const haut = (cote-16) + CHROME;
  podEl.style.top = Math.round(h.bottom + MARGE + Math.max(0, (libre - haut)/2)) + 'px';
  // fenêtre trop courte pour loger le globe entre les deux : on le cache plutôt que de le laisser
  // chevaucher la légende — un panneau posé par-dessus un autre ne se lit ni l'un ni l'autre.
  // il ne reste que le cas vraiment extrême : une fenêtre où même la légende repliée ne libère rien
  podEl.style.display = (libre < MINI) ? 'none' : '';
}
addEventListener('resize', placerPod);

function majPodCap(){
  const r = podPin || podHover;
  if(r) podCap.innerHTML = `<b>${r}</b> — ${REGION_COUNT[r]||0} notes`
                         + (podPin===r ? ` <span class="off">· click = release</span>` : '');
  else  podCap.innerHTML = `<span class="off">${podBlobs.length} families · aim to light up</span>`;
}

// Le survol de la LÉGENDE allume la même chose que le survol de la capsule : deux endroits qui
// désignent une famille ne doivent pas avoir deux effets différents.
function podViser(r){ if(r!==podHover){ podHover=r; majPodCap(); } }

podCv.addEventListener('pointermove', e=>{
  const b=podCv.getBoundingClientRect();
  podPtr.x=e.clientX-b.left; podPtr.y=e.clientY-b.top; podPtr.in=true;
  pointerIn=false;                                  // le curseur est DANS la capsule : l'aimant de la grande carte lâche
  if(podDrag){
    const dx=e.clientX-podDrag.x, dy=e.clientY-podDrag.y;
    podDrag={x:e.clientX,y:e.clientY}; podBouge += Math.hypot(dx,dy);
    podGroup.rotation.y += dx*0.009;
    // l'inclinaison est BRIDÉE : passé les pôles le globe se retourne et la carte devient
    // illisible — un objet qu'on oriente doit garder un haut et un bas.
    podGroup.rotation.x = THREE.MathUtils.clamp(podGroup.rotation.x + dy*0.009, -1.0, 1.0);
  }
});
podCv.addEventListener('pointerleave', ()=>{ podPtr.in=false; });

// ── ON PEUT LA TOURNER À LA MAIN — mais RIEN D'AUTRE ────────────────────────
// l'auteur, 2026-08-14 : « "globe les familles" peut être tournable, mais seulement rotation
// statique ». Donc : glisser = tourner le globe, et c'est tout. Pas de zoom, pas de
// déplacement, la capsule ne bouge pas de son coin. C'est ce qui la garde INSTRUMENT : un
// objet qu'on oriente, pas une deuxième carte à piloter à côté de la première.
// On n'utilise pas OrbitControls : il apporte le zoom et le panoramique avec lui, et il
// faudrait ensuite les désactiver un par un. Deux axes suffisent, écrits à la main.
podGroup.rotation.order = 'YXZ';                    // Y = la rotation du globe, X = l'inclinaison
let podDrag=null, podBouge=0;
podCv.addEventListener('pointerdown', e=>{
  podDrag={x:e.clientX,y:e.clientY}; podBouge=0;
  podCv.setPointerCapture?.(e.pointerId); podCv.style.cursor='grabbing';
});
const podLache = ()=>{ if(podDrag){ podDrag=null; podCv.style.cursor = podHover?'pointer':'default'; } };
addEventListener('pointerup', podLache);
podCv.addEventListener('pointercancel', podLache);
// le clic n'épingle que si la main n'a pas glissé : sinon toute rotation finirait par épingler
podCv.addEventListener('click', ()=>{
  if(podBouge>5) return;
  podPin = (podHover && podPin!==podHover) ? podHover : null; majPodCap(); majFil();
});

let podVit = 1;                                     // 1 = elle tourne · 0 = arrêtée sous le curseur
function podTick(dt){
  // ⚠️ ELLE S'ARRÊTE SOUS LE CURSEUR. Sans ça, la cible s'échappe : à 0,16 rad/s un amas se
  // déplace d'une vingtaine de pixels par seconde dans une fenêtre de 208 px, donc la famille
  // qu'on vient de viser sort du rayon de visée toute seule, sans que la souris ait bougé.
  // Mesuré par le contrôle exécuté, qui perdait l'épingle entre deux lectures.
  podVit += ((podPtr.in ? 0 : 1) - podVit) * Math.min(1, dt*6);
  podGroup.rotation.y += dt*0.16*podVit;            // elle tourne toute seule, à peu près un tour/40 s
  _podDir.copy(podCam.position).normalize();
  let best=null, bd=30;                             // rayon de visée, en pixels de la capsule
  if(podPtr.in){
    const w=podCv.clientWidth||208, h=podCv.clientHeight||208;
    for(const p of podBlobs){
      p.getWorldPosition(_pw);
      if(_pw.clone().normalize().dot(_podDir) < 0.02) continue;   // amas de la face arrière : pas visable
      _pw.project(podCam);
      const sx=(_pw.x*0.5+0.5)*w, sy=(-_pw.y*0.5+0.5)*h;
      const d=Math.hypot(sx-podPtr.x, sy-podPtr.y);
      if(d<bd){ bd=d; best=p; }
    }
  }
  const bn = best ? best.userData.region : null;
  if(bn!==podHover){ podViser(bn); if(!podDrag) podCv.style.cursor = bn ? 'pointer' : 'grab'; }
  const vise = podPin || podHover;
  for(const p of podBlobs){
    const on = p.userData.region===vise;
    // ⚠️ TOUTES LES RÉGIONS RESTENT ALLUMÉES (l'auteur, 2026-08-14 : « dans la petite orbe,
    // éclaire toutes les régions »). La capsule est une CARTE : si viser une famille éteint
    // les dix-neuf autres, elle ne montre plus où on est. Le viser se dit par la TAILLE et la
    // teinte chaude, pas par l'extinction du voisinage.
    // ⚠️ L'AMAS VISÉ DOIT S'ÉCLAIRCIR POUR DE BON (l'auteur, 2026-08-14 : « elle s'éclaircit peu
    // je trouve, sur l'amas »). Un +40 % de teinte chaude sur un orange déjà chaud ne se voit
    // pas : c'est la même couleur, en un peu plus clair. La famille visée passe donc presque au
    // blanc chaud, grossit franchement, et pulse une fois épinglée — trois signaux, pas un.
    // ⚠️ ÉCLAIRCIR N'EST PAS GROSSIR (l'auteur, 2026-08-14 : « ça s'éclaircit, mais c'est très
    // gras »). À 2,7 les grains d'un amas de 60 fiches se recouvrent et fusionnent en une tache
    // blanche : on gagne le repérage et on perd l'information — l'amas ne dit plus combien il
    // porte ni comment il est réparti. La visée passe donc par la LUMIÈRE (presque blanc) et par
    // le RECUL du reste ; la taille bouge à peine, juste de quoi accrocher l'œil.
    const bat = (p.userData.region===podPin) ? 0.5+0.5*Math.sin(performance.now()/420) : 0;
    p.material.size    = THREE.MathUtils.lerp(p.material.size, on?1.42:1.15, 0.22);
    p.material.opacity = THREE.MathUtils.lerp(p.material.opacity, vise ? (on?1:0.5) : 1, 0.22);
    p.material.color.copy(p.userData.col).lerp(HOT, on ? 0.82+0.18*bat : 0);
  }
  podR.render(podScene, podCam);
}

// ---------- survol + MAGNET + surlignage ----------
const MAGNET_RADIUS=95, MAGNET_PULL=0.45, MAGNET_SCALE=1.9;
let hovered=null, hotMesh=null, pointerPx={x:-1e4,y:-1e4}, pointerIn=false;
const camRight=new THREE.Vector3(), camUp=new THREE.Vector3(), _ndc=new THREE.Vector3();
addEventListener('pointermove', e=>{ pointerPx.x=e.clientX; pointerPx.y=e.clientY; pointerIn=true; });
addEventListener('pointerleave', ()=>{ pointerIn=false; });

function applyHot(m){
  if(hotMesh===m) return;
  if(hotMesh) for(const L of hotMesh.userData.links) L.hot=false;
  hotMesh=m;
  if(hotMesh) for(const L of hotMesh.userData.links) L.hot=true;
}

// ---- panneau ----
// Le contenu des fiches est du texte libre : il contient des < et des & (« 06-30→07-01 »,
// des extraits de code). Sans échappement, une fiche pourrait couper le panneau en deux.
const esc=s=>String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let pinned=null;
// ---- le corps des fiches, à la demande ----
// Il vit dans `textes.json` depuis le 2026-08-14 : dans graph.json il pesait 536 Ko sur 1051,
// pour un texte que seul le panneau déplié montre. On le charge au premier double-clic, une
// seule fois, et on le garde. `TEXTES_PRETS` distingue « pas encore chargé » de « cette fiche
// n'a pas de corps » — sans quoi le panneau afficherait « chargement… » pour toujours.
let TEXTES={}, TEXTES_PRETS=false, _texteEnVol=null;
function chargerTextes(){
  if(TEXTES_PRETS) return Promise.resolve(TEXTES);
  if(!_texteEnVol) _texteEnVol = fetch('textes.json', {cache:'no-cache'})
    .then(r=>r.json())
    .then(j=>{ TEXTES=j; TEXTES_PRETS=true; return j; })
    .catch(()=>{ TEXTES_PRETS=true; return TEXTES; });   // absent → on n'insiste pas, le reste marche
  return _texteEnVol;
}
function memLine(n){
  const m=n.membership||{}, ks=Object.keys(m);
  if(!n.primary_project) return `<b>${regionOf(n)}</b> · cross-cutting, no city`;
  return (n.frontier?'border · ':'city · ')+ks.map(c=>`<b>${c}</b> ${m[c]}`).join('  ·  ');
}
let _ficheAffichee=null;      // quelle fiche le panneau montre, pour le rafraîchir à l'arrivée du texte
function showPanel(mesh, expanded){
  const n=mesh.userData.data;
  _ficheAffichee=n.id;
  tip.style.setProperty('--accent', '#'+colorOf(n).getHexString());
  const title=n.title || (n.name||'').replace(/-/g,' ').replace(/^\w/, c=>c.toUpperCase());
  tip.querySelector('.lbl').innerHTML=(n.primary_project||regionOf(n))+(n.frontier?' <span class="frontier">⟡ border</span>':'');
  tip.querySelector('.n').textContent=title;
  tip.querySelector('.mem').innerHTML=memLine(n);
  // avis du challenger (Étage 3) : la carte donne son avis sur cette fiche
  const chEl=tip.querySelector('.ch');
  if(n.challenge){ chEl.textContent='⚠ challenger verdict — '+n.challenge; chEl.classList.add('show'); }
  else { chEl.classList.remove('show'); chEl.textContent=''; }
  const cvEl=tip.querySelector('.cv');
  if(n.conviction){ cvEl.textContent='✦ conviction — '+n.conviction; cvEl.classList.add('show'); }
  else { cvEl.classList.remove('show'); cvEl.textContent=''; }
  const rsEl=tip.querySelector('.rs');
  if(n.resume){ rsEl.textContent='↻ resume point — an open thread in this note'; rsEl.classList.add('show'); }
  else { rsEl.classList.remove('show'); rsEl.textContent=''; }
  const mEl=tip.querySelector('.media');
  if(n.media){ mEl.textContent='▷ replayable 3D capture — double-click to open'; mEl.classList.add('show'); }
  else { mEl.classList.remove('show'); mEl.textContent=''; }
  // connexions : les fiches reliées à ce point (titre descriptif + région si autre catégorie)
  // ⚠ AU CLIC SEULEMENT. Demande de l'auteur (2026-08-15) : au survol, le panneau montre le
  // titre et le résumé, rien d'autre. On lit UNE chose et on passe ; seize pastilles sous le
  // résumé faisaient du panneau volant un mur, et allongeaient la fiche au point de la faire
  // défiler alors que le curseur bouge encore. Les connexions sont une exploration, pas une
  // information de survol : elles arrivent quand on a décidé de s'arrêter (clic → `expanded`).
  const others=expanded ? (mesh.userData.links||[]).map(L=> L.a===mesh?L.b:L.a) : [];
  const CAP=16, rn=regionOf(n);
  let lh='';
  if(others.length){
    const chips=others.slice(0,CAP).map(o=>{ const d=o.userData.data, col='#'+colorOf(d).getHexString();
      const cross = regionOf(d)!==rn ? ` <em>· ${regionOf(d)}</em>` : '';
      return `<span class="c" style="--cc:${col}"><i></i>${d.title||(d.name||'').replace(/-/g,' ')}${cross}</span>`; }).join('');
    lh=`<span class="hd">connections (${others.length})</span>${chips}`+(others.length>CAP?`<span class="c">+${others.length-CAP}</span>`:'');
  }
  tip.querySelector('.lnk').innerHTML=lh;
  // « En clair » d'abord, texte complet replié derrière (format tranché par l'auteur le
  // 2026-08-14 : UN fichier par fiche, deux registres, l'afficheur choisit lequel montre).
  // Les fiches pas encore converties retombent sur l'ancien comportement, sans trou.
  // ── DEUX BLOCS, ET ON DIT LEQUEL EST POUR QUI ──
  // l'auteur : « le résumé des fiches n'est pas visuellement séparé pour toi et moi ». C'était vrai :
  // le bloc humain et le texte technique se suivaient dans la même colonne, même corps, même
  // couleur — rien ne disait où l'un finissait. Chaque bloc porte maintenant son destinataire.
  const dEl=tip.querySelector('.d');
  if(expanded){
    const bloc = [];
    if(n.en_clair) bloc.push(
      `<section class="bl clair"><header><span class="qui">for you</span>`
      + `<span class="quoi">in plain words, no jargon</span></header>`
      + `<div class="txt">${esc(n.en_clair)}</div></section>`);
    // Le corps de la fiche ne voyage plus dans graph.json (il en pesait la moitié) : il est
    // dans `textes.json`, chargé au PREMIER dépliage puis gardé en mémoire. Le panneau s'ouvre
    // tout de suite et se complète quand le texte arrive — on ne fait pas attendre un double-clic.
    const corps = n.long || TEXTES[n.id];
    if(corps) bloc.push(
      `<details class="bl modele"${n.en_clair?'':' open'}>`
      + `<summary><span class="qui">for the model</span>`
      + `<span class="quoi">the whole note, dense</span></summary>`
      + `<div class="txt">${esc(corps)}</div></details>`);
    else if(!TEXTES_PRETS) {
      bloc.push(`<details class="bl modele"${n.en_clair?'':' open'}><summary>`
        + `<span class="qui">for the model</span><span class="quoi">loading…</span></summary></details>`);
      // on se rappelle QUELLE fiche est à l'écran plutôt que de regarder `pinned` : le panneau
      // s'ouvre aussi par d'autres chemins (le harnais d'audit appelle showPanel directement),
      // et un rafraîchissement qui ne marche que dans un seul cas est un rafraîchissement cassé.
      chargerTextes().then(()=>{ if(_ficheAffichee===n.id && tip.classList.contains('expanded')) showPanel(mesh, true); });
    }
    if(!bloc.length) bloc.push(`<div class="txt">${esc(n.desc||'(pas de contenu)')}</div>`);
    dEl.innerHTML = bloc.join('');
  } else {
    // au survol, la place est comptée : premier paragraphe du « en clair », sinon la desc.
    const court=n.en_clair?n.en_clair.split('\n\n')[0]:null;
    dEl.textContent=court||n.desc||'(pas de description)';
  }
  tip.querySelector('.f').textContent=n.file;
  tip.classList.add('show'); tip.classList.toggle('expanded', !!expanded);
}
function unpin(){ pinned=null; tip.classList.remove('expanded'); if(hovered) showPanel(hovered,false); else tip.classList.remove('show'); }
addEventListener('dblclick', ()=>{ if(hovered){
  const nd=hovered.userData.data;
  if(nd.media){ openViewer(nd.media); return; }      // nœud REJOUABLE → ouvre la capture 3D (Étage 4)
  pinned=hovered; showPanel(pinned,true); tip.querySelector('.body').scrollTop=0; } });
tip.querySelector('.x').addEventListener('click', unpin);
addEventListener('keydown', e=>{ if(e.key==='Escape'&&pinned) unpin(); });

function toScreen(p){ _ndc.copy(p).project(camera); if(_ndc.z>1) return null;
  return { x:(_ndc.x*0.5+0.5)*innerWidth, y:(-_ndc.y*0.5+0.5)*innerHeight }; }

function magnet(){
  camera.matrixWorld.extractBasis(camRight, camUp, new THREE.Vector3());
  const camDir=camera.position.clone().normalize();

  // ── NIVEAU 1 : ce sont les BULLES qu'on vise, pas les fiches (elles ne sont pas là) ──
  if(niveau2Global<0.5){
    hovered=null; applyHot(null); tip.classList.remove('show');
    let br=null, bd=MAGNET_RADIUS*1.6;              // cible plus large : 20 bulles, pas 354 points
    for(const b of regionObjs){
      if(view<0.5 && b.userData.dir.dot(camDir)<0.05) continue;   // bulle derrière le globe
      const s=toScreen(b.position); if(!s) continue;
      const d=Math.hypot(s.x-pointerPx.x, s.y-pointerPx.y);
      if(pointerIn && d<bd){ bd=d; br=b.userData.region; }
    }
    if(br!==hoveredRegion){
      hoveredRegion=br;
      document.body.style.cursor = br ? 'pointer' : '';
    }
    return;
  }
  hoveredRegion=null; document.body.style.cursor='';

  let best=null, bestD=MAGNET_RADIUS;
  for(const m of nodeObjs){
    m.userData._pull=0;
    if(m.userData.hatching || !m.visible) continue;
    if(view<0.5 && m.position.clone().normalize().dot(camDir)<0.12) continue;
    const s=toScreen(m.userData.base); if(!s) continue;
    const d=Math.hypot(s.x-pointerPx.x, s.y-pointerPx.y);
    m.userData._screen=s;
    if(pointerIn && d<bestD){ bestD=d; best=m; }
  }
  if(best) best.userData._pull=MAGNET_PULL*(1-bestD/MAGNET_RADIUS);
  if(best!==hovered){ hovered=best; if(!pinned){ if(best) showPanel(best,false); else tip.classList.remove('show'); } }
  applyHot(pinned||best);
}

// Entrer dans une région : un simple clic. Pas de double-clic ici — le double-clic sert déjà à
// déplier une fiche, et deux gestes voisins pour deux effets différents se confondent.
// Le clic ne doit pas se déclencher au bout d'un GLISSER de rotation : on mesure le déplacement.
let _downXY=null;
addEventListener('pointerdown', e=>{ _downXY = e.target?.closest?.('#pod') ? null : [e.clientX, e.clientY]; });
addEventListener('pointerup', e=>{
  if(!_downXY || e.target?.closest?.('#pod')) return;   // un clic DANS la capsule n'entre pas dans une région
  const bouge = Math.hypot(e.clientX-_downXY[0], e.clientY-_downXY[1]);
  _downXY=null;
  if(bouge>5) return;                               // c'était une rotation, pas un clic
  if(niveau2Global<0.5 && hoveredRegion) entrerRegion(hoveredRegion);
});

const _off=new THREE.Vector3(), _tgt=new THREE.Vector3(), _p2=new THREE.Vector3();
const _p3f=new THREE.Vector3(), _p2f=new THREE.Vector3();
function easeMagnet(m){
  // Dans une région ouverte, la fiche quitte la calotte de son continent pour reprendre TOUT
  // l'espace : c'est là que la densité tombe. Le glissement est continu, donc on voit d'où
  // chaque point sort — sinon entrer dans une région ressemblerait à un changement de page.
  const k = m.userData.p3f ? niveau2Global : 0;
  _p3f.copy(m.userData.p3).lerp(m.userData.p3f||m.userData.p3, k);
  _p2f.copy(m.userData.p2).lerp(m.userData.p2f||m.userData.p2, k);
  _p2.copy(_p2f).lerp(m.userData.p2s, sem);            // 2D : structure → sens
  _tgt.copy(_p3f).lerp(_p2, view);                     // 3D → 2D
  m.userData.base.copy(_tgt);
  const pull=m.userData._pull||0;
  if(pull>0){
    const s=m.userData._screen, dist=camera.position.distanceTo(m.position);
    const wpp=(2*Math.tan(THREE.MathUtils.degToRad(camera.fov)/2)*dist)/innerHeight;
    const dx=(pointerPx.x-s.x)*wpp, dy=(pointerPx.y-s.y)*wpp;
    _off.set(0,0,0).addScaledVector(camRight, dx*pull).addScaledVector(camUp, -dy*pull);
    _tgt.add(_off);
  }
  m.position.lerp(_tgt, 0.3);
}

// arcs PAR-DESSUS le globe, jamais à l'intérieur
const _cd=new THREE.Vector3(), _mid=new THREE.Vector3(), _camDir=new THREE.Vector3();

/* Trace l'arc entre deux points et rend son point de contrôle. Extrait de updateLinks pour que
   les liens AGRÉGÉS de la vue d'ensemble utilisent exactement la même courbe — deux tracés
   différents pour la même idée finiraient par diverger. */
function arcEntre(a, b, attr, flat){
  const arr=attr.array;
  const an=a.length()||1, bn=b.length()||1;
  const dot=THREE.MathUtils.clamp((a.x*b.x+a.y*b.y+a.z*b.z)/(an*bn), -1, 1);
  const lift=R*(1.12 + 0.6*(1-dot)/2);            // rayon du point de contrôle (toujours > R)
  const mdx=a.x+b.x, mdy=a.y+b.y, mdz=a.z+b.z, ml=Math.hypot(mdx,mdy,mdz)||1;
  const ox=mdx/ml*lift, oy=mdy/ml*lift, oz=mdz/ml*lift;
  const cx=ox*(1-flat)+(mdx/2)*flat, cy=oy*(1-flat)+(mdy/2)*flat, cz=oz*(1-flat)+(mdz/2)*flat;
  for(let i=0;i<=SEG;i++){ const t=i/SEG, it=1-t, w=it*it, w2=2*it*t, w3=t*t;
    arr[i*3]=w*a.x+w2*cx+w3*b.x; arr[i*3+1]=w*a.y+w2*cy+w3*b.y; arr[i*3+2]=w*a.z+w2*cz+w3*b.z; }
  attr.needsUpdate=true;
  return _mid.set(cx,cy,cz);
}

/* Combien ce lien est-il TOURNÉ VERS NOUS. 0 = entièrement derrière le globe.
   ⚠️ Avant, ce calcul ne regardait que le sommet de l'arc et plancherait à 0.18 : un lien qui
   traverse le globe a son sommet sur la tranche, donc facing ≈ 0.5 — il restait bien visible.
   Avec 640 liens sur 1374 dans ce cas, ça faisait un grillage permanent par-dessus la face
   avant. On prend maintenant le PLUS CACHÉ des trois points (départ, sommet, arrivée) et le
   plancher tombe à zéro : derrière, c'est derrière.
   Le fondu reste PROGRESSIF, jamais une coupe nette — c'est la coupe qui avait produit le bug
   des « arcs tranchés par le corps de la planète », et depthTest:false reste là pour ça. */
// ⚠️ « EN 2D IL N'Y A PAS DE FACE CACHÉE » — VRAI EN 2026-06, FAUX DEPUIS QUE LE SENS EST EN
// VOLUME. Ce raccourci (`view>=0.5 → return 1`) désactivait toute l'atténuation dans la vue
// devenue principale : les fils de l'arrière du nuage se peignaient par-dessus ceux de devant,
// exactement le défaut que le levier 2 devait corriger. La condition regarde maintenant s'il y a
// un VOLUME (globe ou nuage du sens), pas si `view` vaut 1.
//
// Et la mesure change avec la forme. Sur le globe, les fiches sont toutes sur la coquille : le
// cosinus (diviser par |p|) dit la face. Dans le nuage du sens, elles remplissent une boule —
// un point près du centre a un |p| minuscule, donc un cosinus qui part n'importe où. On mesure
// donc la PROFONDEUR : la projection sur l'axe de la caméra, rapportée au rayon du nuage.
let OCCLUSION = true;                              // débranchable pour mesurer l'avant/après
function versNous(a, mid, b){
  if(!OCCLUSION) return 1;
  // « la carte à plat n'a pas de face cachée » reste vrai — mais en le tranchant par un `if`, on
  // faisait sauter l'opacité de tous les traits au milieu de la bascule. On dose : `aplat` vaut
  // 1 sur la carte de structure posée, 0 dès qu'il y a du volume (globe ou nuage du sens).
  const aplat = view*(1-sem);
  _cd.copy(camera.position).normalize();           // rempli ici : les bulles s'en servent AVANT updateLinks
  const R0 = THREE.MathUtils.lerp(R, SEM, sem);    // 10 sur le globe → 16 dans le nuage
  const f = p => THREE.MathUtils.clamp((p.x*_cd.x+p.y*_cd.y+p.z*_cd.z)/R0, -1, 1);
  // ⚠️ ATTÉNUER, JAMAIS COUPER. `depthTest:false` avait été posé pour un vrai bug — les arcs
  // tranchés net par le corps de la planète. On garde le trait entier et on baisse sa lumière.
  // sur la coquille, c'est le point le plus en arrière qui décide ; dans un volume plein, le
  // retenir effacerait tout fil qui traverse — c'est l'endroit où le trait PASSE qui compte,
  // donc le milieu de l'arc, pondéré. On glisse de l'un à l'autre avec `sem`.
  const coquille = THREE.MathUtils.smoothstep(Math.min(f(a), f(mid), f(b)), -0.15, 0.35);
  const volume   = THREE.MathUtils.smoothstep((f(a)+f(b)+2*f(mid))/4, -0.45, 0.20);
  return THREE.MathUtils.lerp(THREE.MathUtils.lerp(coquille, volume, sem), 1, aplat);
}

function updateLinks(time){
  _cd.copy(camera.position).normalize();
  const flat=view;                               // 0=sphère, 1=plan
  for(const L of linkObjs){
    // un lien n'existe que si ses DEUX fiches sont à l'écran (niveau 2 de la région ouverte)
    const vu = L.a.visible && L.b.visible;
    if(!vu){ L.mat.opacity=0; continue; }
    const a=L.a.position, b=L.b.position;
    const mid=arcEntre(a, b, L.attr, flat);
    // opacité/couleur : éclairé si relié au survol ; sinon discret + effacé sur la face cachée
    const facing = versNous(a, mid, b);
    if(L.hot){ L.mat.opacity=0.92*facing; L.mat.color.copy(colorOf(L.a.userData.data)).lerp(HOT,0.45); }
    // Dans la vue SENS, les liens DÉCLARÉS s'effacent presque : cette vue dit « ces fiches se
    // ressemblent », pas « ces fiches se citent ». Les garder à pleine force, c'est superposer
    // deux réponses à deux questions différentes — et 1386 traits sur 357 points redonnent
    // exactement la pelote qu'on vient d'éliminer ailleurs. Ils restent visibles au survol.
    // ── UNE RÈGLE TRANSVERSE N'EST PLUS UN VOISIN, C'EST UNE ÉTIQUETTE ──
    // Six règles de travail (`type: feedback` citées par 20 fiches ou plus) portaient 215 des
    // 1393 arcs, soit 15 % du nuage gris — `verifier-le-code-jamais-supposer` à lui seul en
    // tire 77. Un point relié à un cinquième du tronc n'apprend plus rien sur son voisinage.
    // Le lien EXISTE toujours (il est dans les données, le panneau le liste, le survol le
    // rallume) : seul son dessin permanent disparaît. La fiche porte une pastille à la place.
    else if(L.regle){ L.mat.opacity=0; }
    // ⚠️ PLUS OPAQUES (l'auteur, 2026-08-14). L'ancien calcul gardait un facteur `(1-0,8×usage)`
    // qui datait de l'époque où l'usage était un interrupteur : depuis qu'il est allumé en
    // permanence, il divisait TOUJOURS les liens déclarés par cinq — 0,028 d'opacité, soit un
    // trait qu'on devine plus qu'on ne le voit. Le facteur disparaît avec l'interrupteur.
    else { L.mat.opacity=0.30*facing*niveau2Global*(1-0.80*sem);
           L.mat.color.copy(LINK_GREY); }
    // ⚠️ UN TRAIT INVISIBLE ÉTAIT QUAND MÊME DESSINÉ. Trois façons d'être invisible cohabitaient
    // — opacité quasi nulle (mode sens : 0,003), règle transverse (0), face arrière atténuée —
    // et aucune n'empêchait le moteur d'envoyer sa géométrie à chaque image. Mesuré à l'écran :
    // ~1400 appels de dessin pour zéro pixel. On éteint l'objet en dessous du seuil de visibilité.
    L.ligne.visible = L.mat.opacity > 0.012;
  }
  // liens d'USAGE (co-activation, Étage 2) : mêmes arcs, dorés, visibles selon `usage`
  for(const C of coactObjs){
    if(!(C.a.visible && C.b.visible) || usage<=0.001){ C.mat.opacity=0; C.ligne.visible=false; continue; }
    const a=C.a.position, b=C.b.position;
    const mid=arcEntre(a, b, C.attr, flat);
    // ⚠️ `× niveau2Global` : c'est ce qui manquait. Les fiches s'effacent progressivement en
    // passant du sens à la structure (leur échelle suit le niveau), mais leurs liens, eux,
    // restaient à pleine opacité jusqu'à l'instant où les deux extrémités devenaient invisibles
    // — puis disparaissaient d'un coup. l'auteur : « on voit les liens apparaître et disparaître ».
    // Un trait doit s'éteindre au même rythme que ce qu'il relie.
    C.mat.opacity = usage*(0.22 + 0.75*C.w)*versNous(a, mid, b)*niveau2Global;
    C.ligne.visible = C.mat.opacity > 0.012;
  }
}

// ---------- chargement ----------
let lastStamp='';
async function poll(){
  try{
    // `?_=Date.now()` forçait le RETÉLÉCHARGEMENT du fichier entier toutes les 3 secondes —
    // 1 Mo à chaque tour, soit 20 Mo par minute, plus l'analyse JSON, pour un fichier qui ne
    // change que quelques fois par jour. `cache:'no-cache'` revalide auprès du serveur : il
    // répond 304 tant que rien n'a bougé, et on ne paie que l'aller-retour.
    const r=await fetch('graph.json', {cache:'no-cache'}); const data=await r.json();
    if(data.generated_at!==lastStamp){
      lastStamp=data.generated_at; semCap = capaciteSemantique(data);
      const before=prevIds.size; build(data);
      const added=data.counts.nodes-before;
      if(before && added>0){ const g=document.getElementById('grow');
        g.textContent=`✦ +${added} note${added>1?'s':''} — the planet is growing`;
        g.style.opacity='1'; setTimeout(()=>g.style.opacity='0',4000); }
    }
  }catch(e){
    // ⚠️ CE CATCH MENTAIT. Il annonçait « graph.json introuvable » quoi qu'il arrive — y compris
    // quand le fichier était là, servi en 200 et valide, et que c'était `build()` qui levait.
    // Un diagnostic faux coûte plus cher que pas de diagnostic : on a cherché du côté du serveur
    // pendant que le bug était dans le code (2026-08-14, une variable supprimée par une refonte).
    const reseau = (e instanceof TypeError) || /fetch|NetworkError|Failed to fetch/i.test(e?.message||'');
    document.getElementById('counts').textContent = reseau
      ? 'graph.json introuvable — lance launch.sh'
      : 'erreur d\'affichage : ' + (e?.message || e) + ' — voir la console';
    console.error('[planet] poll/build failed:', e);
  }
}
poll(); setInterval(poll, 3000);

// PRISE DE CONTRÔLE POUR LE HARNAIS HEADLESS. Tout le reste vit dans la portée du module,
// donc invisible depuis l'extérieur : sans cette poignée, aucun contrôle automatique ne peut
// ouvrir un panneau et LIRE ce qui s'affiche — on en serait réduit à relire le source, ce qui
// ne prouve rien (cf. meta/verifier-le-rendu-final-contre-la-demande). Lecture seule, aucun
// comportement de la page n'en dépend.
window.__planete = { showPanel, entrerRegion, sortirRegion, setMode,
                     get noeuds(){ return nodeObjs; },
                     get regions(){ return regionObjs; },
                     // La CAMÉRA, sans quoi aucun contrôle ne peut dire où une chose se trouve
                     // À L'ÉCRAN — il ne saurait parler que de positions dans la scène, c'est-à-dire
                     // de ce que le code croit dessiner. Ajoutée le 2026-08-16 pour mesurer le
                     // recouvrement des étiquettes de familles, qui n'existe qu'en espace écran.
                     get camera(){ return camera; },
                     get toScreen(){ return toScreen; },
                     get liens(){ return linkObjs; },
                     get niveau(){ return niveau2Global; },
                     get region_ouverte(){ return focusRegion; },
                     // vue courante + capsule : sans ça, un contrôle ne peut rien dire de ce
                     // qui est réellement affiché — il ne saurait que relire le fichier source.
                     get semantique(){ return semCap; },
                     get vue(){ return { view:+view.toFixed(2), sem:+sem.toFixed(2),
                                         mode: view<0.5 ? '3d' : (sem>0.5 ? 'sens' : 'struct') }; },
                     get capsule(){ return { familles:podBlobs.length, vise:podHover, epingle:podPin,
                                             rotation:+podGroup.rotation.y.toFixed(3),
                                             legende: podCap.innerText.trim() }; },
                     region_de: m => regionOf(m.userData ? m.userData.data : m),
                     // le rendu tel qu'il est envoyé au GPU — pas ce que le code croit dessiner
                     get rendu(){ return {
                       appels_de_dessin: renderer.info.render.calls,
                       traits_dessines: linkObjs.filter(L=>L.ligne.visible).length
                                      + coactObjs.filter(C=>C.ligne.visible).length
                                      + regionLinks.filter(L=>L.ligne&&L.ligne.visible).length,
                       traits_en_tout: linkObjs.length + coactObjs.length + regionLinks.length }; },
                     // Ce que le regroupement par famille change, en chiffres. Deux mesures, parce
                     // qu'un regroupement se juge sur ce qu'il APPORTE *et* sur ce qu'il DÉFORME.
                     mesure_sens: (k=8) => {
                       const N = nodeObjs;
                       const pur = (champ) => {
                         let tot=0;
                         for(const m of N){
                           const p=m.userData[champ], r=regionOf(m.userData.data);
                           const d=[];
                           for(const o of N){ if(o===m) continue;
                             d.push([p.distanceToSquared(o.userData[champ]), regionOf(o.userData.data)]); }
                           d.sort((x,y)=>x[0]-y[0]);
                           let bons=0; for(let i=0;i<k && i<d.length;i++) if(d[i][1]===r) bons++;
                           tot += bons/Math.min(k, d.length);
                         }
                         return +(100*tot/N.length).toFixed(1);
                       };
                       // fidélité : les distances entre fiches ont-elles gardé le même ORDRE ?
                       // (corrélation sur un échantillon stable de paires, pas un tirage au sort)
                       const paires=[]; const P=N.length;
                       for(let i=0;i<P;i+=1) for(let j=i+7;j<P;j+=23) paires.push([N[i],N[j]]);
                       const X=paires.map(([a,b])=>a.userData.p2sBrut.distanceTo(b.userData.p2sBrut));
                       const Y=paires.map(([a,b])=>a.userData.p2s.distanceTo(b.userData.p2s));
                       const moy=v=>v.reduce((s,x)=>s+x,0)/v.length;
                       const mx=moy(X), my=moy(Y);
                       let num=0,dx=0,dy=0;
                       for(let i=0;i<X.length;i++){ const a=X[i]-mx,b=Y[i]-my; num+=a*b; dx+=a*a; dy+=b*b; }
                       return { voisins_de_la_meme_famille_sens_pur: pur('p2sBrut'),
                                voisins_de_la_meme_famille_regroupe: pur('p2s'),
                                fidelite_des_distances: +(num/Math.sqrt(dx*dy)).toFixed(3),
                                paires_mesurees: paires.length };
                     },
                     get familles_groupees(){ return SENS_FAMILLES; },
                     // somme des opacités réellement dessinées : l'observable d'une coupure de traits
                     get encre_des_liens(){
                       // on somme l'OPACITÉ, pas « l'opacité si l'objet est allumé » : l'extinction
                       // sous le seuil de visibilité est une optimisation de dessin, pas un saut visuel.
                       const f = t => t.reduce((s,L)=> s + L.mat.opacity, 0);
                       return +(f(linkObjs) + f(coactObjs) + f(regionLinks)).toFixed(2); },
                     // la plus grosse disparition brutale observée depuis la dernière remise à zéro,
                     // en « points à taille pleine ». L'observable d'une coupure, à l'image près.
                     get coupure(){ return +_coupurePic.toFixed(2); },
                     remettre_coupure_a_zero(){ _coupurePic = 0; return true; },
                     get occlusion(){ return OCCLUSION; },
                     set occlusion(v){ OCCLUSION = !!v; },
                     get camera(){ return camera.position.toArray().map(v => +v.toFixed(2)); },
                     get capsule_angles(){ return [+podGroup.rotation.y.toFixed(3), +podGroup.rotation.x.toFixed(3)]; },
                     par_id: id => nodeObjs.find(m => m.userData.data.id === id),
                     // la contrainte de séparation, vérifiable : plus petit espace entre
                     // deux amas voisins. Négatif = ils se touchent, la règle est cassée.
                     separation: () => { let pire = {ecart: Infinity};
                       for(const a of regionObjs) for(const b of regionObjs){
                         if(a===b) continue;
                         const e = a.userData.pos3.distanceTo(b.userData.pos3)
                                 - (a.userData.rad + b.userData.rad)*1.8;
                         if(e < pire.ecart) pire = {ecart:+e.toFixed(2), entre:[a.userData.region, b.userData.region]};
                       } return pire; },
                     // ce qui est RÉELLEMENT à l'écran — la mesure de la saturation, en direct
                     visibles: () => ({
                       fiches: nodeObjs.filter(m => m.visible).length,
                       liens:  linkObjs.filter(L => L.mat.opacity > 0.01).length,
                       regions: regionObjs.filter(b => b.visible && b.userData.blobMat.opacity > 0.01).length,
                       liens_regions: regionLinks.filter(L => L.mat.opacity > 0.01).length })};

// ---------- viewer 3D rejouable (Étage 4) : double-clic sur un nœud média → la capture apparaît, tournable ----------
let vR=null, vS, vCam, vCtrl, vModel=null, vOpen=false;
const vEl=document.getElementById('viewer'), vc=document.getElementById('vc');
function vResize(){ const w=vc.clientWidth||720, h=vc.clientHeight||560; vR.setSize(w,h,false); vCam.aspect=w/h; vCam.updateProjectionMatrix(); }
function openViewer(media){
  vEl.classList.add('show'); vOpen=true;
  if(!vR){                                            // init paresseuse d'un MINI renderer dédié
    vR=new THREE.WebGLRenderer({ canvas:vc, antialias:true, alpha:true }); vR.setPixelRatio(Math.min(devicePixelRatio,1.5));
    vR.toneMapping=THREE.ACESFilmicToneMapping; vR.toneMappingExposure=1.35;
    vS=new THREE.Scene(); vCam=new THREE.PerspectiveCamera(45,1,0.01,100); vCam.position.set(0,0,3.2);
    vCtrl=new OrbitControls(vCam,vc); vCtrl.enableDamping=true; vCtrl.dampingFactor=0.08;
    vCtrl.autoRotate=true; vCtrl.autoRotateSpeed=1.1; vCtrl.enablePan=false;
    // éclairage FORT (Bennu est très sombre, albédo ~4%) : ambiant + hémisphère + 3 lumières dont un rim
    vS.add(new THREE.AmbientLight(0xffffff,1.1));
    vS.add(new THREE.HemisphereLight(0xFFC0A0, 0x2E1300, 1.1));
    const dl=new THREE.DirectionalLight(0xffffff,2.4); dl.position.set(3,4,5); vS.add(dl);
    const dl2=new THREE.DirectionalLight(0xFF9870,1.2); dl2.position.set(-4,-1,-3); vS.add(dl2);
    const rim=new THREE.DirectionalLight(0xFF6F36,1.6); rim.position.set(-2,2,-5); vS.add(rim);
  }
  vResize();
  vEl.querySelector('.vcap').textContent=media.caption||'';
  if(vModel){ vS.remove(vModel); vModel=null; }
  if(media.type==='glb'){
    new GLTFLoader().load(media.src, g=>{
      const model=g.scene;
      // normalise le matériau : modèle scanné → souvent normales manquantes / winding inversé / base sombre.
      // DoubleSide + normales recalculées + texture conservée, éclairé proprement → l'astéroïde devient visible.
      model.traverse(o=>{ if(o.isMesh){
        if(!o.geometry.attributes.normal) o.geometry.computeVertexNormals();
        const map = (o.material && o.material.map) || null;
        o.material = new THREE.MeshStandardMaterial({ color: map?0xffffff:0x9b9286, map, roughness:0.92, metalness:0.02, side:THREE.DoubleSide });
        o.frustumCulled=false;
      }});
      // centre + cadre via un GROUPE (scaler le groupe, jamais setScalar sur la racine du glb → écraserait son échelle)
      const wrap=new THREE.Group(); wrap.add(model);
      const box=new THREE.Box3().setFromObject(model), c=box.getCenter(new THREE.Vector3()), s=box.getSize(new THREE.Vector3());
      model.position.sub(c);
      const md=Math.max(s.x,s.y,s.z)||1; wrap.scale.setScalar(1.8/md);
      vS.add(wrap); vModel=wrap;
    }, undefined, e=>{ vEl.querySelector('.vcap').textContent='⚠ failed to load '+media.src; console.log('GLB ERREUR', e&&e.message); });
  }
  vLoop();
}
function closeViewer(){ vEl.classList.remove('show'); vOpen=false; }
function vLoop(){ if(!vOpen) return; requestAnimationFrame(vLoop); vCtrl.update(); vR.render(vS,vCam); }
vEl.querySelector('.vx').addEventListener('click', closeViewer);
addEventListener('keydown', e=>{ if(e.key==='Escape'&&vOpen) closeViewer(); });
addEventListener('resize', ()=>{ if(vOpen) vResize(); });

// ---------- boucle ----------
const vtag=document.getElementById('viewtag');
const titleEl=document.getElementById('title');
let _last=0, _lastF=0;
function tick(now){
  requestAnimationFrame(tick);
  if(document.hidden) return;                 // PERF : 0 calcul quand l'onglet est caché
  if(vOpen) return;                           // viewer 3D rejouable ouvert → planète en pause (un seul GPU à la fois)
  if(now - _last < 16) return;                // cap ~60 fps (ProMotion 120 → on ne double pas la charge bloom)
  _last = now;
  const time=now/1000;
  const nowSec=Date.now()/1000; let liveCount=0;    // ACTIVITÉ EN DIRECT : recomptée à chaque image
  // ⚠️ MÊME DÉFAUT QUE `focus`, RESTÉ ICI : un `+= écart*0,08` par IMAGE met 0,8 s à 60 im/s et
  // 5 s à 10 im/s. La bascule sens ⇄ structure durait donc « le temps qu'il faut à la machine »,
  // pas le temps qu'on a choisi. Mesuré au banc headless : la vue n'avait pas fini de basculer
  // au bout de 7 secondes. On passe au temps écoulé, comme les niveaux juste en dessous.
  const dtF = Math.min(0.1, (now-_lastF)/1000 || 0.016); _lastF = now;
  const kV = 1-Math.exp(-dtF*7);
  view += (viewTarget-view)*kV; if(Math.abs(viewTarget-view)<0.001) view=viewTarget;
  sem  += (semTarget-sem)*kV;   if(Math.abs(semTarget-sem)<0.001)   sem=semTarget;
  usage += (usageTarget-usage)*kV; if(Math.abs(usageTarget-usage)<0.001) usage=usageTarget;
  // Transition entre les deux niveaux : basée sur le TEMPS ÉCOULÉ, pas sur le nombre d'images.
  // Un `+= écart*0.10` par image met ~0,7 s à 60 im/s… et 3 s à 10 im/s. Mesuré au banc : à
  // 10 im/s la sortie d'une région n'était pas finie au bout de 3 s, et les 170 fiches
  // restaient à l'écran par-dessus les bulles. Sur une machine chargée, ça se verrait pour de
  // vrai. Le plafond sur `dt` évite le saut après un onglet resté caché.
  focus += (focusTarget-focus)*kV;
  if(Math.abs(focusTarget-focus)<0.004) focus=focusTarget;
  // `regionVue` survit à la sortie le temps de l'animation : sans ça, les fiches disparaîtraient
  // d'un coup au lieu de rentrer dans leur bulle, et on perdrait le fil de « d'où ça vient ».
  if(focusRegion) regionVue=focusRegion; else if(focus<0.01) regionVue=null;
  // le mode « sens » montre le nuage sémantique ENTIER : découper par région n'y a pas de sens,
  // c'est justement la vue qui ignore le rangement. On force donc le niveau 2 « tout ».
  // ⚠️ LE SAUT VENAIT D'ICI (l'auteur, 2026-08-14 : « la transition doit se faire de manière
  // harmonieuse, que les points se déplacent et reprennent place, sans coupure d'une page à
  // une autre »). `sem>0.5` et `toutMontrer ? 1 : focus` sont deux MARCHES : à l'instant où
  // `sem` franchissait 0,5, les 366 fiches passaient de « toutes visibles » à « toutes
  // invisibles » en une image, pendant que les amas de famille apparaissaient d'un coup
  // ailleurs. Le déplacement existait déjà (la position interpole de `p2s` vers `p2`) — on ne
  // le voyait jamais, il était coupé en plein vol.
  // Maintenant : une fiche EXISTE tant qu'il reste un soupçon de sens, et sa présence suit la
  // plus haute des deux lectures. Elle voyage donc jusqu'à sa famille, rétrécit en arrivant, et
  // l'amas grossit exactement là où elle se pose.
  const toutMontrer = sem>0.01;
  const niveau2 = Math.max(focus, sem);
  niveau2Global = niveau2;
  const morphing = Math.abs(viewTarget-view)>0.001;
  // Le mode SENS est en volume : il se tourne, comme la 3D. Seule la carte de STRUCTURE reste
  // plate — c'est une carte, on ne tourne pas une carte.
  const enVolume = view<0.5 || sem>0.5;
  controls.autoRotate  = enVolume;
  controls.enableRotate = enVolume;
  controls.minDistance = view>0.5 ? 5 : 16;          // en 2D on peut zoomer plus près dans un cluster
  // on ne recadre la caméra que PENDANT la bascule vers la 2D — ensuite le zoom molette est libre
  // on ne recadre à plat que pour la carte de STRUCTURE ; le sens, lui, garde l'angle où on est.
  // ⚠️ « ON NE VOIT RIEN » (l'auteur, 2026-08-14). Le recadrage ne se déclenchait que si la
  // bascule 3D⇄2D était en cours (`morphing`). Depuis que la page s'ouvre sur le SENS, passer
  // à STRUCTURE ne change plus `view` du tout (1 → 1) : aucun morphing, donc aucun recadrage,
  // et la carte s'affichait sous l'angle et la distance où le nuage du sens avait été laissé —
  // de travers, hors champ. On recadre aussi quand c'est le SENS qui bascule.
  const morphSens = Math.abs(semTarget-sem)>0.001;
  if(viewTarget>0.5 && semTarget<0.5 && (morphing || morphSens)){
    camera.position.lerp(CAM2D, 0.06); controls.target.lerp(ORIGIN, 0.08); }
  else if(viewTarget<0.5 && (morphing || morphSens)){
    // on ne force que la DISTANCE : l'angle où l'on est reste celui qu'on avait, sinon le globe
    // se remet de force face à nous à chaque aller-retour et on perd le fil de ce qu'on regardait.
    const d = camera.position.length(), cible = CAM3D.length();
    if(Math.abs(d-cible) > 0.5) camera.position.multiplyScalar(1 + (cible/d - 1)*0.08);
    controls.target.lerp(ORIGIN, 0.08); }
  controls.update();
  coreMat.opacity=0.55*(1-view); core.visible=false;
  // le globe de verre n'a de sens qu'en 3D : à plat, il n'y a plus de sphère à suggérer.
  // Le globe de verre dit « voici l'ensemble ». Entré dans une région, il n'y a plus d'ensemble
  // à montrer : il s'efface avec le niveau, et l'amas flotte seul.
  const verreK = (1-view)*(1-niveau2Global);
  verre.material.opacity=0.13*verreK; verre.visible=verreK>0.01;
  grille.material.opacity=0.10*verreK; grille.visible=verreK>0.01;
  // ── les bulles de la vue d'ensemble : présentes à l'inverse des fiches ──
  // La face cachée s'efface ici aussi. Sans ça, l'étiquette d'une région située DERRIÈRE le
  // globe se lisait par-dessus une bulle de devant (`depthTest:false` sur les Sprites) : on
  // croyait lire le nom de la bulle qu'on regardait, et c'était celui d'une autre.
  _camDir.copy(camera.position).normalize();
  for(const b of regionObjs){
    const dedans = b.userData.region===regionVue;
    // seuil serré : on n'efface QUE ce qui est réellement derrière. Un premier réglage à
    // (-0.05, 0.30) effaçait aussi tout le pourtour — la moitié des régions disparaissait
    // alors qu'elles étaient bien en face. Vérifié sur capture.
    // même principe : `view<0.5 ? … : 1` faisait sauter l'opacité des amas au milieu de la
    // bascule à plat ⇄ volume. On mélange les deux régimes au lieu de choisir.
    const devant = THREE.MathUtils.lerp(
      THREE.MathUtils.smoothstep(b.userData.dir.dot(_camDir), -0.28, 0.02), 1, view);
    // en vue 2D, les bulles rejoignent l'anneau des régions — sinon elles restaient posées sur
    // une sphère invisible pendant que les fiches, elles, s'aplatissaient : deux mondes à la fois.
    b.position.copy(b.userData.pos3).lerp(b.userData.pos2, view).lerp(b.userData.posSens, sem);
    const k = (1-niveau2)*devant;
    b.visible = k>0.01 || sem>0.01;        // en mode sens, la bulle ne porte plus que son nom
    b.userData.blobMat.visible = k>0.01;
    // la bulle où l'on entre grossit et s'efface — c'est elle qui « s'ouvre » sur ses fiches
    const s = dedans ? THREE.MathUtils.lerp(1, 2.2, niveau2) : 1;
    b.scale.setScalar(THREE.MathUtils.lerp(b.scale.x, s, 0.2));
    // le survol se lit SUR l'amas : points plus gros et plus clairs, rien par-dessus.
    const vise = b.userData.region===hoveredRegion || b.userData.region===(podPin||podHover);
    b.userData.blobMat.opacity = (vise?1:0.9)*k;
    // 0,40 : des grains à peine visibles sur un fond noir (l'auteur : « c'est très peu éclairé »).
    // Le globe des familles est maintenant une des deux vues principales — il doit se lire, pas
    // se deviner. On monte le grain, et la visée reste un cran au-dessus.
    // ⚠️ 0,66 AVEC UN SPRITE NET = UNE MASSE PLEINE (l'auteur : « pourquoi les points sont aussi
    // gras »). Les deux réglages se sont additionnés : j'avais grossi le grain parce que le
    // sprite flou l'éteignait, puis j'ai rendu le sprite net — et les 90 grains d'une famille
    // se sont soudés en une saucisse. Le grain net n'a plus besoin d'être gros pour se voir.
    b.userData.blobMat.size = THREE.MathUtils.lerp(b.userData.blobMat.size, vise?0.62:0.42, 0.25);
    b.userData.blobMat.color.copy(b.userData.colBase).lerp(HOT, vise?0.35:0);
    // Le poids de l'étiquette suit celui de la région : 9 régions à UNE fiche criaient
    // aussi fort que `principes 170`, et neuf étiquettes pour neuf fiches, c'est du bruit.
    // Elles restent lisibles, et reviennent à pleine force dès qu'on les survole.
    const poids = 0.34 + 0.61*Math.sqrt(b.userData.n/Math.max(1,totalNoeuds));
    // ⚠️ DANS LE NUAGE DU SENS, LE NOM RESTE (les grains, eux, s'effacent : les vraies fiches
    // sont là). Sans lui le regroupement par famille est réel — 94 % des huit plus proches
    // voisins d'une fiche sont de sa famille — mais invisible : toute la carte est de la même
    // teinte phosphore, et vingt amas orange côte à côte ne se distinguent pas à l'œil.
    const kLab = Math.max(k, sem*devant);
    b.userData.labMat.opacity = (b.userData.region===(hoveredRegion||podPin||podHover) ? 1 : Math.min(0.95, poids))*kLab;
    // le nom se pose SUR l'amas, pas en orbite : à `radSens` (jusqu'à 14 unités pour la plus
    // grosse famille) l'étiquette partait à 250 px au-dessus de son nuage, vue en capture.
    b.userData.lab.position.y = THREE.MathUtils.lerp(b.userData.rad*1.8,
                                  Math.min(b.userData.radSens*0.85, 4.5), sem) + LABEL_H*0.45;
    b.userData.lab.visible = kLab > 0.01;
  }
  decollerEtiquettes();
  for(const L of regionLinks){
    const k=1-niveau2;
    if(k<=0.01){ L.mat.opacity=0; if(L.ligne) L.ligne.visible=false; continue; }
    const mid=arcEntre(L.a, L.b, L.attr, view);
    // même règle que pour les liens de fiches : derrière, c'est derrière
    L.mat.opacity = k*(0.03 + 0.15*L.poids)*versNous(L.a, mid, L.b);
    if(L.ligne) L.ligne.visible = L.mat.opacity > 0.012;
  }
  magnet();
  const viseFamille = podPin || podHover;       // famille désignée depuis la capsule (ou la légende)
  for(const m of nodeObjs){
    // ── NIVEAU : une fiche n'existe que dans sa région ouverte (ou en mode « sens ») ──
    const dansLaVue = toutMontrer || (regionVue && regionOf(m.userData.data)===regionVue);
    // ⚠️ ON N'ÉTEINT PAS UN POINT, ON LE FAIT DÉCROÎTRE. `m.scale.setScalar(0.001)` d'un coup
    // était la dernière coupure : en ressortant d'une famille, `regionVue` repasse à null dès
    // que le niveau tombe sous 0,01 — mais l'échelle des points, elle, LERPE derrière et vaut
    // encore 0,3 à cet instant. Ils sautaient donc de 0,3 à 0. Mesuré par le contrôle des
    // bascules : 97 % de chute d'un relevé au suivant, sur « famille → ensemble ».
    if(!dansLaVue || niveau2<=0.01){
      const sc = THREE.MathUtils.lerp(m.scale.x, 0, kV);
      m.scale.setScalar(Math.max(sc, 0.0001));
      m.visible = sc > 0.02;                       // only dropped from the draw once fully faded
      continue;
    }
    m.visible = true;
    if(m.userData.hatching){ m.scale.multiplyScalar(1.08); if(m.scale.x>=1){ m.scale.setScalar(1); m.userData.hatching=false; } continue; }
    easeMagnet(m);
    // ── la famille visée dans la capsule s'allume ICI ──
    // C'est tout l'intérêt de garder le globe : il dit le RANGEMENT, l'écran dit le SENS.
    // Viser un projet sur le globe montre où ses 60 fiches ont atterri dans le nuage
    // sémantique — éparpillées ou groupées, c'est la réponse qu'aucune des deux vues ne donne seule.
    // ── couleur du point : base → chaleur → famille visée, dans cet ordre ──
    m.material.color.copy(m.userData.col);
    const ht=m.userData.heat||0;
    if(ht>0.25){                                       // seules les fiches VRAIMENT chaudes respirent (~10, pas 76)
      const b=0.5+0.5*Math.sin(time*(1.1+1.2*ht)+m.userData.pulse);
      m.material.color.lerp(HOT, (0.10+0.30*ht)*b*b*b); // ease : creux étirés, pic franc
    }
    let fam = 1;
    if(viseFamille){
      const dedans = regionOf(m.userData.data)===viseFamille;
      fam = dedans ? 1.9 : 1;
      // On agit sur la COULEUR (multiplication), pas sur la transparence : 366 matériaux
      // transparents obligeraient le moteur à les trier à chaque image.
      // ⚠️ DEUX RÉGLAGES, PAS UN. Premier essai : le reste tombait à 0,20 — un black-out
      // (l'auteur, 2026-08-14 : « pourquoi aussi sombre »). Deuxième : 0,50 et rien de plus côté
      // famille — on ne la retrouvait toujours pas dans le nuage (vérifié en capture). Donc la
      // famille MONTE (plus grosse, teinte chaude) et le reste recule à peine : le contraste
      // vient de ce qu'on cherche, pas de l'extinction de ce qui l'entoure.
      if(dedans) m.material.color.lerp(HOT, 0.55); else m.material.color.multiplyScalar(0.45);
    }
    const ts=((m===hovered)?MAGNET_SCALE:1)*niveau2*fam;
    // même raison que pour les vues : un lerp par IMAGE change de durée avec la machine.
    m.scale.setScalar(THREE.MathUtils.lerp(m.scale.x, ts, 1-Math.exp(-dtF*16)));
    // anneau d'ACTIVITÉ EN DIRECT : pulse vif tant que la fiche est dans la fenêtre, puis s'éteint
    // TOUT SEUL (horloge du navigateur) — pas besoin d'attendre une régénération de graph.json.
    if(m.userData.activeRing){
      const alive = (nowSec - m.userData.activeTs) <= LIVE_WINDOW_S;
      m.userData.activeRing.visible = alive;
      if(alive){ liveCount++; m.userData.activeRing.material.opacity = 0.35 + 0.4*(0.5+0.5*Math.sin(time*2.4)); }
    }
    // glyphe ▷ rejouable (Étage 4) : clignote doucement pour signaler « double-clic = rejouer »
    if(m.userData.playMark) m.userData.playMark.material.opacity = 0.55 + 0.35*(0.5+0.5*Math.sin(time*2.2));
  }
  // ════ INSTRUMENT DE COUPURE ════
  // Ce que l'œil appelle « ça saute » : de la matière VISIBLE qui disparaît d'une image à la
  // suivante. Ça se mesure ici et nulle part ailleurs — un contrôle extérieur échantillonne au
  // mieux toutes les 55 ms, soit trois images : il voit l'avant et l'après, jamais le saut.
  // Vérifié : le contrôle des bascules laissait passer un masquage brutal remis exprès.
  // L'unité est le POINT À TAILLE PLEINE. 0,5 = un demi-point s'est évaporé, personne ne le voit.
  // 18 = l'équivalent de dix-huit points pleins, c'est-à-dire une famille entière qui claque.
  {
    let disparu = 0;
    for(const m of nodeObjs){
      // ⚠️ ON NE COMPTE QUE CE QUI ÉTAIT ENCORE VISIBLE À L'ŒIL. Sans ce seuil, l'instrument
      // additionnait 366 points éteints à 2 % de leur taille et annonçait « 7,4 points
      // disparus » sur un fondu parfaitement propre : une somme de riens n'est pas un défaut.
      // 0,15 = le point occupe encore 15 % de son diamètre, on le voit.
      const ech = m.userData._ech || 0;
      if(m.userData._vu && !m.visible && ech > 0.15) disparu += ech;
      m.userData._vu = m.visible; m.userData._ech = m.scale.x;
    }
    if(disparu > _coupurePic) _coupurePic = disparu;
  }
  if(liveCount!==_liveShown){                       // compteur live : n° de points dont l'anneau est allumé
    _liveShown=liveCount;
    liveEl.innerHTML = liveCount
      ? `◉ ${liveCount} live point${liveCount>1?'s':''} <span style="opacity:.6">— read in the last ${Math.round(LIVE_WINDOW_S/60)} min</span>`
      : `<span class="off">◉ 0 live points — nothing read for ${Math.round(LIVE_WINDOW_S/60)} min</span>`;
    if(!liveCount){ const s=document.getElementById('session'); if(s) s.textContent=''; }  // pas d'activité fantôme
  }
  updateLinks(time);
  // The TITLE follows the view. It was frozen in the HTML on "— MEANING" and never
  // moved: in structure, laid flat, or inside a region, the header still announced
  // meaning. Found on 2026-08-15 by LOOKING at the README captures, not at the code —
  // a wrong label raises nothing, it just gets read.
  // Le libellé du SENS n'est plus écrit ici : il est calculé dans semantic-label.js à partir de
  // ce que l'exporteur a MESURÉ, pour qu'un contrôle puisse le lire sans ouvrir un navigateur.
  const _sensTag = etiquetteSens(semCap);
  const _t = view<0.5 ? (focusRegion ? `[ REGION — ${focusRegion.toUpperCase()} ]` : '[ TRUNK PLANET ]')
                      : (sem>0.5 ? _sensTag.titre : '[ TRUNK MAP — STRUCTURE ]');
  if(titleEl && titleEl.textContent !== _t) titleEl.textContent = _t;   // written only when it changes
  vtag.textContent = view<0.5 ? etiquette3d(semCap, focusRegion)
    : (sem>0.5 ? _sensTag.bandeau
               // The count was frozen at 20 — the author's trunk. Every other trunk read a
               // number that contradicted the panel a few hundred pixels away, which computes
               // it correctly from the same list. Reported 2026-08-16 on a 5-family trunk.
               : `▦ STRUCTURE — the ${REGION_LIST.length} ${REGION_LIST.length > 1 ? 'families' : 'family'}, laid flat · click a family = in volume`);
  syncModeButtons();
  composer.render();                            // rendu via le post-process (bloom + output)
  podTick(dtF);                                 // la capsule tourne au même rythme, sans post-process
}
tick(0);
</script>
  <div id="grille"></div>
