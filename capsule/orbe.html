<!doctype html>
<meta charset="utf-8">
<title>Capsule — orbe</title>
<!--
  LE COMPAGNON DE BUREAU, VERSION ORBE (2026-08-01).

  Remplace le personnage Lottie. Page SÉPARÉE d'index.html à dessein : la
  capsule « boîte » garde sa créature canvas, et le mode libre n'a plus à
  cohabiter avec 1 400 lignes qui ne le concernent pas.

  La coquille réutilisable vit dans `orbe/` — elle ne connaît ni la capsule ni
  le Brain. Le projet d'origine est sur le Bureau (`~/Desktop/Orbe`), avec sa
  démo et ses leçons.
-->
<script>
  // Posé AVANT la feuille de style : sinon la première image montre l'orbe sortie.
  if (location.search.includes('encoche')) document.documentElement.dataset.encoche = '1';
  // ?seule : l'orbe sans ses libellés, pour le panneau de la barre de menus (ilot.html),
  // qui dit lui-même qui travaille et sur quoi.
  if (location.search.includes('seule')) document.documentElement.dataset.seule = '1';
  // ?ilot : l'orbe du panneau de la barre de menus. l'auteur, 24/09 : « l'écriture
  // dans l'orbe + le glow ont disparu » — elle garde le pavé de code. Puis : « supprime
  // l'écriture sous l'orbe, elle est déjà là à gauche » — le nom et la ligne du
  // dessous s'effacent, comme le compteur de fiches.
  if (location.search.includes('ilot')) document.documentElement.dataset.ilot = '1';
</script>
<style>
  html, body { margin:0; height:100%; background:transparent; overflow:hidden;
               -webkit-user-select:none; }
  #scene { position:absolute; inset:0; }
  html[data-seule] #dit, html[data-seule] #fiche, html[data-seule] #pave, html[data-seule] #restant { display:none !important; }
  html[data-ilot] #restant, html[data-ilot] #dit, html[data-ilot] #fiche { display:none !important; }
  /* ⚠ SANS CETTE RÈGLE, le canvas se met en page à sa taille de TAMPON (300 px
     sur un écran retina) dans une fenêtre de 150 : l'orbe déborde en bas à
     droite et tout le reste — pavé, pastille, qui sont centrés sur la FENÊTRE —
     paraît décalé sur le côté. Le rendu ne plante pas, il se décentre.
     Elle a été effacée une fois par une suppression de bloc qui a mordu au-delà
     de sa cible ; le défaut n'était visible que sur le vrai bureau. */
  canvas { width:100%; height:100%; display:block; }

  /* ⚠ PAS DE SOUFFLE EN CSS. Tenté puis MESURÉ, puis retiré : une animation
     CSS sur une fenêtre transparente toujours-au-dessus force WindowServer à
     recomposer à la cadence de l'écran, même si le rendu WebGL, lui, dort.
     Coût relevé au repos : 17 % de CPU contre 2,2 %. « Le compositeur, c'est
     gratuit » est vrai dans une page web ordinaire, faux pour un HUD posé sur
     le bureau. On paie donc la fluidité du repos en CADENCE DE RENDU, ce qui
     est mesurable et borné. Cf. [[electron-hud-backgroundthrottling-saccade]]. */

  /* ── LE LIBELLÉ, GRAVÉ DANS LE VERRE ─────────────────────────────────────
     ⚠ TROIS TENTATIVES. Les deux premières ratées pour la même raison de fond :
       elles cherchaient à rendre le texte lisible CONTRE le bureau, au lieu de
       le faire appartenir à l'orbe.
       1. Pilule noire → un composant d'interface collé sur un objet qui n'en
          est pas un.
       2. Texte clair à halo sombre → l'air gravé, mais gravé dans le BUREAU. Le
          halo détoure chaque lettre : incrustation de jeu vidéo, et ça salit
          tout ce qui passe derrière.
       3. Mélange `screen` → le texte entrait bien dans la matière… et
          DISPARAISSAIT sur un bureau clair. `screen` ne peut qu'éclaircir : sur
          du blanc il n'a plus rien à ajouter. Mesuré sur la planche à trois
          fonds, invisible sur le clair.
     Ce qui marche : le poser SUR la sphère — pas sous elle, pas devant le
     bureau — dans le bas, la zone que l'éclairage laisse la plus sombre, et
     n'employer qu'une ombre PORTÉE VERS LE BAS. Une ombre directionnelle se lit
     comme du relief ; un contour se lit comme un détourage. C'est la seule
     différence entre « gravé » et « collé ». */
  /* ── LE LIBELLÉ, POSÉ DANS L'OMBRE DE L'ORBE ──────────────────────────────
     ⚠ QUATRIÈME PLACEMENT, et les trois précédents ont chacun échoué pour une
       raison différente — c'est la trace qui compte :
       1. pilule noire sous l'orbe → un composant d'interface collé sur l'objet ;
       2. halo sombre sous l'orbe → détourage « incrustation de jeu », sale dès
          qu'il croise du texte de bureau ;
       3. SUR la sphère → il appartenait enfin à l'objet… mais le mesh change de
          forme ET de clarté à chaque mécanique. Sur `committing`, dont le bas
          est bosselé et brillant, la moitié des lettres se faisait manger. On
          ne pose pas un texte fixe sur une surface qui bouge.
     Ce qui tient : le libellé retourne SOUS l'orbe — là, la géométrie est
     stable quelle que soit la mécanique — mais il n'y flotte pas seul : il est
     posé dans l'OMBRE PORTÉE de la sphère. L'ombre appartient à la scène, pas à
     une interface ; elle épouse l'objet, elle ne le détoure pas. Et elle donne
     le contraste que le texte ne peut pas se donner à lui-même, sur un bureau
     clair comme sur un bureau sombre. */
  /* ⚠ 2026-09-20 — OPAQUE, PLUS DE .95 (L'utilisateur : « tout ce qui a écris sous les
     orbs doit etre opaque »). Le blanc à 95 % laissait passer le bureau entre
     les lettres : sur un fond d'écran clair, le libellé virait au gris sale.
     Un texte posé sur une scène qu'on ne maîtrise pas se donne son opacité,
     il ne l'emprunte pas au fond. */
  /* 2026-09-20 — DESCENDU DE 2 pt (L'utilisateur : « baisse tres legerement l'ecriture
     sous l'orbe desfois l'orbe passe dessus »). Sur les mécaniques les plus
     gonflées — `synthesizing`, `challenging` — le bas du verre et sa lueur
     descendaient jusqu'à toucher le haut des capitales. Mesuré sur le tournage
     du 20/09 : le verre atteint y=265 px là où les capitales commencent à
     y=254. Les deux lignes descendent ensemble pour garder leur écart. */
  #dit { position:absolute; left:50%; bottom:12.5px; transform:translateX(-50%);
         white-space:nowrap; color:#fff;
         /* 2026-08-08 — +1,5 px sur les deux lignes à la demande de l'auteur. Le
            libellé monte AUSSI : ne grossir que la ligne du dessous inverserait
            la hiérarchie que la casse est seule à porter. */
         font:600 9px/1.2 ui-sans-serif,-apple-system,sans-serif;
         letter-spacing:1.4px; text-indent:1.4px;
         /* 2026-09-20 — LE NOM EST RECENTRÉ, PAS LA LIGNE (L'utilisateur : « décale les
            noms un peu vers la droite pour les recentrer avec le reste »). Les
            trois points comptent dans la largeur du bloc : centrer le bloc
            poussait le NOM de 8 px vers la gauche, mesuré sur le tournage —
            centre du mot à 133,5 px quand la ligne du dessous est à 149,5. Une
            marge à gauche égale à la largeur des points remet le mot au milieu,
            d'aplomb avec la petite ligne et avec l'orbe. */
         padding-left:16px;
         /* ⚠ L'OMBRE PORTÉE A ÉTÉ RETIRÉE (2026-08-04, demande de l'auteur :
            « supprime l'ombre noire sous les WORKING / SYNTHESIZING »).
            C'était une ellipse sombre de 126 px posée derrière le libellé pour
            lui donner du contraste sur n'importe quel bureau. Elle tenait ce
            rôle, mais elle pose une tache noire sous une orbe devenue
            franchement transparente — les deux ne vont plus ensemble : depuis
            le verre traversant, le seul morceau opaque de l'objet était son
            ombre.
            Le contraste repose donc entièrement sur les lettres elles-mêmes :
            une ombre portée COURTE et une lueur sombre très serrée, qui
            épousent la forme des glyphes au lieu de dessiner une zone. C'est
            la même distinction que pour le pavé — une ombre, jamais un
            contour, jamais un fond. */
         text-shadow:0 1px 1.5px rgba(4,7,12,.85),
                     0 0 2.5px rgba(4,7,12,.55);
         opacity:0; transition:opacity .28s ease; pointer-events:none; }
  #dit.vu { opacity:1; }

  /* ── SUR QUOI ────────────────────────────────────────────────────────────
     Le libellé dit ce que la machine FAIT ; il ne dit pas sur QUOI. « FILING »
     pendant deux minutes ne donne aucun repère : on ne sait pas si le travail
     avance ni s'il porte sur ce qu'on croit. Cette seconde ligne nomme la
     fiche — ou le fichier — réellement en cours.
     ⚠ Elle est en casse normale, sans interlettrage : c'est un TITRE, pas une
       étiquette. Si les deux lignes avaient la même graisse et les mêmes
       majuscules, on lirait un bloc de deux libellés et le repère se perdrait.
       La hiérarchie se fait ici par la casse et la clarté, pas par la taille —
       la taille reste toutefois plancher, voir ci-dessous.
     ⚠ 146 px de large maximum, coupé par des points de suspension : un slug de
       fiche fait couramment 60 caractères, et la fenêtre en fait 150.
     ⚠ 2026-08-08 — « on ne distingue pas l'écriture sous le WORKING » (l'auteur,
       capture du vrai bureau). Trois causes cumulées, toutes corrigées ici :
         · 6 px en graisse 500 : trop peu de matière par glyphe une fois
           l'anticrénelage passé ;
         · aucune séparation d'avec le fond — le texte du bureau traverse
           ENTRE les lettres et brouille le mot. Le libellé du dessus y échappe
           par ses capitales et son interlettrage, pas par sa taille ;
         · collée à 2 px du bord bas, la ligne tombait pile dans la ligne de
           texte du bureau qui suit.
       Réponse : 7 px / 600, et un halo sombre à plusieurs couches SERRÉ sur les
       glyphes. La hiérarchie tient toujours — capitales + interlettrage en
       haut, casse normale en bas — donc 7 px ne fait pas des deux lignes un
       bloc de deux libellés. */
  /* ── PASTILLE « RESTE À TRAITER » (2026-08-14, demande de l'auteur) ────────────
     Combien de fiches attendent encore le jardinier. La source de vérité est
     la file state/a-classer.md — celle que `on_fiche_write.py` alimente tout seul.
     Posée en HAUT À DROITE : le bas de la fenêtre est déjà pris par le libellé
     et la ligne de fiche, et le centre par le pavé.
     Pas d'ombre portée en ellipse (retirée en 2026-08-04) : on tient le
     contraste par un aplat opaque + un liseré, comme un badge d'application. */
  /* 2026-08-14 — RAPPROCHÉ DE L'ORBE (L'utilisateur : « rapproche »). Collé au coin de
     la fenêtre, le compteur flottait tout seul dans le vide du bureau et ne se
     rattachait visuellement à rien. Posé au bord de la sphère, il se lit comme
     une étiquette DE l'orbe, pas comme un élément du bureau. */
  #restant { position:absolute; top:27px; right:23px; display:none;
             color:rgba(255,255,255,.95); letter-spacing:.6px;
             font:700 9px/1.2 ui-sans-serif,-apple-system,sans-serif;
             /* Même traitement que #fiche : pas d'aplat ni de pastille (l'auteur,
                2026-08-14 : « pas de pastille plutôt un 1/4 »). Le contraste
                tient par trois couches d'ombre — deux serrées qui éteignent le
                fond entre les lettres, une large et faible qui décolle le mot
                du bureau sans dessiner de zone. */
             text-shadow:0 0 1px rgba(0,0,0,.9), 0 0 2px rgba(0,0,0,.75),
                         0 0 7px rgba(0,0,0,.45); }
  #restant .tot { opacity:.62; font-weight:600; }
  #restant.vu { display:block; }
  #fiche { position:absolute; left:50%; bottom:2px; transform:translateX(-50%);
           max-width:146px; overflow:hidden; text-overflow:ellipsis;
           white-space:nowrap; text-align:center;
           color:#fff; letter-spacing:.1px;
           font:600 8.5px/1.2 ui-sans-serif,-apple-system,sans-serif;
           /* ⚠ Ombre PLUS APPUYÉE que celle du libellé, à l'inverse de ce que
              la hiérarchie laisserait croire : cette ligne est plus fine et
              plus longue, donc elle a moins de matière pour se détacher. Vue
              sur planche à fond clair, la version douce se noyait dans le
              texte de bureau derrière. Le rang se lit à la casse, pas à la
              faiblesse du contraste.
              Les deux couches serrées (1 px et 2 px) éteignent le fond entre
              les lettres ; la troisième, large et faible, décolle le mot du
              bureau sans dessiner de zone — une ombre, jamais un contour. */
           text-shadow:0 1px 1.5px rgba(4,7,12,1),
                       0 0 2px rgba(4,7,12,1),
                       0 0 5px rgba(4,7,12,.8);
           opacity:0; transition:opacity .28s ease; pointer-events:none; }
  #fiche.vu { opacity:1; }
  /* Les trois points disent que ça CONTINUE — une passe d'agent dure des
     minutes pendant lesquelles le libellé, lui, ne change jamais. */
  /* ⚠ 2026-09-20 — LES POINTS NE CLIGNOTENT PLUS EN TRANSPARENCE. Ils disaient
     « ça continue » en descendant à 25 % d'opacité ; c'est exactement ce que
     l'auteur a refusé (« doit etre opaque »). Le même message passe par le
     MOUVEMENT : trois points pleins qui sautent l'un après l'autre, comme
     l'indicateur de frappe de Messages. Rien ne devient translucide, et la
     continuité reste lisible. */
  #dit .pt { display:inline-block; opacity:1;
             animation:pt 1.35s ease-in-out infinite; }
  #dit .pt:nth-child(2) { animation-delay:.18s; }
  #dit .pt:nth-child(3) { animation-delay:.36s; }
  @keyframes pt { 0%,70%,100% { transform:translateY(0) }
                  35%         { transform:translateY(-1.2px) } }
  @media (prefers-reduced-motion: reduce) { #dit .pt { animation:none; transform:none } }

  /* ── LE NOM DU VAISSEAU BRILLE ────────────────────────────────────────────
     Demande de l'auteur le 2026-09-20 : « le nom des agents doit briller avec cet
     effet autour des lettres », avec en référence la bibliothèque `metal-fx`
     (preset « chromatic »). Capture du rendu réel regardée avant d'écrire :
     un liseré d'UN pixel qui court autour de la forme, et sur ce liseré la
     couleur se sépare en rose, vert et cyan — l'intérieur, lui, ne change pas.
     Ce que fait leur shader : une aberration chromatique (les canaux rouge et
     bleu décalés de part et d'autre) sur une teinte bleu froid #88ccff.
     Ici pas de WebGL pour trois mots de 9 px : les mêmes fanges sont posées
     en ombres portées colorées, décalées d'un demi-pixel de chaque côté, et
     l'angle de ce décalage TOURNE en 5 s — c'est ce lent voyage qui fait lire
     « métal » plutôt que « texte mal imprimé ».
     ⚠ Ne s'applique qu'au NOM : les points et la ligne du dessous restent nets.
     Les deux couches sombres sont en FIN de pile, donc sous les couleurs : le
     contraste sur bureau clair reste tenu sans éteindre les franges. */
  #dit .nom.brille {
    text-shadow:
      .55px 0 .6px rgba(255,110,165,.9), -.55px 0 .6px rgba(110,225,255,.92),
      0 .55px .9px rgba(150,255,195,.5),  0 0 1.5px rgba(255,255,255,.62),
      0 0 4px rgba(136,204,255,.82),       0 0 10px rgba(136,204,255,.46),
      0 1px 1.5px rgba(4,7,12,.9),        0 0 2.5px rgba(4,7,12,.6);
    animation:chrome 5s linear infinite; }
  @keyframes chrome {
    0%,100% { text-shadow:
      .55px 0 .6px rgba(255,110,165,.9), -.55px 0 .6px rgba(110,225,255,.92),
      0 .55px .9px rgba(150,255,195,.5),  0 0 1.5px rgba(255,255,255,.62),
      0 0 4px rgba(136,204,255,.82),       0 0 10px rgba(136,204,255,.46),
      0 1px 1.5px rgba(4,7,12,.9),        0 0 2.5px rgba(4,7,12,.6); }
    33% { text-shadow:
      -.28px .48px .6px rgba(255,110,165,.9), .28px -.48px .6px rgba(110,225,255,.92),
      -.48px -.28px .9px rgba(150,255,195,.5), 0 0 1.5px rgba(255,255,255,.75),
      0 0 5px rgba(136,204,255,.95),           0 0 11px rgba(136,204,255,.56),
      0 1px 1.5px rgba(4,7,12,.9),             0 0 2.5px rgba(4,7,12,.6); }
    66% { text-shadow:
      -.28px -.48px .6px rgba(255,110,165,.9), .28px .48px .6px rgba(110,225,255,.92),
      .48px .28px .9px rgba(150,255,195,.5),   0 0 1.5px rgba(255,255,255,.62),
      0 0 4px rgba(136,204,255,.82),            0 0 10px rgba(136,204,255,.46),
      0 1px 1.5px rgba(4,7,12,.9),             0 0 2.5px rgba(4,7,12,.6); } }
  @media (prefers-reduced-motion: reduce) { #dit .nom.brille { animation:none } }

  /* ── LE PAVÉ — les lignes réellement écrites, DANS l'orbe ──────────────────
     Reprise du `drawCodeBg` de l'ancienne capsule, avec les deux corrections
     que son propre commentaire réclamait :
       · là-bas il défilait un fichier d'agent FIGÉ ; ici ce sont les vraies
         lignes en train d'être écrites (le flux de diffs de la session) ;
       · là-bas il était COUPÉ en mode libre — « sur le bureau c'est un pavé qui
         recouvre ce que l'utilisateur lit ». Enfermé dans le disque de l'orbe,
         l'objection tombe : il ne déborde plus sur rien.
     Il est POSÉ SUR le rendu, pas dedans : le shader du moteur `orbe/` est
     partagé avec le projet du Bureau, et un pavé de texte n'a rien à y faire.
     Le `screen` + le masque radial font le reste — la lumière du texte se mêle
     à celle de la matière, et s'éteint sur les bords comme sur une sphère. */
  /* ⚠ DEUX FOIS TROP LARGE, DEUX FOIS. 124 px d'abord, puis 96 — et 96 débordait
     encore. La faute était de viser une largeur MOYENNE : le mesh n'a pas la
     même largeur selon la mécanique. Relevé au banc, cinq états : 103 px pour
     `synthesizing`… mais 84 pour `challenging` et 85 pour `committing`. Un
     pavé se dimensionne sur le PLUS ÉTROIT, sinon il bave sur le bureau dans
     les états les plus fins — et c'est là qu'on le remarque, parce que le texte
     vert flotte alors dans le vide. 78 px laisse la marge du dégradé. */
  /* ⚠ `mix-blend-mode:screen` RETIRÉ (2026-08-04), retour de l'auteur « l'écriture
     en arrière-plan n'est pas assez claire ». `screen` ne peut qu'ÉCLAIRCIR :
     sur les crêtes claires de la matière il n'avait presque plus rien à
     ajouter, et le verre étant désormais traversant, le texte se retrouve
     par endroits directement sur le bureau — blanc compris, où `screen` ne
     donne rien du tout. Le gain d'opacité qui compensait (`.88`) ne pouvait pas
     rattraper ça : le mode de fusion était le problème.
     Il est donc peint NORMALEMENT, et c'est une ombre — pas un contour — qui
     lui donne son contraste : elle épouse les lettres et tient aussi bien sur
     un bureau blanc que sombre. Même principe que le libellé. */
  #pave { position:absolute; left:50%; top:50%; width:78px; height:78px;
          transform:translate(-50%,-50%); border-radius:50%; overflow:hidden;
          opacity:0; transition:opacity .5s ease; pointer-events:none;
          /* le texte s'éteint vers le bord : sans ça il se coupe net sur le
             cercle et le pavé se lit comme un autocollant, pas comme un dedans */
          -webkit-mask-image:radial-gradient(circle at 50% 46%,
                             #000 22%, rgba(0,0,0,.68) 46%, transparent 66%); }
  #pave.vu { opacity:1; }
  /* ── LA COURBURE ──────────────────────────────────────────────────────────
     Les lignes ne sont plus empilées : chacune est POSÉE sur une latitude de la
     sphère. Deux effets, et c'est le second qui compte pour l'utilisateur :
       · elle se resserre horizontalement en s'éloignant de l'équateur (la corde
         d'un cercle), ce qui donne le volume ;
       · les latitudes se TASSENT vers les pôles, donc il tient nettement plus
         de lignes dans la même hauteur qu'avec un empilement régulier.
     Chaque ligne est placée en absolu et transformée : le rouleau, lui, ne
     bouge plus du tout. */
  /* ⚠ 5,5 px sur 26 fentes : à l'équateur les latitudes ne sont espacées que de
     ~4,5 px, donc les lignes se CHEVAUCHAIENT. Un texte qui se marche dessus se
     lit comme une texture, pas comme du code. 6 px sur 18 fentes → ~6,4 px
     d'écart : moins de lignes, mais chacune se lit. */
  #pave .rouleau { position:absolute; inset:0;
                   font:600 6px/7.6px ui-monospace,SFMono-Regular,Menlo,monospace;
                   white-space:pre; letter-spacing:-.05px; }
  /* ⚠ L'ÉCRITURE EST TOUJOURS VERTE, jamais teintée par la famille. Le pavé ne
     dit pas QUI travaille — la couleur du corps et la pastille s'en chargent
     déjà. Lui dit qu'il s'écrit du code, et le vert de terminal le dit d'un
     coup d'œil sur n'importe quel fond. Une teinte qui change avec l'agent
     ajouterait un troisième signal de couleur pour zéro information. */
  #pave .l { position:absolute; left:0; width:100%; text-align:center;
             color:#6dfaa2; opacity:.92;
             /* l'ombre fait le contraste, pas un contour : un halo sombre serré
                + une retombée d'un pixel. Lisible sur bureau blanc comme sur
                bureau sombre, sans détourer les lettres. */
             text-shadow:0 0 1.5px rgba(0,22,12,.95), 0 0 4px rgba(0,30,16,.6),
                         0 1px 1px rgba(0,0,0,.55);
             will-change:transform; overflow:hidden; text-overflow:clip; }
  /* On reste dans le vert : seule la LUMINOSITÉ distingue ajouté, retiré et
     en-tête. Du rouge franc se battrait avec la teinte de l'orbe. */
  #pave .l.plus  { color:#9dffc4; opacity:1; }
  #pave .l.moins { color:#4fae76; opacity:.72; }
  #pave .l.tete  { color:#e6fff1; opacity:1; }
  @media (prefers-reduced-motion: reduce) { #pave .rouleau { transition:none } }


  /* ── L'ORBE DANS L'ENCOCHE ─────────────────────────────────────────────────
     l'auteur, 24/09 : « il doit apparaître dans l'encoche et y rester jusqu'à la
     fin », « comme une notif qui apparaît ». L'encoche est un TROU dans la dalle :
     aucun pixel ne s'y affiche. Être « dans l'encoche », c'est donc que
     l'ENCOCHE GRANDIT : un noir exactement de sa largeur (pas une aile de plus,
     L'utilisateur : « sans espace supplémentaire sur les côtés ») descend sous elle et
     porte l'orbe, à sa taille réelle. Au repos ce noir a la hauteur de l'encoche
     et se confond avec elle : il n'y a rien à voir.
     `#bloc` porte TOUT le dessin de l'orbe du bureau (orbe, nom, ligne, pavé),
     inchangé ; seul le bloc voyage. `--decal` et `--barre` viennent de main.js. */
  html[data-encoche]:not([data-pret]) body > * { visibility:hidden; }
  /* ⚠ LE CADRE DOIT LAISSER RESPIRER LE TEXTE. Première version : le noir
     s'arrêtait au ras de la ligne du dessous — l'auteur, 24/09 : « working frôle le
     bord bas ». 10 px sous la dernière ligne, pas un de plus : « un meilleur
     cadre qui reste petit ». Puis, même jour : « que l'encoche fasse un carré ».
     La largeur ne peut pas bouger (179 pt, celle du trou, mesurée : plus
     étroit, le trou dépasserait) : c'est la HAUTEUR qui descend. Le cadre sorti
     fait `--haut` (158 pt depuis le haut de l'écran) et l'orbe `--echelle`
     (0,9 — L'utilisateur : « la nouvelle taille de l'orb est bonne garde la »). ⚠ Ce que l'auteur voit n'est pas ce que la capture voit : sur la vraie
     dalle, le noir du cadre se soude au trou ET au bord noir au-dessus de
     l'écran, et paraît plus haut qu'il ne l'est en pixels. Son œil tranche.
     L'ANIMATION, dans l'ordre (L'utilisateur : « une bien meilleure animation ») :
       sortie  — le cadre s'ouvre sur un RESSORT (un léger dépassement puis
                 retour, comme l'îlot de l'iPhone), l'orbe se dessine dedans en
                 sortant d'un flou, puis le texte monte de 6 px ;
       rentrée — l'inverse, plus vite : le texte part, l'orbe se referme dans le
                 flou, le cadre remonte sans rebond.
     Les ressorts sont de vraies courbes physiques, calculées dans le script et
     posées en `linear()` (--ressort-*), pas des courbes de Bézier à l'œil. */
  #ile { display:none; }
  html[data-encoche] #ile { display:block; position:absolute; top:0; left:0; right:0;
    height:var(--barre, 33px); background:#000; border-radius:0 0 12px 12px;
    transition:height .42s var(--ressort-rentree, ease) .16s, border-radius .42s ease .16s; }
  /* Le rayon suit l'échelle (30 pt à 0,9) : réduit d'un tiers, le cadre garde sa forme. */
  html[data-encoche][data-sortie] #ile { height:var(--haut, 116px);
    border-radius:0 0 calc(33.3px * var(--echelle, .6)) calc(33.3px * var(--echelle, .6));
    transition:height .72s var(--ressort-sortie, ease), border-radius .5s ease; }
  /* L'encre de l'orbe commence à 27,5 pt dans sa boîte : on la pose 5 pt sous
     le bas de l'encoche, à l'échelle `--echelle`. l'auteur, 24/09 soir : « remonte
     légèrement l'orb mais très légèrement » → 2 pt au lieu de 5 (le texte
     retrouve ses 10 pt de marge au-dessus du bas du cadre). */
  html[data-encoche] #bloc { position:absolute; left:50%;
    top:calc(var(--barre, 33px) + 2px - 27.5px * var(--echelle, .6));
    width:150px; height:150px; margin-left:-75px;
    transform:scale(.5); transform-origin:50% 0; opacity:0; filter:blur(10px);
    transition:transform .26s cubic-bezier(.5,0,.9,.4), opacity .2s ease .04s, filter .22s ease; }
  html[data-encoche][data-sortie] #bloc { transform:scale(var(--echelle, .6)); opacity:1; filter:none;
    transition:transform .8s var(--ressort-sortie, ease) .1s, opacity .3s ease .1s, filter .42s ease .1s; }
  html[data-encoche] #dit, html[data-encoche] #fiche { translate:0 6px;
    transition:opacity .12s ease, translate .12s ease; }
  html[data-encoche][data-sortie] #dit, html[data-encoche][data-sortie] #fiche { translate:0 0;
    transition:opacity .35s ease .34s, translate .5s var(--ressort-sortie, ease) .34s; }
  html[data-encoche]:not([data-sortie]) #dit, html[data-encoche]:not([data-sortie]) #fiche { opacity:0; }
  @media (prefers-reduced-motion: reduce) {
    html[data-encoche] #ile, html[data-encoche] #bloc, html[data-encoche] #dit,
    html[data-encoche] #fiche { transition:opacity .2s ease !important; filter:none !important; } }

<script type="module">
const { ipcRenderer } = require('electron');
const fs = require('fs'), os = require('os'), path = require('path');

const THREE    = await import('./orbe/vendor/three.module.js');
const { creerOrbe } = await import('./orbe/orbe.js');
const { reglage }   = await import('./orbe/palettes.js');

const STATUT = path.join(os.homedir(), '.c-brain', 'trunk', 'state', 'status.json');
const snoise = await fetch('./orbe/snoise.glsl').then(r => r.text());

const REDUIT = window.matchMedia &&
               window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const depart = reglage('idle');
const orbe = creerOrbe(document.getElementById('c'), depart.meca, snoise, depart);
let cible = depart, vu = true;
// Exposé pour le banc de vérification : on regarde le rendu de CETTE page,
// pas d'une démo dont la mise en page rétrécit l'orbe à 69 px.
window.__orbe = orbe;

/* ── LE DOSAGE DU VERRE ─────────────────────────────────────────────────────
   0 = matière pleine · 1 = verre franc. Choisi à 0,55 sur planche comparative,
   les trois valeurs posées sur un même faux bureau (`/tmp/orbe/cmp.png`).
   ⚠ 0,55 ÉTAIT UN COMPROMIS IMPOSÉ PAR L'ANCIEN MODÈLE. Là-bas, monter le
     verre baissait l'opacité de TOUT le corps : la teinte de la famille se
     diluait avec, et à 1,0 Inspection et Transformation redevenaient deux
     bulles incolores sur un fond bleu-violet.
     Le modèle d'ABSORPTION (2026-08-04) déplace la couleur sur la TRANCHE :
     le cœur peut être franchement vide sans que la famille s'efface, puisque
     ce n'est plus la surface pleine qui la porte. Le compromis tombe → 1,0.
     La contrainte physique, elle, ne tombe pas : sur un bureau violet, la
     famille violette sera toujours la plus faible. C'est la mécanique et la
     pastille qui la rattrapent. */
orbe.setVerre(1.0);

/* ── CADENCE : on paie la fluidité là où elle se voit ───────────────────────
   Mesuré, orbe de 150 px : 60 i/s ≈ 12 %, 12 i/s ≈ 5,4 %, 2 i/s ≈ 0,6 %. Un
   compagnon permanent ne peut pas tenir 12 % à vie.
   ⚠ REPOS À 12, PAS À 4. À 4 i/s il y a 250 ms entre deux images, et la
     respiration du repos y avançait par crans visibles. Le repos est de loin
     l'état le plus longtemps affiché ; il mérite ses quelques points de CPU
     plutôt que de donner l'impression d'un objet cassé.
   Un fondu de mécanique tourne à 60 — en dessous, le morphing avance par crans
   et se lit comme une saccade. */
/* ── SORTIR / RENTRER (mode encoche seulement) ──────────────────────────────
   La sortie suit l'état DÉJÀ lu pour l'orbe (garde de fraîcheur comprise) :
   aucun second avis sur « est-ce qu'on travaille ». La rentrée attend 4 s, sinon
   l'orbe ferait l'aller-retour entre deux appels d'outils d'un même travail.
   Rentrée, elle ne peint presque plus (cadence 1). */
const ENCOCHE = document.documentElement.dataset.encoche === '1';
let rentree = ENCOCHE, force = false, attenteRentree = null;
function sortir(v) {
  if (v) {
    clearTimeout(attenteRentree); attenteRentree = null;
    if (!rentree) return;
    rentree = false; document.documentElement.dataset.sortie = '1'; majCadence();
  } else if (!rentree && !attenteRentree) {
    attenteRentree = setTimeout(() => {
      attenteRentree = null; rentree = true;
      delete document.documentElement.dataset.sortie;
      setTimeout(majCadence, 700);       // laisser l'orbe finir sa rentrée à pleine cadence
    }, force ? 0 : 4000);
  }
}
// Pour le banc : forcer la sortie ou la rentrée sans attendre un vrai travail.
window.__sortir = (v) => { force = true; sortir(v); };
/* Un ressort amorti, échantillonné en courbe `linear()` : x(t) pour une masse
   unité, raideur k, amortissement c, sur la durée donnée. Au-delà de la durée
   la courbe est à 1 : la durée CSS doit couvrir le temps de pose du ressort. */
function ressort(k, c, duree) {
  const w0 = Math.sqrt(k), z = c / (2 * w0), pts = [];
  for (let i = 0; i <= 48; i++) {
    const t = duree * i / 48;
    let x;
    if (z < 1) { const wd = w0 * Math.sqrt(1 - z * z);
      x = 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
    else x = 1 - Math.exp(-w0 * t) * (1 + w0 * t);
    pts.push((i === 48 ? 1 : x).toFixed(4));
  }
  return 'linear(' + pts.join(',') + ')';
}
if (ENCOCHE) {
  const st = document.documentElement.style;
  st.setProperty('--ressort-sortie',  ressort(260, 20, 0.72));   // ~8 % de dépassement
  st.setProperty('--ressort-rentree', ressort(400, 40, 0.42));   // amorti critique : pas de rebond
  require('electron').ipcRenderer.on('cap-encoche', (_e, g) => {
    document.documentElement.style.setProperty('--decal', g.decal + 'px');
    document.documentElement.style.setProperty('--barre', g.barre + 'px');
    document.documentElement.style.setProperty('--haut', g.haut + 'px');
    document.documentElement.style.setProperty('--echelle', g.echelle);
  });
  // Tout le dessin de l'orbe du bureau passe dans un seul bloc, qui voyage.
  const bloc = document.createElement('div'); bloc.id = 'bloc';
  ['scene', 'dit', 'fiche', 'pave', 'restant'].forEach((id) => bloc.appendChild(document.getElementById(id)));
  document.body.appendChild(bloc);
  document.documentElement.dataset.pret = '1';
}

// Tournage (CAPSULE_TOURNAGE=1) : 60 partout. l'auteur, 24/09 : la vidéo « saccade à
// certains moments, à d'autres c'est lisse » — c'était l'orbe qui passait de 30
// (travail) à 60 (transition) : une cadence qui change se voit à l'image.
const CADENCE = (typeof process !== 'undefined' && process.env.CAPSULE_TOURNAGE === '1')
  ? { repos: 60, travail: 60, transition: 60 } : { repos: 12, travail: 30, transition: 60 };
let occupe = false;
function majCadence() {
  if (!vu || document.hidden || rentree) return orbe.setCadence(1);
  if (orbe.enTransition()) return orbe.setCadence(CADENCE.transition);
  orbe.setCadence(occupe ? CADENCE.travail : CADENCE.repos);
}
setInterval(majCadence, 200);

/* Les couleurs voyagent en continu ; la mécanique se fond en 1,4 s.
   ⚠ filet anti-NaN : une valeur non finie contaminerait la géométrie pour
   toute la session, sans la moindre erreur en console. */
const lerp = (a, b, k) => a + (b - a) * k;
setInterval(() => {
  if (!vu || document.hidden) return;
  const U = orbe._u, k = 0.045;
  const sur = (a, b) => Number.isFinite(a) && Number.isFinite(b) ? lerp(a, b, k) : b;
  U.uC1.value.lerp(new THREE.Color(cible.c1), k);
  U.uC2.value.lerp(new THREE.Color(cible.c2), k);
  U.uC3.value.lerp(new THREE.Color(cible.c3), k);
  U.uRim.value.lerp(new THREE.Color(cible.rim), k);
  U.uDisp.value  = sur(U.uDisp.value,  cible.disp);
  U.uFreq.value  = sur(U.uFreq.value,  cible.freq);
  U.uSpeed.value = sur(U.uSpeed.value, cible.speed);
  U.uRimI.value  = sur(U.uRimI.value,  cible.rimI);
}, 1000 / 30);

/* ── L'ÉTAT ────────────────────────────────────────────────────────────────
   ⚠ GARDE DE FRAÎCHEUR. `status.json` peut rester sur « busy » avec un
   horodatage périmé : au-delà de 30 s sans battement, on considère que plus
   rien ne travaille. Le battement est posé par hooks/brain_battement.py, sur
   chaque appel d'outil. */
/* ⚠ UN SEUL SYSTÈME. Le jeu précédent mélangeait des RÔLES (GARDENER,
   ARCHIVIST) et des ACTIONS (FIXING, SAVING) : moins systémique que le reste de
   l'objet, et surtout faux — le jardinier porte à lui seul quatre activités,
   donc un nom de rôle ne dit pas ce qui se passe. L'orbe dit CE QUI SE FAIT.
   Tous les libellés sont donc des actions en -ING, exactement les noms d'état. */
const NOMS = { mapping:'MAPPING', auditing:'AUDITING', architecting:'ARCHITECTING',
  challenging:'CHALLENGING', filing:'FILING', archiving:'ARCHIVING',
  gardening:'GARDENING', correcting:'CORRECTING', working:'WORKING',
  distilling:'DISTILLING', synthesizing:'SYNTHESIZING', committing:'COMMITTING' };
/* ⚠ 20/09 — DYLAN A RENOMMÉ LES AGENTS EN QUATRE VAISSEAUX (« on met les nouveaux
   noms », fiche renommage-agents-familles-2026-09-20). Quand l'activité appartient
   à un vaisseau, le libellé porte SON NOM et l'action descend dans la ligne du
   dessous : « NOSTROMO » puis « auditing · hooks and links ». La table suit
   `hooks/brain_upkeep.py` (ACT) et `hooks/brain_status.py` : auditing = mécanicien,
   mapping/filing = jardinier.

   ⚠ 20/09 au soir — LA SESSION ENTRE DANS LA FAMILLE, elle aussi. Version d'avant :
   working, committing et correcting gardaient leur -ING « parce qu'ils n'ont pas
   d'auteur parmi les vaisseaux ». Faux, et surtout invisible à l'usage — la session
   travaille QUASIMENT TOUT LE TEMPS, donc l'orbe affichait « WORKING » en permanence
   et un nom de vaisseau ne passait que quelques secondes par jour. l'auteur, en voyant
   l'écart : « j'avais nostromo mais là j'ai working je ne comprend pas », puis
   « doivent adopter des noms similaire également avec le même effet glow ».

   TORRENS, et le choix n'est pas libre. La série obéit à une règle mesurée le 20/09
   (fiche du renommage, § « ce que la recherche a trouvé ») : les vaisseaux d'Alien
   portent presque tous un nom tiré de JOSEPH CONRAD — Nostromo d'après le roman de
   1904, Narcissus d'après Le Nègre du Narcisse, Sulaco la ville de Nostromo. Le
   Torrens est le clipper dont Conrad a été second capitaine de novembre 1891 à juin
   1893 : le DERNIER navire où il a travaillé avant d'être écrivain. Et dans Alien:
   Isolation, l'USCSS Torrens est le vaisseau à bord duquel on est pendant qu'on va
   chercher l'enregistreur du Nostromo. C'est exactement la place de la session :
   le navire où l'on est, pendant que le travail se fait.
   MOTHER était le candidat évident et il est INTERDIT : le nom est pris depuis le
   14/08 par la signature visuelle du Brain (planete-mother-2026-08-14), et un
   homonyme a déjà coûté deux défauts ici.

   CONSÉQUENCE MÉCANIQUE : les douze états ont maintenant un vaisseau, donc `NOMS`
   ci-dessus ne sert plus que de filet pour un état inconnu. On le garde pour ça. */
const VAISSEAUX = { auditing:'NOSTROMO',
  mapping:'NARCISSUS', filing:'NARCISSUS', gardening:'NARCISSUS', distilling:'NARCISSUS',
  challenging:'SULACO', architecting:'SULACO', archiving:'SULACO',
  synthesizing:'ANESIDORA',
  working:'TORRENS', committing:'TORRENS', correcting:'TORRENS' };

const dit   = document.getElementById('dit');
const fiche = document.getElementById('fiche');
const pave = document.getElementById('pave');
const rouleau = pave.querySelector('.rouleau');
let dernier = null;

/* ── LE FLUX D'ÉCRITURE RÉEL ────────────────────────────────────────────────
   `~/.claude/companion/sessions/<id>.jsonl` : une ligne par outil d'écriture,
   avec le diff unifié réellement appliqué. C'est la MÊME source que le panneau
   live du compagnon — pas un fichier d'agent figé comme dans l'ancienne capsule.
   ⚠ On prend le fichier le plus RÉCEMMENT ÉCRIT, pas le plus récemment créé :
     plusieurs sessions peuvent être ouvertes, seule celle qui travaille compte. */
const FLUX = path.join(os.homedir(), '.claude', 'companion', 'sessions');
const LARGEUR = 19;    // caractères tenables dans 78 px à 6 px de fonte
const GARDE   = 90;    // lignes conservées : au-delà, on paie du DOM invisible
let fluxFichier = null, fluxTaille = 0, lignes = [], dernierFichier = null;

/* ── LA LIGNE « SUR QUOI » ──────────────────────────────────────────────────
   `status.json` porte déjà un champ `detail`, mais il est HÉTÉROGÈNE selon qui
   l'écrit — et c'est ça, tout le travail ici :
     · `on_fiche_write.py` y met un slug de fiche nu ...... `format-arbre-projet`
     · `brain_upkeep.py`  y met « agent : raison » ........ `jardinier: 3 à ranger`
     · `on_fiche_write.py` y met aussi de la prose ........ `mise à jour de la carte`
     · `brain_battement.py` (mes propres passes) .......... rien du tout
   Un slug se résout en VRAI TITRE ; une phrase s'affiche telle quelle ; et
   l'absence se rattrape sur le dernier fichier écrit. Sans ce dernier cas la
   ligne serait vide pendant les passes les plus longues — donc absente pile
   quand on regarde, exactement le défaut déjà corrigé sur le pavé.
   ⚠ Tout est mis en cache, échecs compris : la résolution ouvre des dossiers,
     et `lire()` tourne toutes les 700 ms. */
const TRONC = path.join(os.homedir(), '.c-brain', 'trunk');
const RACINES = ['lessons', 'meta', 'life', 'projects', 'agents', 'sessions'];
const cacheTitre = {};

function cheminFiche(slug) {
  for (const r of RACINES) {
    const base = path.join(TRONC, r);
    const direct = path.join(base, slug + '.md');
    try { if (fs.existsSync(direct)) return direct; } catch (e) {}
    // un seul niveau de sous-dossier : `projects/<projet>/<slug>.md`
    try {
      for (const sous of fs.readdirSync(base, { withFileTypes: true })) {
        if (!sous.isDirectory()) continue;
        const p = path.join(base, sous.name, slug + '.md');
        if (fs.existsSync(p)) return p;
      }
    } catch (e) {}
  }
  return null;
}

/** Titre lisible d'une fiche : frontmatter `title:`, sinon premier `# `,
 *  sinon le slug rendu lisible. Jamais d'exception vers l'appelant. */
function titreDeFichier(p, repli) {
  try {
    const tete = fs.readFileSync(p, 'utf8').slice(0, 2000).split('\n');
    for (const l of tete) {
      const m = l.match(/^title:\s*["']?(.+?)["']?\s*$/);
      if (m) return m[1];
    }
    for (const l of tete) {
      const m = l.match(/^#\s+(.+?)\s*$/);
      if (m) return m[1];
    }
  } catch (e) {}
  return repli;
}

function surQuoi(detail) {
  const brut = (detail || '').trim();
  if (brut) {
    if (cacheTitre[brut] !== undefined) return cacheTitre[brut];
    let sortie = brut;
    // un slug nu — pas d'espace, pas de deux-points — se résout en titre
    if (/^[a-z0-9][a-z0-9-]*$/.test(brut)) {
      const p = cheminFiche(brut);
      sortie = p ? titreDeFichier(p, brut.replace(/-/g, ' ')) : brut.replace(/-/g, ' ');
    }
    return cacheTitre[brut] = sortie;
  }
  // repli : le dernier fichier réellement écrit
  if (!dernierFichier) return '';
  if (cacheTitre['~' + dernierFichier] !== undefined) return cacheTitre['~' + dernierFichier];
  const nom = dernierFichier.split('/').pop();
  let sortie = nom;
  if (nom.endsWith('.md')) {
    const p = path.join(TRONC, dernierFichier);
    sortie = titreDeFichier(p, nom.replace(/\.md$/, '').replace(/-/g, ' '));
  }
  return cacheTitre['~' + dernierFichier] = sortie;
}

function fichierActif(sansAge) {
  try {
    let best = null, bestTs = 0;
    for (const f of fs.readdirSync(FLUX)) {
      if (!f.endsWith('.jsonl')) continue;
      const st = fs.statSync(path.join(FLUX, f));
      if (st.mtimeMs > bestTs) { bestTs = st.mtimeMs; best = path.join(FLUX, f); }
    }
    // Un flux qui n'a pas bougé depuis 3 min ne raconte plus le présent.
    return (best && (sansAge || Date.now() - bestTs < 180000)) ? best : null;
  } catch (e) { return null; }
}

function classe(l) {
  if (l.startsWith('@@')) return 'tete';
  if (l.startsWith('+'))  return 'plus';
  if (l.startsWith('-'))  return 'moins';
  return '';
}

/* ── LE REPLI ───────────────────────────────────────────────────────────────
   Quand aucun diff n'est arrivé depuis 3 min, le pavé se vidait et l'orbe
   redevenait muette ALORS QU'UN AGENT TRAVAILLE — c'est précisément le moment
   où l'on regarde. Un agent passe de longues minutes à lire et réfléchir sans
   rien écrire : « rien n'a été écrit » ne veut pas dire « rien ne se passe ».
   On retombe donc sur le fichier que CET agent exécute — le comportement de
   l'ancienne capsule, gardé ici comme filet et non comme source principale. */
/* Depuis le 2026-09-20 les 8 agents sont regroupés en 4 VAISSEAUX. Le fichier de
   repli est celui de la FAMILLE ; plusieurs activités tombent donc sur le même,
   ce qui est exact : c'est bien ce fichier-là que l'agent exécute. */
const SOURCE_AGENT = {
  distilling:'agents/narcissus.md', gardening:'agents/narcissus.md',
  filing:'agents/narcissus.md', correcting:'agents/narcissus.md',
  mapping:'agents/narcissus.md', architecting:'agents/sulaco.md',
  challenging:'agents/sulaco.md', archiving:'agents/sulaco.md',
  synthesizing:'agents/anesidora.md', auditing:'hooks/brain_upkeep.py',
  committing:'hooks/auto_maintain.py', working:'hooks/auto_maintain.py' };
const cacheAgent = {};
function lignesAgent(etat) {
  const rel = SOURCE_AGENT[etat];
  if (!rel) return [];
  if (cacheAgent[rel]) return cacheAgent[rel];
  try {
    const brut = fs.readFileSync(path.join(os.homedir(), '.c-brain', 'trunk', rel), 'utf8');
    return cacheAgent[rel] = brut.split('\n')
      .map(l => l.replace(/\t/g, '  ').trim())
      // ⚠ Les fiches d'agent sont du Markdown : sans ce tri, une fente sur
      //   quatre affiche « --- », « ``` » ou une ligne de tableau. Le pavé doit
      //   ressembler à du travail, pas à de la ponctuation qui défile.
      .filter(l => l.length > 2 && !/^[-`#*_|>=:\s]+$/.test(l))
      .slice(0, 400)
      .map(l => ({ t: l.slice(0, LARGEUR), c: '' }));
  } catch (e) { return cacheAgent[rel] = []; }
}

// ⚠ l'auteur, 24/09 : « surtout en anglais et anonymiser ». En tournage, le pavé
//   ne lit AUCUN fichier réel : il déroule un code neutre, en anglais, inventé
//   pour la vidéo. Sinon une fiche personnelle défile, lisible à l'image.
const PAVE_TOURNAGE = {
  synthesizing: `── notes/digest.ts
+ export async function weeklyDigest(notes) {
+   const themes = groupBy(notes, n => n.topic);
+   for (const [topic, items] of themes) {
+     const links = items.flatMap(n => n.links);
+     if (links.length < 2) continue;
+     digest.push({ topic, summary: merge(items) });
+   }
-   return notes.map(n => n.title);
+   return rank(digest, { by: 'reuse' });
+ }
  const merge = items => items
    .map(n => n.lesson)
    .filter(Boolean)
    .join('\\n');
+ // cross-project patterns only
+ const rank = (xs, o) => xs.sort(score(o));`,
  autre: `── src/index/graph.ts
+ export function mapLayout(nodes, edges) {
+   const seen = new Set();
+   for (const e of edges) {
+     if (!seen.has(e.from)) place(e.from);
+     link(e.from, e.to, e.weight);
+   }
-   return nodes;
+   return settle(nodes, { steps: 120 });
+ }
  function place(id) {
    seen.add(id);
    grid.put(id, nearestFree(id));
  }
+ // commit: 3 files changed
+ git.add(['graph.ts', 'layout.ts']);
+ git.commit('map layout: stable seeds');`,
};
const cachePave = {};
function paveTournage(etat) {
  const cle = PAVE_TOURNAGE[etat] ? etat : 'autre';
  return cachePave[cle] || (cachePave[cle] = PAVE_TOURNAGE[cle].split('\n')
    .map(t => ({ t: t.slice(0, LARGEUR), c: t.startsWith('──') ? 'tete' : classe(t) })));
}

function lireFlux(etat) {
  if (process.env.CAPSULE_TOURNAGE === '1') {
    const l = paveTournage(etat);
    if (lignes === l) return false;
    lignes = l; return true;
  }
  let f = fichierActif();
  // ⚠ l'auteur, 24/09 : « l'écriture dans l'orbe a encore disparu ». Cause : sans
  //   diff écrit depuis 3 min, `working` n'a pas de fichier d'agent de repli
  //   (SOURCE_AGENT) → pavé vide. Dans la barre de menus, la dernière écriture
  //   réelle, même ancienne, vaut mieux qu'une orbe muette pendant le travail.
  if (!f && HOTE && !lignesAgent(etat).length) f = fichierActif(true);
  if (!f) {
    const repli = lignesAgent(etat);
    // ⚠ ne renvoyer `true` que si le contenu CHANGE : sinon on repeint le pavé
    // à chaque tour de `lire()` et le défilement repart de zéro sans arrêt.
    if (lignes === repli) return false;
    lignes = repli; fluxFichier = null; fluxTaille = 0;
    return true;
  }
  let taille = 0;
  try { taille = fs.statSync(f).size; } catch (e) { return false; }
  // ⚠ Ne relire QUE si le fichier a grossi. Sans ce garde, on redécoupe un
  //   fichier de 100 Ko toutes les 1,5 s pour rien, et le pavé se reconstruit
  //   entièrement — donc il scintille alors que rien n'a été écrit.
  if (f === fluxFichier && taille === fluxTaille) return false;
  fluxFichier = f; fluxTaille = taille;
  let brut = '';
  try { brut = fs.readFileSync(f, 'utf8'); } catch (e) { return false; }
  const out = [];
  for (const ligne of brut.split('\n').slice(-40)) {
    if (!ligne.trim()) continue;
    let j; try { j = JSON.parse(ligne); } catch (e) { continue; }
    if (j.type !== 'diff' || !Array.isArray(j.diff)) continue;
    // Retenu pour la ligne « sur quoi » : quand `status.json` n'a pas de
    // `detail` — le cas de mes propres passes, où le battement écrit
    // « working » sans rien d'autre — le dernier fichier réellement écrit est
    // le seul repère disponible, et c'est le bon.
    dernierFichier = j.rel || j.file || dernierFichier;
    out.push({ t: '── ' + (j.rel || j.file || '?'), c: 'tete' });
    for (const d of j.diff) {
      // ⚠ L'INDENTATION DÉCENTRAIT TOUT LE PAVÉ (2026-08-08). Les lignes sont
      //   CENTRÉES dans le disque, et `white-space:pre` conserve les espaces de
      //   tête : une ligne indentée de douze espaces se centre AVEC eux, donc
      //   son texte part vers la droite et sort du masque, pendant que la moitié
      //   gauche du pavé reste vide. Visible dès qu'on regarde un fichier de
      //   code profondément imbriqué — un shader, typiquement. On garde deux
      //   espaces : assez pour voir qu'il y a un niveau, pas assez pour pousser
      //   la ligne hors du disque. Et ça rend aussi 10 caractères utiles sur 19.
      // ⚠ LE SIGNE DE DIFF PASSE AVANT L'INDENTATION — « +          vec3 x ». Un
      //   premier essai n'ancrait le motif que sur l'espace (`^ {3,}`) : il ne
      //   matchait donc AUCUNE ligne ajoutée ou retirée, c'est-à-dire presque
      //   tout le pavé, et la planche est revenue identique. Le signe se capture
      //   et se repose, sinon `classe()` ne reconnaît plus la ligne.
      const t = d.replace(/\t/g, '  ').replace(/\s+$/, '')
                 .replace(/^([+-]?) {2,}/, '$1 ');
      if (!t) continue;
      out.push({ t: t.slice(0, LARGEUR), c: classe(t) });
    }
  }
  lignes = out.slice(-GARDE);
  return true;
}

/* ── LE PAVÉ COURBÉ ─────────────────────────────────────────────────────────
   `FENTES` lignes fixes dans le DOM, réutilisées à chaque tour : on ne
   reconstruit rien, on ne fait que déplacer. Reconstruire 30 nœuds toutes les
   90 ms ferait recalculer la mise en page en continu pour 96 px de large.
   Chaque fente k occupe une latitude θ ∈ ]−90°, +90°[ :
     y  = R·sin θ        → les latitudes se tassent vers les pôles
     sx = cos θ          → la ligne se resserre comme la corde d'un cercle
   Le défilement fait glisser les latitudes, pas le bloc : le texte remonte le
   long de la sphère au lieu de traverser un rectangle.
   ⚠ Animé par `transform`, jamais par `top` : `top` refait la mise en page à
     chaque image et fait travailler tout le compositeur pour 96 px. */
const FENTES = 18, RAYON_TXT = 37;
const fentes = [];
for (let k = 0; k < FENTES; k++) {
  const d = document.createElement('div');
  d.className = 'l';
  rouleau.appendChild(d);
  fentes.push(d);
}

let defilement = 0;
function tournerPave() {
  if (!occupe || !lignes.length || !vu || document.hidden) return;
  // ⚠ RÉGLÉ EN TROIS FOIS, et les deux premiers essais ont dépassé la cible dans
  //   les deux sens — 0,055 (0,6 ligne/s) : on croyait l'orbe figée ; 0,13
  //   (2,2 lignes/s) : le texte fuyait, illisible même du coin de l'œil.
  //   La bonne vitesse n'est pas « lisible » ni « vivante », c'est SUIVABLE :
  //   l'œil doit pouvoir accrocher une ligne et la perdre sans effort.
  //   0,075 ≈ 1,25 ligne/s.
  if (!REDUIT) defilement += 0.075;
  const base = Math.floor(defilement), frac = defilement - base;
  for (let k = 0; k < FENTES; k++) {
    const d = fentes[k];
    // 0,97 plutôt que 1 : à l'exacte verticale du pôle, cos θ vaut 0 et la
    // ligne disparaît en un trait — on s'arrête juste avant.
    const th = (((k - frac) / (FENTES - 1)) - 0.5) * Math.PI * 0.97;
    const y  = RAYON_TXT * Math.sin(th);
    const sx = Math.cos(th);
    const l  = lignes[(base + k) % lignes.length];
    if (d._t !== l.t) { d.textContent = l.t; d._t = l.t; }
    if (d._c !== l.c) { d.className = 'l' + (l.c ? ' ' + l.c : ''); d._c = l.c; }
    d.style.transform = `translate(0, ${(37 + y).toFixed(1)}px) scaleX(${sx.toFixed(3)})`;
    // la matière est plus épaisse vue de biais : le texte s'y noie
    d.style.opacity = (0.50 + 0.50 * Math.pow(sx, 0.9)).toFixed(2);
  }
}
// 60 ms plutôt que 90 : à la nouvelle vitesse, un pas de 90 ms se voit
// avancer par crans le long des latitudes.
setInterval(tournerPave, 60);

/* Les fentes sont permanentes : peindre ne fait qu'ouvrir ou fermer le pavé,
   le contenu est posé par `tournerPave` à chaque tour. */
function peindrePave() {
  if (!lignes.length) { pave.classList.remove('vu'); return; }
  if (occupe) { pave.classList.add('vu'); tournerPave(); }
}

// ?seule / ?ilot : l'orbe est dans la pastille ou le panneau de la barre de
// menus, et c'est la page hôte (ilot.html) qui lui DIT l'état. l'auteur, 24/09 :
// « la sphère ne montre qu'un seul état même si elle passe à d'autres couleurs
// ou vaisseaux » — en lisant le fichier de son côté, elle avait sa propre
// garde de fraîcheur (30 s contre 180 pour la pastille) et pouvait ne pas
// suivre ce que disait le panneau. Une seule source maintenant : l'hôte.
const HOTE = !!(document.documentElement.dataset.seule || document.documentElement.dataset.ilot);
let impose = null;
if (HOTE) window.addEventListener('message', (e) => {
  if (e.data && e.data.ilot) { impose = e.data.ilot; lire(); }
});
function lire() {
  let st = { state:'idle' };
  if (HOTE) st = impose ? Object.assign({}, impose, { ts: Date.now() / 1000 }) : st;
  else try { st = JSON.parse(fs.readFileSync(STATUT, 'utf8')); } catch (e) {}
  // Dans l'encoche, la fin est dite par le hook Stop (`idle` écrit à la fin de
  // la réponse) : la garde de fraîcheur n'est plus qu'un filet si la session
  // meurt. À 30 s, elle faisait rentrer l'orbe pendant que Claude réfléchissait.
  const frais = (Date.now()/1000 - (st.ts || 0)) < (ENCOCHE ? 180 : 30);
  const etat = (st.state === 'busy' && frais) ? (st.activity || 'working') : 'idle';
  // ⚠ Le flux grossit SANS que l'état change : un même agent écrit des dizaines
  //   de fois d'affilée. Le sortir du garde `etat === dernier` est le seul moyen
  //   de voir arriver autre chose que le premier diff de chaque agent.
  occupe = etat !== 'idle';
  if (ENCOCHE && !force) sortir(occupe);
  // ⚠ AVANT le garde `etat === dernier`, et c'est tout l'intérêt : le DÉTAIL
  //   change sans que l'état bouge — « FILING » reste « FILING » pendant que
  //   l'agent passe d'une fiche à l'autre. Posée après le garde, cette ligne
  //   serait figée sur la première fiche de chaque passe. Même classe de défaut
  //   que le pavé qui ne se rallumait pas.
  if (occupe) {
    const sur = surQuoi(st.detail);
    // un vaisseau au libellé → l'action passe ici, devant le « sur quoi »
    const quoi = VAISSEAUX[etat] ? (sur ? etat + ' · ' + sur : etat) : sur;
    if (fiche._t !== quoi) { fiche.textContent = quoi; fiche._t = quoi; }
    fiche.classList.toggle('vu', !!quoi);
  } else { fiche.classList.remove('vu'); }
  // ⚠ AVANT : `if (lireFlux(etat)) peindrePave();` — le pavé n'était RALLUMÉ
  //   que si le contenu venait de changer. Or `lireFlux` renvoie `false` dès que
  //   le fichier n'a pas grossi (et le repli renvoie le même tableau). Donc un
  //   agent qui reprend le travail après un passage au repos, sans écrire dans
  //   la seconde, laissait le pavé ÉTEINT pour toute sa passe. Le contenu était
  //   là, la classe `vu` ne revenait jamais. Vu sur planche : orbe muette sur
  //   tous les états de travail sauf le premier.
  //   La lecture peut être conditionnelle ; l'affichage, non.
  if (occupe) { lireFlux(etat); peindrePave(); }
  else { pave.classList.remove('vu'); }
  if (etat === dernier) return;
  dernier = etat;
  // l'état est porté sur le body : utile au style, et lisible au débogage
  document.body.dataset.etat = etat;
  cible = reglage(etat);
  if (!REDUIT) orbe.setMecanique(cible.meca);
  if (occupe) {
    // textContent effacerait les points : on repose le libellé puis les trois
    // spans, qui portent chacun leur propre décalage d'animation.
    // Le nom vit dans son propre span : la brillance chromatique ne doit
    // toucher que lui, jamais les trois points qui le suivent.
    const nom = document.createElement('span');
    nom.className = VAISSEAUX[etat] ? 'nom brille' : 'nom';
    nom.textContent = VAISSEAUX[etat] || NOMS[etat] || etat.toUpperCase();
    dit.replaceChildren(nom);
    for (let i = 0; i < 3; i++) {
      const pt = document.createElement('span');
      pt.className = 'pt'; pt.textContent = '.';
      dit.appendChild(pt);
    }
    dit.classList.add('vu');
  }
  else dit.classList.remove('vu');
  majCadence();
}
setInterval(lire, 700);
/* Exposé pour le TOURNAGE PAS À PAS (banc/film.cjs, FILM_PAS). Là-bas l'horloge
   de la page est gelée et avancée d'un soixantième de seconde à la fois : si le
   changement d'état attendait le minuteur ci-dessus, il tomberait n'importe où
   dans une fenêtre de 0,7 s et chaque état n'occuperait plus le même nombre
   d'images. Le film appelle donc la lecture lui-même, juste après avoir écrit
   status.json. Rien d'autre ne s'en sert, et la page se comporte pareil sans. */
window.__lire = lire;
lire();

/* ── COMBIEN DE FICHES RESTENT À TRAITER ────────────────────────────────────
   Demande de l'auteur (2026-08-14) : « à chaque fois que l'orbe est lancé, elle
   doit afficher une petite pastille notifiant combien de fiches elle doit
   encore traiter ».
   Source de vérité : `state/a-classer.md`, alimenté automatiquement par
   `hooks/on_fiche_write.py`. Jusqu'au 2026-09-15 c'était l'Inbox de MEMORY.md ; elle en
   est sortie parce qu'une seule ligne d'Inbox faisait refuser tous les commits (budget
   de la carte + ADR-0015).
   C'est le SEUL endroit qui dit ce qui attend, et il est déjà tenu à jour —
   on ne recompte rien, on lit.
   ⚠ Cadence lente exprès : `lire()` tourne à 700 ms pour l'état de l'agent,
   mais l'Inbox ne bouge qu'à l'écriture d'une fiche. La relire 85 fois par
   minute coûterait sans rien apprendre. 20 s suffisent, plus un appel au
   lancement pour que la pastille soit juste dès la première image. */
const RESTANT_EL = document.getElementById('restant');
const A_CLASSER = path.join(os.homedir(), '.c-brain', 'trunk', 'state', 'a-classer.md');

function compterEnAttente() {
  let t;
  try { t = fs.readFileSync(A_CLASSER, 'utf8'); }
  catch (e) { return e.code === 'ENOENT' ? 0 : null; }   // pas de file = rien en attente
  return t.split('\n').filter(l => l.trim().startsWith('- [')).length;
}

/* Le compteur affiche « 2/4 » : où on en est dans le LOT en cours.
   Le reste à traiter se lit dans MEMORY.md, mais le TOTAL du lot, lui, ne s'y
   lit nulle part — dès qu'une fiche est rangée elle disparaît de l'Inbox. On
   mémorise donc le plus haut niveau atteint dans `state/orbe-lot.json`, ce qui
   fait aussi survivre le lot à un relancement de l'orbe (sinon « 3/4 » se
   retomberait à « 1/2 » au prochain démarrage, et la progression mentirait).
   Le lot se referme tout seul quand l'Inbox se vide. */
const LOT = path.join(os.homedir(), '.c-brain', 'trunk', 'state', 'orbe-lot.json');

function lireLot() {
  try { return JSON.parse(fs.readFileSync(LOT, 'utf8')).total | 0; } catch (e) { return 0; }
}
function ecrireLot(total) {
  try { fs.writeFileSync(LOT, JSON.stringify({ total, maj: new Date().toISOString() })); }
  catch (e) {}
}

function majRestant() {
  const reste = compterEnAttente();
  if (reste === null) return;                  // lecture ratée : on garde l'affichage précédent

  if (reste === 0) {                           // lot terminé : le compteur s'efface et se remet à zéro
    RESTANT_EL.classList.remove('vu');
    if (lireLot() !== 0) ecrireLot(0);
    return;
  }
  let total = lireLot();
  if (reste > total) { total = reste; ecrireLot(total); }   // de nouvelles fiches agrandissent le lot

  // reste=4 sur 4 -> « 1/4 » (on est sur la première) ; reste=1 -> « 4/4 » ; reste=0 -> effacé.
  const rang = total - reste + 1;
  RESTANT_EL.innerHTML = rang + '<span class="tot">/' + total + '</span>';
  RESTANT_EL.title = rang + ' sur ' + total + ' — ' + reste
                   + (reste > 1 ? ' fiches restent à ranger' : ' fiche reste à ranger');
  RESTANT_EL.classList.add('vu');
}
majRestant();
setInterval(majRestant, 20000);


/* ── ATTRAPER L'ORBE ────────────────────────────────────────────────────────
   La fenêtre laisse passer les clics (`setIgnoreMouseEvents(true, {forward:true})`)
   sinon elle avalerait tout un carré de 150 px du bureau. `forward:true` fait
   quand même remonter les mouvements de souris : on s'en sert pour savoir quand
   le curseur est SUR l'orbe, et on ne redonne la main à la fenêtre qu'à ce
   moment-là.
   ⚠ On teste un DISQUE, pas le rectangle de la fenêtre : dans les coins, le
     pixel est transparent — y bloquer le clic rendrait mort un bout de bureau
     où l'utilisateur ne voit rien. */
const RAYON = 62;   // px, l'orbe occupe ~124 px de large dans une fenêtre de 150
let surOrbe = false, attrape = false;

function dansOrbe(e) {
  const dx = e.clientX - window.innerWidth  / 2;
  const dy = e.clientY - window.innerHeight / 2;
  return dx * dx + dy * dy <= RAYON * RAYON;
}

window.addEventListener('mousemove', (e) => {
  if (attrape) return;                 // pendant le glissé, la main reste prise
  if (ENCOCHE) return;                 // rien à attraper : le clic traverse
  const dedans = dansOrbe(e);
  if (dedans === surOrbe) return;      // n'envoyer qu'aux TRANSITIONS
  surOrbe = dedans;
  document.body.style.cursor = dedans ? 'grab' : 'default';
  ipcRenderer.send('cap-interactive', dedans);
});

window.addEventListener('mousedown', (e) => {
  if (ENCOCHE) return;                 // l'orbe de l'encoche ne se déplace pas
  if (e.button !== 0 || !dansOrbe(e)) return;
  attrape = true;
  document.body.style.cursor = 'grabbing';
  // ⚠ Le suivi du curseur se fait DANS LE PROCESSUS PRINCIPAL, pas ici. En
  //   glissant vite, le curseur sort de la fenêtre : le renderer cesse alors de
  //   recevoir les mouvements et l'orbe resterait plantée en arrière du geste.
  ipcRenderer.send('cap-drag-begin', { x: e.clientX, y: e.clientY });
});

const lacher = () => {
  if (!attrape) return;
  attrape = false;
  document.body.style.cursor = surOrbe ? 'grab' : 'default';
  ipcRenderer.send('cap-drag-end');
};
window.addEventListener('mouseup', lacher);
window.addEventListener('blur', lacher);   // filet : relâché hors de la fenêtre

/* L'animation s'arrête quand personne ne la voit : fenêtre cachée, écran
   éteint. Sans ça elle peint pour personne et fait recomposer WindowServer. */
ipcRenderer.on('cap-visible', (_e, v) => { vu = v; majCadence(); });
document.addEventListener('visibilitychange', majCadence);
</script>
