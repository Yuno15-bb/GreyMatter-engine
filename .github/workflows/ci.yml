# C Brain — CI
#
# SCOPE, AND WHY IT STOPS THERE. This does NOT run a full install: launchd
# jobs and an Electron capsule on a hosted macOS runner are a swamp, and they
# would buy almost nothing — the flags `--no-launchd --no-capsule` skip exactly
# the two parts a runner cannot judge. What is left is the part that actually
# breaks: the leak check, the translation, the installer, the trunk invariants,
# and whether a migration survives being replayed.
#
# The three gestures of the release chain (sync, translate, tag) are human and
# unwatched. This is the machine watching the second one.

name: CI

on:
  push:
    branches: [main, fr]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  leak:
    name: leak check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # --history scans every commit, not the tip
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 leakcheck.py --history
      # Contre-épreuve de l'exception « leurres de test » : prouve que les
      # valeurs déclarées passent ET que tout le reste rougit encore. Sans elle,
      # l'exception serait un trou qui s'ignore.
      - run: python3 tests/leakcheck_fixtures.py

  english:
    name: English only (main)
    runs-on: ubuntu-latest
    if: github.ref_name == 'main' || github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 tests/english_only.py

  plugin:
    name: plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # the version gate compares against the tags
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 tests/plugin_manifest.py
      # The manifests parsing is not the same thing as the plugin WORKING.
      # This runs the bootstrap the way Claude Code does — from a copy, on a
      # fresh HOME — because that is the path everyone from the marketplace
      # takes, and it was the one path nothing executed.
      - run: bash tests/plugin_install.sh

  recall:
    name: recall quality · cache freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # A stale index is worse than a slow one: recall would keep answering,
      # confidently, out of date. This runs first.
      - run: python3 tests/recall_cache.py
      # Both engines must index the SAME corpus. They drifted by 5 documents
      # under a comment claiming they did not — a comment never turns red.
      - run: python3 tests/shared_corpus.py --check
      # And the map must understand what the exporter writes. A field read and
      # never written is `undefined`: one section silently missing from every
      # panel. It happened to en_clair, at six read sites, for as long as it existed.
      - run: python3 tests/planet_contract.py --check
      # And the map must not ANNOUNCE a meaning it does not have. Embeddings are
      # optional by design, so the ordinary state of a fresh install is: no vectors
      # at all — and the viewer still opened on "MEANING IN VOLUME — every note"
      # over a cloud where not one note had one. Measured on the rendered screen.
      # `node` is pinned rather than borrowed from the runner image: the label is
      # an ES module, and a bench that silently skips is the defect it tests for.
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: python3 tests/planet_semantic_honesty.py
      # The three sabotages. Each MUST fail; a green here is the alarm.
      - name: the semantic label cannot lie
        run: |
          set -euo pipefail
          for s in label-frozen-on-meaning coverage-counted-on-the-cache old-graph-assumed-ready; do
            if python3 tests/planet_semantic_honesty.py --sabotage "$s" >/dev/null 2>&1; then
              echo "❌ sabotage $s left the bench green"; exit 1
            fi
            echo "✅ sabotage $s reddens"
          done
      # And what the write hook does to a note the moment it lands: masking,
      # Inbox, unknown type, and the golden rule that it never blocks. Three of
      # those effects are wrapped in try/except, so a broken one is silent.
      - run: python3 tests/fiche_write_contract.py --check
      # The type vocabulary is written in the hook AND in the agent briefs.
      # Two copies of a contract always end up disagreeing.
      - run: python3 tests/type_vocabulary.py --check
      # And the doctor: silent on a healthy trunk, one anomaly per category, and
      # it ANNOUNCES a check it could not run. Its two vocabulary checks import
      # their reference from the hook that owns it — the test forbids falling
      # back on a local copy, which would make the doctor a third source of truth.
      - run: python3 tests/doctor_contract.py --check
      # And the global audit's first sentence. Two programs can supply its count of
      # notes and they do not count the same set — 726 woven notes against 946 markdown
      # files on the author's trunk. It used to take one as a default for the other under
      # one word, and printed None for the rest of the sentence. A report that cannot say
      # "I did not look" says nothing at all.
      - run: python3 tests/review_contract.py --check
      # And the four lines injected into EVERY session. The question is not
      # whether the regex finds things — it always does — but whether a line
      # that reaches the model earns its slot. Tested in pairs: something that
      # must be found, and something that must not, because an over-eager
      # filter passes by finding nothing at all.
      - run: python3 tests/anticipate_contract.py --check
      # And the thing the product is FOR: does the right note come back?
      # Gates are set below what the engine scores today, to catch a
      # regression rather than freeze a number.
      - run: python3 tests/recall_benchmark.py --check
      # And who owns a launchd identity. The first is static -- it reads the
      # shell sources and never invokes launchctl, because the dynamic proof is
      # the experiment that took the author's jobs over for 28 hours. The second
      # drives the library against a launchd domain that is a text file.
      - run: python3 tests/launchd_ownership.py
      - run: python3 tests/launchd_refusal.py
      - run: python3 tests/launchd_adoption.py
      - run: python3 tests/launchd_template_migration.py

  update:
    name: the update path keeps its language
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/update_tag_family.sh

  install:
    name: install · selftest · uninstall
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      # The capsule functions, read out of install.sh itself rather than copied:
      # the repair for an Electron that npm reports as installed and never
      # extracted, and the guard that keeps the shell's own "Abort trap: 6" out
      # of a successful install. This bench existed since 2026-08-17 and NOTHING
      # ran it — which is how a guard that had never worked shipped for a month
      # under a comment saying it did. It needs neither Electron nor the network:
      # it drives the extracted functions against a 2 KB stub. It self-skips off
      # macOS arm64, and this runner is macOS arm64 — so the skip is checked for
      # rather than trusted: a bench that quietly opts out is a green that tests
      # nothing, which is the exact shape of the defect above.
      - name: the capsule functions, exercised
        run: |
          set -euo pipefail
          # ⚠ THE REPORT IS PRINTED BEFORE IT IS JUDGED, and that is the whole
          #   point of the shape below. Until 2026-09-20 this step read
          #   `out="$(python3 …)"`: under `set -e` a red bench aborts the step AT
          #   THE ASSIGNMENT, so the report the bench had just written died inside
          #   the variable. The first time this step ever went red on a GitHub
          #   runner it printed NOTHING — ten lines of measurement and a named
          #   cause, none of them readable, and the only way to learn anything was
          #   to change the workflow and push again. `tee` puts the lines in the
          #   log as they are produced, and `pipefail` keeps the bench's own exit
          #   code, so a red is still a red.
          python3 tests/capsule_runtime.py | tee "$RUNNER_TEMP/capsule.out"
          if grep -q skipped "$RUNNER_TEMP/capsule.out"; then
            echo "❌ capsule_runtime opted out on a runner that must run it"; exit 1
          fi

      - name: dry run writes nothing
        run: |
          set -euo pipefail
          H="$(mktemp -d)"
          HOME="$H" ./install.sh --dry-run --no-launchd --no-capsule
          # The point of --dry-run is that it is inert. Anything on disk is a bug.
          if [ -e "$H/.c-brain" ] || [ -e "$H/.claude" ]; then
            echo "❌ --dry-run created something:"; find "$H" | head -40; exit 1
          fi
          echo "✅ nothing written"

      - name: install, then verify
        run: |
          set -euo pipefail
          H="$(mktemp -d)"; echo "H=$H" >> "$GITHUB_ENV"
          # A hosted runner has no Claude Code, so install.sh would skip the
          # settings merge entirely and every check below would pass on an
          # absent file — green, and testing nothing. We put one there.
          mkdir -p "$H/.claude"
          printf '{"model": "opus", "permissions": {"allow": ["Bash(ls:*)"]}}\n' > "$H/.claude/settings.json"
          cp "$H/.claude/settings.json" "$RUNNER_TEMP/settings.before.json"
          HOME="$H" ./install.sh --no-launchd --no-capsule
          export PATH="$H/.local/bin:$PATH"
          HOME="$H" brain selftest
          HOME="$H" brain doctor
          # …and prove the merge actually happened, so the rest is not vacuous.
          grep -q hooks "$H/.claude/settings.json" || { echo "❌ settings.json was never merged"; exit 1; }
          # The visible door on a hidden folder: if it stops being created, a
          # user gets a memory they cannot find, and nothing else would notice.
          [ -L "$H/C Brain" ] || { echo "❌ the Finder shortcut was not created"; exit 1; }

      - name: install is idempotent
        run: |
          set -euo pipefail
          before="$(shasum -a 256 "$H/.claude/settings.json" | cut -d' ' -f1)"
          HOME="$H" ./install.sh --no-launchd --no-capsule >/dev/null
          after="$(shasum -a 256 "$H/.claude/settings.json" | cut -d' ' -f1)"
          [ "$before" = "$after" ] || { echo "❌ a second install changed settings.json"; exit 1; }
          echo "✅ second install is a no-op"

      - name: installing over somebody else's installation
        run: |
          set -euo pipefail
          # Its own HOMEs, built and thrown away inside the test: it must NOT
          # reuse $H, whose surfaces this job legitimately owns by now.
          bash tests/e2e_occupied_surfaces.sh
          # And the sabotages, because a contract that cannot redden proves
          # nothing. Each one must FAIL; a green here is the alarm.
          for s in silent-overwrite silent-statusline summary-swallowed; do
            if bash tests/e2e_occupied_surfaces.sh --sabotage "$s" >/dev/null 2>&1; then
              echo "❌ sabotage $s left the contract green"; exit 1
            fi
            echo "✅ sabotage $s reddens"
          done

      # THE FIRST END-TO-END CONTRACT, and until 2026-09-20 nothing ran it. It
      # was written on 2026-08-17 against "green component by component is not a
      # correct product", and then sat in tests/ for a month while CI checked the
      # components it exists to distrust — the same shape as the capsule bench
      # above, whose comment says so in as many words. A guard nobody runs is a
      # comment. It is wired here, on the one runner that can host it.
      - name: install → update → rollback, end to end
        run: |
          set -euo pipefail
          # ⚠ THE BENCH BUILDS ITS PATH FROM NOTHING — that is fault B1's guard,
          # and it must stay that way. But it reaches for node at /opt/homebrew/bin
          # only, which is where this author's Mac keeps it; a runner may not.
          # The selftest inside the bench would then fail for a reason that has
          # nothing to do with installing, and the log would read as a broken
          # updater. So node's real directory is handed over explicitly, and
          # NOTHING else: the host's ~/.local/bin stays out, and the bench's own
          # leak assertion still proves the `brain` it exercises is its own.
          NODE_BIN="$(command -v node || true)"
          [ -n "$NODE_BIN" ] || { echo "❌ no node on this runner at all"; exit 1; }
          export E2E_EXTRA_PATH="$(dirname "$NODE_BIN")"
          echo "node for the bench: $NODE_BIN"
          bash tests/e2e_install_update.sh
          # And the sabotages, each of which must FAIL. A green is the alarm.
          # `dirty-renames-engine` is the youngest: it puts back the `-dirty`
          # suffix retired on 2026-09-20, which named an engine after its
          # source's working tree while `git archive HEAD` had left that work out.
          for s in no-ownership dev-updated switch-before-selftest \
                   rollback-missing update-touches-trunk source-mutated \
                   host-brain-leak dirty-renames-engine; do
            if bash tests/e2e_install_update.sh --sabotage "$s" >/dev/null 2>&1; then
              echo "❌ sabotage $s left the contract green"; exit 1
            fi
            echo "✅ sabotage $s reddens"
          done

      - name: demo leaves no trace
        run: |
          set -euo pipefail
          export PATH="$H/.local/bin:$PATH"
          T="$H/.c-brain/trunk"
          before="$(shasum -a 256 "$T/MEMORY.md" | cut -d' ' -f1)"
          HOME="$H" brain demo
          HOME="$H" brain recall cache deploy | head -5
          HOME="$H" brain demo --remove
          after="$(shasum -a 256 "$T/MEMORY.md" | cut -d' ' -f1)"
          [ "$before" = "$after" ] || { echo "❌ MEMORY.md differs after a demo round trip"; exit 1; }
          echo "✅ MEMORY.md byte-identical"

      - name: update, then roll back, without touching a note
        run: |
          set -euo pipefail
          # Its own HOME: this one installs an OLD version from a local fake
          # upstream, so it must not share state with the install above.
          bash tests/update_rollback.sh

      - name: automatic updates apply, switch off, and undo themselves
        run: |
          set -euo pipefail
          # The path every installation now takes at session start. It runs
          # remote code without being asked: the one that least deserves to be
          # taken on trust.
          bash tests/update_auto.sh

      - name: uninstall gives the settings back, and keeps the trunk
        run: |
          set -euo pipefail
          HOME="$H" ./uninstall.sh --yes
          # NOT a byte comparison: uninstall rewrites the file through Python's
          # JSON serializer, so indentation and key spacing come back in its own
          # style. What must survive is the user's SETTINGS — every key they had,
          # untouched, and none of ours left behind.
          python3 - "$RUNNER_TEMP/settings.before.json" "$H/.claude/settings.json" <<'PY'
          import json, sys
          before, after = (json.load(open(p)) for p in sys.argv[1:3])
          if before != after:
              print("❌ settings.json did not come back:")
              print("  before:", json.dumps(before, sort_keys=True))
              print("  after :", json.dumps(after, sort_keys=True))
              sys.exit(1)
          print("✅ settings.json restored, key for key")
          PY
          if [ -e "$H/C Brain" ]; then echo "❌ the Finder shortcut survived uninstall"; exit 1; fi
          echo "✅ shortcut removed"
          # The trunk is the user's; uninstall must never take it.
          [ -d "$H/.c-brain/trunk" ] || { echo "❌ uninstall removed the trunk"; exit 1; }
          echo "✅ trunk still there"

  migrations:
    name: migrations replay clean
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: every migration, twice
        run: |
          set -euo pipefail
          for m in cbrain/migrations/*.sh; do
            H="$(mktemp -d)"
            mkdir -p "$H/claude-brain/lessons"
            echo "keep me" > "$H/claude-brain/lessons/a-note.md"
            echo "▸ $m — first run";  HOME="$H" bash "$m"
            echo "▸ $m — second run"; HOME="$H" bash "$m"
            # A replayed migration must be a non-event, and must never eat a note.
            grep -q "keep me" "$H/.c-brain/trunk/lessons/a-note.md" \
              || { echo "❌ $m lost a note on replay"; exit 1; }
          done
          echo "✅ migrations are idempotent and keep their notes"
