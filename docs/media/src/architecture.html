<!doctype html>
<meta charset="utf-8">
<title>GreyMatter — how a session becomes memory</title>
<style>
  html, body { margin:0; padding:0; background:transparent; }
  svg { display:block; font-family: Arial, Helvetica, "Helvetica Neue", sans-serif; }
</style>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1308" width="1000" height="1308">
  <defs>
    <filter id="ombre" x="-30%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="2.5" dy="3.5" stdDeviation="2.5" flood-color="#000" flood-opacity=".2"/>
    </filter>
    <marker id="pointe" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3C3C3C"/>
    </marker>
  </defs>
  <rect width="1000" height="1308" rx="14" fill="#FFFFFF"/>
  <text x="50" y="62" text-anchor="start" font-size="26" font-weight="700" fill="#1A1A1A">How a session becomes memory</text><text x="50" y="94" text-anchor="start" font-size="17" font-weight="400" fill="#555555">Everything runs on your machine. Nothing here is a service.</text><rect x="330" y="140" width="340" height="96" fill="#E9B824" filter="url(#ombre)"/><text x="500" y="183" text-anchor="middle" font-size="18" font-weight="700" fill="#1A1A1A">YOU WORK WITH YOUR AGENT</text><text x="500" y="207" text-anchor="middle" font-size="17" font-weight="400" fill="#1A1A1A">any project, any prompt</text><path d="M500,236 V287" fill="none" stroke="#3C3C3C" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#pointe)"/><rect x="330" y="291" width="340" height="118" fill="#8CB3F5" filter="url(#ombre)"/><text x="500" y="333" text-anchor="middle" font-size="18" font-weight="700" fill="#15224A">WHEN YOU ASK</text><text x="500" y="358" text-anchor="middle" font-size="17" font-weight="400" fill="#15224A">the few notes that match</text><text x="500" y="380" text-anchor="middle" font-size="17" font-weight="400" fill="#15224A">are handed to your agent</text><rect x="730" y="300" width="220" height="100" fill="#E8E8E8" filter="url(#ombre)"/><text x="840" y="334" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1A1A">lexical search</text><text x="840" y="356" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">2 ms at 1,000 notes</text><text x="840" y="377" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">15 ms at 5,000</text><path d="M670,350 H728" fill="none" stroke="#3C3C3C" stroke-width="2" stroke-dasharray="8 6" marker-start="url(#pointe)" marker-end="url(#pointe)"/><path d="M500,409 V460" fill="none" stroke="#3C3C3C" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#pointe)"/><rect x="330" y="464" width="340" height="96" fill="#8CB3F5" filter="url(#ombre)"/><text x="500" y="507" text-anchor="middle" font-size="18" font-weight="700" fill="#15224A">DURING THE SESSION</text><text x="500" y="531" text-anchor="middle" font-size="17" font-weight="400" fill="#15224A">what is written and read is noted</text><path d="M500,560 V611" fill="none" stroke="#3C3C3C" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#pointe)"/><rect x="330" y="615" width="340" height="118" fill="#8CB3F5" filter="url(#ombre)"/><text x="500" y="657" text-anchor="middle" font-size="18" font-weight="700" fill="#15224A">AT SESSION END</text><text x="500" y="682" text-anchor="middle" font-size="17" font-weight="400" fill="#15224A">the session is archived</text><text x="500" y="704" text-anchor="middle" font-size="17" font-weight="400" fill="#15224A">and the agents wake up</text><path d="M500,733 V784" fill="none" stroke="#3C3C3C" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#pointe)"/><rect x="330" y="788" width="340" height="128" fill="#E4DFC6" filter="url(#ombre)"/><text x="500" y="824" text-anchor="middle" font-size="18" font-weight="700" fill="#1A1A1A">EVERY TIME</text><text x="500" y="848" text-anchor="middle" font-size="17" font-weight="400" fill="#1A1A1A">the distiller turns the session</text><text x="500" y="871" text-anchor="middle" font-size="17" font-weight="400" fill="#1A1A1A">into notes; the gardener</text><text x="500" y="894" text-anchor="middle" font-size="17" font-weight="400" fill="#1A1A1A">files and links them</text><rect x="730" y="802" width="220" height="100" fill="#E8E8E8" filter="url(#ombre)"/><text x="840" y="836" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1A1A">the gardener runs</text><text x="840" y="858" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">only if the distiller</text><text x="840" y="879" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">succeeded</text><path d="M670,852 H728" fill="none" stroke="#3C3C3C" stroke-width="2" stroke-dasharray="8 6" marker-start="url(#pointe)" marker-end="url(#pointe)"/><path d="M500,916 V967" fill="none" stroke="#3C3C3C" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#pointe)"/><rect x="350" y="971" width="300" height="104" fill="#E4DFC6" filter="url(#ombre)"/><text x="500" y="1007" text-anchor="middle" font-size="17" font-weight="700" fill="#1A1A1A">SOMETIMES, AT MOST ONE</text><text x="500" y="1030" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">challenger · architect</text><text x="500" y="1052" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">archivist · mechanic</text><rect x="730" y="973" width="220" height="100" fill="#E8E8E8" filter="url(#ombre)"/><text x="840" y="1007" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1A1A">only when needed</text><text x="840" y="1029" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">its own sensor decides,</text><text x="840" y="1050" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">never twice in 12 h</text><path d="M650,1023 H728" fill="none" stroke="#3C3C3C" stroke-width="2" stroke-dasharray="8 6" marker-start="url(#pointe)" marker-end="url(#pointe)"/><path d="M500,1075 V1126" fill="none" stroke="#3C3C3C" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#pointe)"/><rect x="330" y="1130" width="340" height="118" fill="#1B7F3B" filter="url(#ombre)"/><text x="500" y="1172" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">YOUR TRUNK</text><text x="500" y="1197" text-anchor="middle" font-size="17" font-weight="400" fill="#FFFFFF">plain markdown on your disk,</text><text x="500" y="1219" text-anchor="middle" font-size="17" font-weight="400" fill="#FFFFFF">versioned with git</text><rect x="730" y="1139" width="220" height="100" fill="#E8E8E8" filter="url(#ombre)"/><text x="840" y="1173" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1A1A">three ways to look</text><text x="840" y="1195" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">the menu bar pill,</text><text x="840" y="1216" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">the map app, the brain CLI</text><path d="M670,1189 H728" fill="none" stroke="#3C3C3C" stroke-width="2" stroke-dasharray="8 6" marker-start="url(#pointe)" marker-end="url(#pointe)"/><path d="M330,1189 H200 V350 H326" fill="none" stroke="#3C3C3C" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#pointe)"/><text x="186" y="769.5" text-anchor="end" font-size="16" font-weight="700" fill="#1A1A1A">the next recall</text>
</svg>
