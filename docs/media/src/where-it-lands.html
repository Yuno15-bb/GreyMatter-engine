<!doctype html>
<!-- Source of docs/media/where-it-lands.png. Drawn, not screenshotted: a real
     capture would show either the author's machine or a temporary home nobody has.
     Render: docs/media/src/render.sh where-it-lands 940 386 -->
<html><head><meta charset="utf-8">
<style>
  :root { --win:#1c1f26; --side:#191b21; --bar:#23262e; --line:#2c3038;
          --txt:#d9dce3; --dim:#8a8f98; --folder:#8d939e; --red:#e5534b; }
  * { box-sizing:border-box; margin:0; }
  html,body { width:940px; height:386px; background:#fff;
    font:13px/1.35 -apple-system,"SF Pro Text","Helvetica Neue",sans-serif; }
  .win { position:absolute; left:0; top:0; width:940px; height:284px; border-radius:12px;
    background:var(--win); overflow:hidden; display:flex;
    box-shadow:0 24px 48px rgba(0,0,0,.22), 0 0 0 1px rgba(0,0,0,.35); }
  .side { width:172px; background:var(--side); border-right:1px solid var(--line); padding:52px 12px 0; }
  .side h6 { font-size:10.5px; letter-spacing:.08em; color:var(--dim); font-weight:600; margin:0 0 12px 8px; }
  .side div { color:var(--txt); padding:5px 8px 5px 38px; border-radius:6px; margin-bottom:2px; }
  .side .on { background:#2d3139; padding-left:14px; }
  .main { flex:1; }
  .bar { height:40px; background:var(--bar); border-bottom:1px solid var(--line);
    display:flex; align-items:center; padding-left:84px; color:var(--txt); font-weight:600; font-size:14px; }
  .dots { position:absolute; left:16px; top:14px; display:flex; gap:8px; }
  .dots i { width:12px; height:12px; border-radius:50%; display:block; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px 24px; padding:20px 20px 0; }
  .f { height:96px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; color:var(--txt); border-radius:10px; }
  .f svg { width:56px; height:42px; }
  .me { background:rgba(229,83,75,.12); box-shadow:inset 0 0 0 1px rgba(229,83,75,.35); font-weight:700; }
  .me b { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--red); margin-right:6px; vertical-align:1px; }
  .note { position:absolute; left:488px; top:300px; width:412px; padding:12px 16px; border-radius:10px;
    background:rgba(229,83,75,.08); border:1px solid rgba(229,83,75,.35); color:#9aa0a8; font-size:13px; }
  .note strong { color:#1c1f26; }
  .note code { font:12px ui-monospace,"SF Mono",Menlo,monospace; color:#6b7078; }
  svg.arrow { position:absolute; left:0; top:0; width:940px; height:386px; pointer-events:none; }
</style></head><body>
<div class="win">
  <div class="dots"><i style="background:#ec6a5e"></i><i style="background:#f4bf4f"></i><i style="background:#61c554"></i></div>
  <div class="side"><h6>FAVOURITES</h6>
    <div>Applications</div><div>Desktop</div><div>Documents</div><div>Downloads</div>
    <div class="on">🏠&nbsp; you</div></div>
  <div class="main"><div class="bar">you</div>
    <div class="grid" id="g"></div></div>
</div>
<svg class="arrow" viewBox="0 0 940 386"><defs><marker id="h" viewBox="0 0 10 10" refX="5" refY="5"
  markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e5534b"/></marker></defs>
  <path d="M486 332 C 440 332, 432 310, 444 290" fill="none" stroke="#e5534b" stroke-width="2" marker-end="url(#h)"/></svg>
<div class="note"><strong>This one is yours.</strong> The engine hides in <code>~/.greymatter</code> and is
replaced on every update. This shortcut opens your trunk — your notes — and nothing ever overwrites it.</div>
<script>
const folder = c => `<svg viewBox="0 0 56 42"><path d="M2 6a4 4 0 0 1 4-4h14l5 5h25a4 4 0 0 1 4 4v27a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4z" fill="${c}"/><path d="M2 13h52v25a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4z" fill="${c}" opacity=".85" style="filter:brightness(1.12)"/></svg>`;
const names = ["Applications","Desktop","Documents","Downloads","Movies","Music","Pictures"];
document.getElementById("g").innerHTML =
  names.map(n => `<div class="f">${folder("#8d939e")}<span>${n}</span></div>`).join("") +
  `<div class="f me">${folder("#e5534b")}<span><b></b>GreyMatter</span></div>`;
</script>
</body></html>
